function save(){localStorage.setItem('lukeQuestV2',JSON.stringify(s))}function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}function stopMoving(){if(moveTimer!==null){clearInterval(moveTimer);moveTimer=null}}function status(){return `<div class=card><div class=status><div class=stat><small>LV</small><b>${s.lv}</b></div><div class=stat><small>HP</small><b>${s.hp}/${s.mh}</b></div><div class=stat><small>G</small><b>${s.gold}</b></div><div class=stat><small>薬草</small><b>${s.potions}</b></div></div></div>`}function render(){if(s.screen!=='world')stopMoving();save();if(s.screen==='title')return title();if(s.screen==='intro')return story();if(s.screen==='battle')return battle();return world()}function title(){app.innerHTML=`<div class=card><div style="font-size:72px;text-align:center">🛡️⚔️</div><div class=title>LUKE QUEST</div><div class=sub>ルークと逃げた勇者<br>歩いて、話して、戦うオリジナル王道JRPG。</div><button class="btn gold" onclick="newGame()">冒険をはじめる</button>${localStorage.getItem('lukeQuestV2')?'<button class="btn gray" onclick="continueGame()">つづきから</button>':''}</div><div class=card><div class=notice>第一章：逃げた本命勇者レオンを追い、魔王軍の監視区域へ。</div></div>`}function newGame(){stopMoving();localStorage.removeItem('lukeQuestV2');s=structuredClone(DEFAULT);s.screen='intro';encounterGrace=0;render()}function continueGame(){stopMoving();if(!MAPS[s.map]){s.map='town';s.x=9;s.y=12}s.screen=s.screen==='title'?'world':s.screen;render()}function story(){let [sp,tx]=intro[s.step];app.innerHTML=status()+`<div class=card><div class=speaker>${sp}</div><div class=dialog>${tx}</div><button class="btn gold" onclick="nextIntro()">${s.step===intro.length-1?'王都へ':'つづける'}</button></div>`}function nextIntro(){s.step++;if(s.step>=intro.length){s.screen='world';s.step=0;s.map='town';s.x=9;s.y=12}render()}
function tileClass(c){if(c==='#')return'wall';if(c==='H')return'roof';if(c==='T')return'floor';if(c==='~')return'water';if(c==='*')return'tree';if(['G','F','D','R','Q','S','X','Y','Z'].includes(c))return'gate';if(c==='+')return s.map==='observation'?'ash':'mud';if(s.map==='observation')return'military';if(s.map==='mistTrail')return'mist';if(s.map==='deepForest')return'deep';if(s.map==='forest')return'forest';return'grass'}function tileEmoji(c){if(c==='H')return'🏠';if(c==='~')return'≈';if(c==='*')return'🌲';if(c==='F')return'🌲';if(['D','Q','X','Y'].includes(c))return'🌫️';if(c==='+')return'▪️';return''}function visibleNpcs(m){return m.npcs.filter(n=>!(n.kind==='leon'&&s.flags.leonSeen))}function npcClass(n){return n.kind==='glenn'?'npc glenn':'npc'}
function world(){let m=MAPS[s.map],vw=Math.min(640,window.innerWidth-24),vh=Math.min(Math.round(vw*1.25),window.innerHeight*.68),px=s.x*TS+5,py=s.y*TS+3,cx=vw/2-px-19,cy=vh/2-py-21;cx=Math.min(0,Math.max(vw-m.w*TS,cx));cy=Math.min(0,Math.max(vh-m.h*TS,cy));let tiles='';for(let y=0;y<m.h;y++)for(let x=0;x<m.w;x++){let c=m.tiles[y][x]||'#';tiles+=`<div class="tile ${tileClass(c)}" style="left:${x*TS}px;top:${y*TS}px">${tileEmoji(c)}</div>`}let npcs=visibleNpcs(m).map(n=>`<div class="${npcClass(n)}" style="left:${n.x*TS+5}px;top:${n.y*TS+3}px">${n.e}</div>`).join('');let tag=s.flags.glennSeen?'グレン確認':s.flags.glennTraceSeen?'魔王軍追跡':s.flags.leonSeen?'レオン発見':'勝利 '+s.wins;app.innerHTML=status()+`<div class=gameShell style="height:${vh}px"><div class=world style="width:${m.w*TS}px;height:${m.h*TS}px;transform:translate(${cx}px,${cy}px)">${tiles}${npcs}<div class=player style="left:${px}px;top:${py}px">🧑‍🦱</div></div><div class=hud><div class=chip>📍 ${m.name}</div><div class=chip>${tag}</div></div>${s.dialog?`<div class=dialogBox><div class=speaker>${s.dialog.name}</div><div class=dialog>${s.dialog.text}</div><div class=sub style="text-align:right">Aで閉じる</div></div>`:''}</div><div class=controls><div class=dpad><button class=up data-d=up>▲</button><button class=left data-d=left>◀</button><button class=down data-d=down>▼</button><button class=right data-d=right>▶</button></div><div class=actionPad><button class=a onclick=action()>A</button><button onclick="openMenu()">☰</button></div></div><div class=foot>LUKE QUEST v0.6 • autosave</div>`;bindControls()}
function currentNpcs(){return visibleNpcs(MAPS[s.map])}function blocked(x,y){let m=MAPS[s.map];if(x<0||y<0||x>=m.w||y>=m.h)return true;if(currentNpcs().some(n=>n.x===x&&n.y===y))return true;return ['#','H','~','*'].includes((m.tiles[y]||'')[x])}function encounterMap(){return ['field','forest','deepForest','mistTrail','observation'].includes(s.map)}function move(d){if(s.screen!=='world'){stopMoving();return}if(s.dialog){s.dialog=null;stopMoving();return render()}s.dir=d;let dx=d==='left'?-1:d==='right'?1:0,dy=d==='up'?-1:d==='down'?1:0,nx=s.x+dx,ny=s.y+dy;if(!blocked(nx,ny)){s.x=nx;s.y=ny;checkGate();if(s.screen!=='world'){stopMoving();return render()}if(checkStoryProximity())return;if(encounterMap()){if(encounterGrace>0)encounterGrace--;else if(Math.random()<.085)return startBattle()}}render()}
function checkGate(){let m=MAPS[s.map],c=(m.tiles[s.y]||'')[s.x];if(s.map==='town'&&c==='G'){s.map='field';s.x=10;s.y=15;encounterGrace=3;return}if(s.map==='field'&&c==='G'){s.map='town';s.x=9;s.y=13;return}if(s.map==='field'&&c==='F'){if(s.wins<2){s.x=20;s.y=1;s.dialog={name:'王都守備兵の立札',text:'この先は魔物が濃い。最低でも草原で2勝してから進め。\nルーク「立札にまで戦績を管理されてる……。」'};stopMoving()}else{s.map='forest';s.x=11;s.y=18;encounterGrace=4}return}if(s.map==='forest'&&c==='G'){s.map='field';s.x=20;s.y=1;encounterGrace=3;return}if(s.map==='forest'&&c==='D'){s.map='deepForest';s.x=11;s.y=20;encounterGrace=4;s.dialog={name:'ナレーション',text:'金色の布片は裂け目の奥へ続いていた。'};stopMoving();return}if(s.map==='deepForest'&&c==='R'){s.map='forest';s.x=11;s.y=1;encounterGrace=4;return}if(s.map==='deepForest'&&c==='Q'){if(!s.flags.leonSeen){s.y=1;stopMoving();s.dialog={name:'濃い霧',text:'まずこの一帯でレオンの手掛かりを探そう。'};return}s.map='mistTrail';s.x=13;s.y=22;encounterGrace=5;s.flags.mistEntered=true;return}if(s.map==='mistTrail'&&c==='S'){s.map='deepForest';s.x=12;s.y=1;encounterGrace=4;return}if(s.map==='mistTrail'&&c==='X'){if(!s.flags.glennTraceSeen){s.y=1;stopMoving();s.dialog={name:'濃い霧',text:'先へ進む前に、魔王軍の痕跡を調べた方がよさそうだ。'};return}s.map='observation';s.x=14;s.y=22;encounterGrace=5;s.flags.observationEntered=true;s.dialog={name:'ナレーション',text:'霧を抜けると、黒鉄の杭と見張り台が並ぶ区域に出た。\n魔王軍の監視区域だ。だが、警報は鳴らない。'};stopMoving();return}if(s.map==='observation'&&c==='Z'){s.map='mistTrail';s.x=13;s.y=1;encounterGrace=4;return}if(s.map==='observation'&&c==='Y'){s.y=1;stopMoving();s.dialog={name:'北の封鎖線',text:'この先にはレオンの新しい足跡が続いている。だが魔王軍の兵が撤収準備を始めている。\nルーク「追うなら、次が勝負ですね。」'};return}}
function checkStoryProximity(){if(s.map==='deepForest'&&!s.flags.leonSeen&&Math.abs(s.x-13)+Math.abs(s.y-5)<=1){stopMoving();s.flags.leonSeen=true;s.dialog={name:'レオン',text:'「来るな！」\n金髪の青年が振り返る。顔色は青い。それでも剣だけは構えている。\nレオン「勇者なら帰れ！ 僕はまだ戻れない！」\nレオンは北の霧へ駆け込んだ。\nルーク「逃げる速度だけ、本命勇者ですね……。」'};render();return true}if(s.map==='observation'&&!s.flags.glennSeen&&Math.abs(s.x-15)+Math.abs(s.y-5)<=2){stopMoving();s.flags.glennSeen=true;s.dialog={name:'グレン',text:'黒い外套の長身の男が、部下の前へ一歩出た。\n兵士「隊長、勇者が接近しています。排除しますか？」\nグレン「するな。任務は監視だ。命令にない殺しは仕事を増やす。」\n兵士「ですがレオンは負傷しています。」\nグレン「だからこそ追い詰めるな。北へ逃げ道を残せ。」\nグレンは一瞬だけルークを見る。\nグレン「……ここで死ぬな、勇者。」\nルーク「敵から生存指導されたんですけど……。」'};render();return true}return false}
function front(){let dx=s.dir==='left'?-1:s.dir==='right'?1:0,dy=s.dir==='up'?-1:s.dir==='down'?1:0;return{x:s.x+dx,y:s.y+dy}}function action(){stopMoving();if(s.dialog){s.dialog=null;return render()}let p=front(),n=currentNpcs().find(q=>q.x===p.x&&q.y===p.y);if(n){if(n.kind==='leon'){checkStoryProximity();return}if(n.kind==='glennTrace')s.flags.glennTraceSeen=true;if(n.kind==='glenn'){if(!s.flags.glennSeen){checkStoryProximity();return}s.dialog={name:'グレン',text:'「追うなら北だ。ここで部下に絡むな。報告書が増える。」\nルーク「そこなんですか？」'};return render()}s.dialog=n;return render()}s.dialog={name:'ルーク',text:'特に何もなさそうです。たぶん。'};render()}
function bindControls(){document.querySelectorAll('[data-d]').forEach(b=>{const d=b.dataset.d;b.onpointerdown=e=>{e.preventDefault();stopMoving();move(d);if(s.screen==='world'&&!s.dialog)moveTimer=setInterval(()=>{if(s.screen!=='world'){stopMoving();return}move(d)},150)}})}window.addEventListener('pointerup',stopMoving,{passive:true});window.addEventListener('pointercancel',stopMoving,{passive:true});window.addEventListener('blur',stopMoving);document.addEventListener('visibilitychange',()=>{if(document.hidden)stopMoving()});window.addEventListener('keydown',e=>{let k={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'}[e.key];if(k&&s.screen==='world'){e.preventDefault();move(k)}if((e.key==='Enter'||e.key===' ')&&s.screen==='world')action()});
function enemyPool(){return s.map==='observation'?OBS_ENEMIES:s.map==='mistTrail'?MIST_ENEMIES:s.map==='deepForest'?DEEP_ENEMIES:s.map==='forest'?FOREST_ENEMIES:ENEMIES}function startBattle(){stopMoving();let pool=enemyPool(),e=pool[rnd(0,pool.length-1)];s.enemy=e;s.ehp=e.hp;s.log=[`${e.n}が現れた！`];s.screen='battle';render()}function battle(){let e=s.enemy;app.innerHTML=status()+`<div class=card><div class=enemy>${e.e}</div><div class=enemyName>${e.n}</div><div class=bar><div class="fill enemyFill" style="width:${100*s.ehp/e.hp}%"></div></div></div><div class=card><div class=row><button class=btn onclick=attack()>こうげき</button><button class="btn gray" onclick=guard()>ぼうぎょ</button></div><div class=row><button class="btn gold" onclick=potion()>やくそう</button><button class="btn gray" onclick=runAway()>にげる</button></div><div class=log>${s.log.slice(-5).join('<br>')}</div></div>`}function attack(){let d=rnd(s.atk,s.atk+5)+s.lv;s.ehp=Math.max(0,s.ehp-d);s.log.push(`ルークの攻撃！ ${d}ダメージ！`);if(s.ehp<=0)return win();enemyTurn()}function guard(){s.log.push('ルークは盾の後ろに隠れた。本人は戦術と言っている。');enemyTurn(true)}function potion(){if(!s.potions){s.log.push('薬草がない！');return battle()}s.potions--;let h=Math.min(22,s.mh-s.hp);s.hp+=h;s.log.push(`HPが${h}回復！`);enemyTurn()}function enemyTurn(g=false){let d=rnd(s.enemy.a[0],s.enemy.a[1]);if(g)d=Math.max(1,Math.floor(d/2));s.hp=Math.max(0,s.hp-d);s.log.push(`${s.enemy.n}の攻撃！ ${d}ダメージ！`);if(!s.hp){s.hp=s.mh;s.screen='world';s.map='town';s.x=9;s.y=12;encounterGrace=3;s.dialog={name:'宿屋の主人',text:'また倒れて運ばれてきたぞ。勇者って大変だな。'};return render()}battle()}function win(){let e=s.enemy;s.gold+=e.g;s.xp+=e.xp;s.wins++;s.log.push(`${e.n}を倒した！ EXP${e.xp} / ${e.g}G`);if(s.xp>=s.nx){s.xp-=s.nx;s.lv++;s.nx=Math.floor(s.nx*1.5);s.mh+=9;s.hp=s.mh;s.atk+=3}s.screen='world';s.enemy=null;encounterGrace=3;s.dialog=s.wins===2?{name:'ナレーション',text:'草原での戦いを越えた。王都近郊の北東、森の入口へ進める。'}:{name:'ルーク',text:'勝てました……。毎回これやるんですか？'};render()}function runAway(){if(Math.random()<.7){s.screen='world';s.enemy=null;encounterGrace=4;s.dialog={name:'ルーク',text:'逃げ足だけは勇者級です。'};render()}else{s.log.push('逃げ道を間違えた！');enemyTurn()}}
function openMenu(){stopMoving();let goal=s.flags.glennSeen?'北の封鎖線へ向かい、レオンの足跡を追う。':s.flags.observationEntered?'監視区域でグレン隊長を探す。':s.flags.glennTraceSeen?'北の魔王軍監視区域へ進む。':s.flags.mistEntered?'霧の追跡路で魔王軍の痕跡を調べる。':s.flags.leonSeen?'レオンを追って北の霧へ入る。':s.wins<2?'王都近郊で2勝し、魔物の森へ入る。':s.map==='field'?'北東の魔物の森へ向かう。':s.map==='forest'?'森の北側から深部へ進む。':'深部でレオンの痕跡を追う。';s.dialog={name:'冒険メモ',text:`目的：${goal}\n現在地：${MAPS[s.map].name}\n総勝利：${s.wins}\n操作：十字キーで移動、Aで会話。`};render()}render();
</script></body></html>
