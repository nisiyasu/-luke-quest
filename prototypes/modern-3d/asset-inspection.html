<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUKE QUEST M04 Asset Inspection</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"}}</script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#13201c;color:#fff;font-family:system-ui}canvas{display:block}#hud{position:fixed;z-index:5;left:12px;top:12px;padding:10px 12px;border-radius:9px;background:#071019d9;border:1px solid #d7b45f;font-size:12px}b{color:#e7c66c}</style></head><body><div id="hud"><b>M04 ASSET INSPECTION</b><br>same light · bridge / conifer variants / rock clusters</div><script type="module">import * as THREE from 'three';import{createProductionBridge,createConifer,createRockCluster,assetMetadata}from'./assets.js';try{const r=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(r.domElement);const s=new THREE.Scene();s.background=new THREE.Color(0x8eaaa3);const c=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);c.position.set(11,8.5,15);c.lookAt(0,2,0);s.add(new THREE.HemisphereLight(0xd9efff,0x283a2b,1.4));const sun=new THREE.DirectionalLight(0xffdfad,3);sun.position.set(-7,12,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);s.add(sun);const floor=new THREE.Mesh(new THREE.PlaneGeometry(24,16),new THREE.MeshStandardMaterial({color:0x526d47,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;s.add(floor);const bridge=createProductionBridge();bridge.position.set(-3.2,0,0);bridge.rotation.y=-.12;s.add(bridge);for(let i=0;i<3;i++){const t=createConifer({seed:31+i*17,scale:.75+i*.12});t.position.set(2.4+i*2.3,0,-1.5+i*.35);s.add(t)}for(let i=0;i<3;i++){const rocks=createRockCluster({seed:51+i*13,scale:.9+i*.1});rocks.position.set(1.8+i*2.7,0,4.1);s.add(rocks)}const meta=assetMetadata();document.documentElement.dataset.m04Inspection='ready';document.documentElement.dataset.m04Assets=Object.values(meta).join('|');function tick(t){requestAnimationFrame(tick);bridge.rotation.y=-.12+Math.sin(t*.0002)*.025;r.render(s,c)}requestAnimationFrame(tick);addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})}catch(e){document.documentElement.dataset.m04Inspection='error';document.documentElement.dataset.m04Error=String(e?.message||e).slice(0,160);throw e}</script></body></html>
