<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUKE QUEST 城内 G0 構図固定</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"}}</script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827}canvas{display:block;width:100%;height:100%}#ready{display:none}</style></head><body><div id="ready"></div><script type="module">
import * as THREE from 'three';
import {createLukeCharacter} from './assets.js';
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x172238);scene.fog=new THREE.Fog(0x172238,45,105);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,160);camera.position.set(0,12.5,28);camera.lookAt(0,4,-15);
scene.add(new THREE.HemisphereLight(0xaec7e8,0x241b19,1.35));const key=new THREE.DirectionalLight(0xffd3a0,3.2);key.position.set(-12,22,12);key.castShadow=true;scene.add(key);
const stone=new THREE.MeshStandardMaterial({color:0xb8bdc8,roughness:.48,metalness:.03});const stoneDark=new THREE.MeshStandardMaterial({color:0x697182,roughness:.62});const marble=new THREE.MeshStandardMaterial({color:0xd4d8df,roughness:.24,metalness:.08});const red=new THREE.MeshStandardMaterial({color:0x7f1520,roughness:.72});const gold=new THREE.MeshStandardMaterial({color:0xc99b42,roughness:.34,metalness:.55});const blue=new THREE.MeshStandardMaterial({color:0x163b72,roughness:.65});
function box(w,h,d,mat,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m}
// Hall shell and strong central floor axis.
box(34,.5,68,marble,0,-.25,-5);box(34,18,.8,stone,0,9,-39);box(.8,18,68,stone,-17,9,-5);box(.8,18,68,stone,17,9,-5);box(6,.08,58,red,0,.06,-1);
// Throne dais and centered focus.
for(let i=0;i<4;i++)box(14-i*1.3,.55,3.2,stoneDark,0,.28+i*.55,-31+i*1.55);box(4.2,1.1,3.0,gold,0,2.9,-33.2);box(3.4,5.2,.8,red,0,5.6,-34.0);box(.55,5.8,.55,gold,-1.75,5.8,-33.8);box(.55,5.8,.55,gold,1.75,5.8,-33.8);
// Symmetrical column rhythm, windows and banners establish vanishing direction.
for(const side of[-1,1])for(let i=0;i<6;i++){const z=9-i*8.2,x=side*(10.8+i*.45);const shaft=new THREE.Mesh(new THREE.CylinderGeometry(.85,1.05,10,18),stone);shaft.position.set(x,5,z);shaft.castShadow=true;scene.add(shaft);const base=new THREE.Mesh(new THREE.CylinderGeometry(1.35,1.35,.7,16),stoneDark);base.position.set(x,.35,z);scene.add(base);box(2.6,.7,2.6,stoneDark,x,10.1,z);box(2.4,6,.35,blue,side*16.45,7,z-2.5);box(.22,6.3,.4,gold,side*16.2,7,z-2.5)}
// Tall cool windows on side walls.
for(const side of[-1,1])for(let i=0;i<5;i++){const z=5-i*9.2;const win=new THREE.Mesh(new THREE.PlaneGeometry(3.1,7.2),new THREE.MeshBasicMaterial({color:0x8dc8ef}));win.position.set(side*16.55,7,z);win.rotation.y=side>0?-Math.PI/2:Math.PI/2;scene.add(win)}
// Warm pools leading toward throne.
for(const side of[-1,1])for(const z of[6,-7,-20]){const l=new THREE.PointLight(0xffa54d,16,12,2);l.position.set(side*7.4,4,z);scene.add(l);const flame=new THREE.Mesh(new THREE.SphereGeometry(.16,8,8),new THREE.MeshBasicMaterial({color:0xffc06a}));flame.position.copy(l.position);scene.add(flame)}
const luke=createLukeCharacter();luke.position.set(0,0,13);luke.rotation.y=Math.PI;luke.scale.setScalar(.9);scene.add(luke);
function frame(){renderer.render(scene,camera);requestAnimationFrame(frame)}frame();requestAnimationFrame(()=>requestAnimationFrame(()=>{document.documentElement.dataset.visualReady='true';window.visualReady=true}));
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
