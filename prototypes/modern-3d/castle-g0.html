<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUKE QUEST 城内 G0 構図固定</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"}}</script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827}canvas{display:block;width:100%;height:100%}#ready{display:none}</style></head><body><div id="ready"></div><script type="module">
import * as THREE from 'three';
import {createLukeCharacter} from './assets.js';
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x33445b);scene.fog=new THREE.Fog(0x33445b,58,115);
// Target is a high, portrait game camera: show player, carpet, columns, stairs and throne together.
const camera=new THREE.PerspectiveCamera(44,innerWidth/innerHeight,.1,180);camera.position.set(0,34,34);camera.lookAt(0,1,-9);
scene.add(new THREE.HemisphereLight(0xd8e5f2,0x49352b,1.8));const key=new THREE.DirectionalLight(0xffd8a8,3.8);key.position.set(-14,28,18);key.castShadow=true;scene.add(key);
const stone=new THREE.MeshStandardMaterial({color:0xc7c1b5,roughness:.42,metalness:.03});const stoneDark=new THREE.MeshStandardMaterial({color:0x77737a,roughness:.58});const marble=new THREE.MeshStandardMaterial({color:0xd8d2c6,roughness:.22,metalness:.08});const red=new THREE.MeshStandardMaterial({color:0x8e1821,roughness:.65});const gold=new THREE.MeshStandardMaterial({color:0xc79b3e,roughness:.32,metalness:.55});const blue=new THREE.MeshStandardMaterial({color:0x183d78,roughness:.62});
function box(w,h,d,mat,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m}
box(30,.5,72,marble,0,-.25,-5);box(30,18,.8,stone,0,9,-40);box(.8,18,72,stone,-15,9,-5);box(.8,18,72,stone,15,9,-5);box(5.3,.08,66,red,0,.06,-2);
// Throne focus and broad staircase occupy the upper third, matching target hierarchy.
for(let i=0;i<5;i++)box(15-i*.8,.48,2.7,stoneDark,0,.24+i*.48,-28+i*1.65);box(4.0,1.0,2.8,gold,0,2.7,-34);box(3.2,4.8,.75,red,0,5.1,-34.4);box(.5,5.4,.5,gold,-1.65,5.3,-34.2);box(.5,5.4,.5,gold,1.65,5.3,-34.2);
// Column pairs are pulled inward so the target's framing columns remain visible in portrait view.
for(const side of[-1,1])for(let i=0;i<5;i++){const z=8-i*9,x=side*(8.1+i*.42);const shaft=new THREE.Mesh(new THREE.CylinderGeometry(.8,1.0,9.2,18),stone);shaft.position.set(x,4.6,z);shaft.castShadow=true;scene.add(shaft);const base=new THREE.Mesh(new THREE.CylinderGeometry(1.25,1.25,.65,16),stoneDark);base.position.set(x,.32,z);scene.add(base);box(2.35,.65,2.35,stoneDark,x,9.25,z);box(1.8,5.0,.25,blue,side*(10.6+i*.25),5.7,z-1.7);}
// Side window masses, warm pools and cool wall rhythm.
for(const side of[-1,1])for(let i=0;i<4;i++){const z=3-i*10;const win=new THREE.Mesh(new THREE.PlaneGeometry(2.7,6.2),new THREE.MeshBasicMaterial({color:0xb8dcf0}));win.position.set(side*14.5,6.2,z);win.rotation.y=side>0?-Math.PI/2:Math.PI/2;scene.add(win)}
for(const side of[-1,1])for(const z of[7,-7,-20]){const l=new THREE.PointLight(0xffa84d,22,13,2);l.position.set(side*6.6,3.4,z);scene.add(l);const flame=new THREE.Mesh(new THREE.SphereGeometry(.18,8,8),new THREE.MeshBasicMaterial({color:0xffd078}));flame.position.copy(l.position);scene.add(flame)}
const luke=createLukeCharacter();luke.position.set(0,0,9);luke.rotation.y=Math.PI;luke.scale.setScalar(.82);scene.add(luke);
function frame(){renderer.render(scene,camera);requestAnimationFrame(frame)}frame();requestAnimationFrame(()=>requestAnimationFrame(()=>{document.documentElement.dataset.visualReady='true';window.visualReady=true}));
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
