        for (let i = 0; i < seedSteps; i++) stepMovement(1 / 60);
        dispatchEvent(new KeyboardEvent("keyup", { code: "ArrowUp", bubbles: true, cancelable: true }));
        syncState();
      }
      document.documentElement.dataset.m08WalkSeedSteps = String(seedSteps);
      document.documentElement.dataset.m08WalkStart = document.documentElement.dataset.m08Player;
      dispatchEvent(new KeyboardEvent("keydown", { code: "ArrowUp", bubbles: true, cancelable: true }));
      setTimeout(() => {
        dispatchEvent(new KeyboardEvent("keyup", { code: "ArrowUp", bubbles: true, cancelable: true }));
        syncState();
        document.documentElement.dataset.m08WalkEnd = document.documentElement.dataset.m08Player;
        document.documentElement.dataset.m08WalkDone = "1";
      }, 1600);
    }
  }
  document.documentElement.dataset.lqModern3d = "m05-ready";
  document.documentElement.dataset.threeRevision = THREE7.REVISION;
  document.documentElement.dataset.m04Assets = "target-v26-bank-v41-water-v34-conifer-v31";
  document.documentElement.dataset.m03Return = "composition-rebuild-v29-island-corridor";
  loading.remove();
  stateEl.textContent = `\u738B\u90FD\u8FD1\u90CA \xB7 ${practicalPreset ? "PRACTICAL" : "HIGH"}`;
  if (new URLSearchParams(location.search).get("ci") === "1") {
    const route = [];
    const snap = (id) => route.push(`${id}:${player.position.x.toFixed(2)},${player.position.z.toFixed(2)}`);
    snap("R0");
    dispatchEvent(new KeyboardEvent("keydown", { code: "ArrowUp", bubbles: true, cancelable: true }));
    for (let i = 0; i < 20; i++) stepMovement(0.12);
    dispatchEvent(new KeyboardEvent("keyup", { code: "ArrowUp", bubbles: true, cancelable: true }));
    snap("R1");
    const crossedBridge = player.position.z < -2.45;
    player.position.set(4, -0.28, 4.5);
    syncState();
    const shoreBefore = player.position.z;
    dispatchEvent(new KeyboardEvent("keydown", { code: "ArrowUp", bubbles: true, cancelable: true }));
    for (let i = 0; i < 8; i++) stepMovement(0.12);
    dispatchEvent(new KeyboardEvent("keyup", { code: "ArrowUp", bubbles: true, cancelable: true }));
    snap("R3");
    const blockedAtShore = player.position.z >= 3 && blockedWater > 0 && player.position.z < shoreBefore;
    const b = document.querySelector('[data-dir="left"]'), x0 = player.position.x;
    b.dispatchEvent(new PointerEvent("pointerdown", { pointerId: 9, bubbles: true, cancelable: true }));
    stepMovement(0.12);
    b.dispatchEvent(new PointerEvent("pointerup", { pointerId: 9, bubbles: true, cancelable: true }));
    const pointerMoved = player.position.x < x0 - 0.12;
    dispatchEvent(new Event("blur"));
    dispatchEvent(new Event("resize"));
    const released = blurRelease && activeDirs().length === 0 && resizes >= 2;
    const groundSamples = [playerGroundY(-1.35, -2.45), playerGroundY(-1.35, -3.05), playerGroundY(-1.35, -3.65), playerGroundY(-1.35, 4.65), playerGroundY(-1.35, 5.25), playerGroundY(-1.35, 5.85)];
    const groundingSmooth = Math.abs(groundSamples[0] - 0.42) < 0.02 && groundSamples[1] > 0.42 && groundSamples[1] < 1.04 && Math.abs(groundSamples[2] - 1.04) < 0.02 && Math.abs(groundSamples[3] - 0.42) < 0.02 && groundSamples[4] < 0.42 && groundSamples[4] > -0.28 && Math.abs(groundSamples[5] + 0.28) < 0.02;
    player.position.set(-1.35, 1.04, -4.3);
    syncState();
    snap("R5");
    const noHole = walkable(player.position.x, player.position.z) && walkable(-10, -12) && walkable(-10, 12), pass = crossedBridge && blockedAtShore && pointerMoved && released && noHole && groundingSmooth;
    document.documentElement.dataset.m02Ci = "pass";
    document.documentElement.dataset.m03Ci = pass ? "pass" : "fail";
    document.documentElement.dataset.m08Ci = pass ? "pass" : "fail";
    document.documentElement.dataset.m05Scene = pass ? "ready" : "runtime-fail";
    document.documentElement.dataset.m05Variant = "m03-composition-v29-island-corridor";
    const routeText = route.join("|");
    document.documentElement.dataset.m03Route = routeText;
    window.LQ_MODERN_3D_M05.ci = { crossedBridge, blockedAtShore, pointerMoved, released, noHole, groundingSmooth, groundSamples: groundSamples.map((v) => +v.toFixed(3)), route: routeText, pass };
    ciEvidence.textContent = JSON.stringify(window.LQ_MODERN_3D_M05.ci);
  }
} catch (err) {
  console.error(err);
  loading.remove();
  errorEl.style.display = "block";
  errorEl.textContent = "Modern 3D failed: " + String(err?.message || err);
  document.documentElement.dataset.lqModern3d = "error";
}
