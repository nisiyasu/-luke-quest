<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M04 Target Asset Inspection</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"}}</script>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101710;color:#fff;font-family:system-ui,sans-serif}canvas{display:block}#legend{position:fixed;left:14px;top:12px;background:#071019d9;border:1px solid #caa85f;border-radius:8px;padding:9px 12px;font-size:12px;z-index:3}#legend b{color:#f2d172}.col{display:inline-block;margin-right:18px}</style></head>
<body><div id="legend"><span class="col"><b>LEFT</b> current conifer_natural_v2</span><span class="col"><b>RIGHT</b> target conifer_target_v3 + fern patch</span></div>
<script type="module">
import * as THREE from 'three';
import {createNaturalConifer,createUnderstoryCluster} from './natural-assets.js';
import {createTargetConifer,createTargetFernPatch} from './m04-target-assets.js';
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8ea59a);scene.fog=new THREE.FogExp2(0x9fb2a7,.008);
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,100);camera.position.set(0,8.3,18);camera.lookAt(0,2.6,0);
scene.add(new THREE.HemisphereLight(0xeaf2e8,0x253025,1.2));const sun=new THREE.DirectionalLight(0xffd28d,3.5);sun.position.set(-10,18,9);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-15;sun.shadow.camera.right=15;sun.shadow.camera.top=16;sun.shadow.camera.bottom=-8;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(26,14),new THREE.MeshStandardMaterial({color:0x688649,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const divider=new THREE.Mesh(new THREE.BoxGeometry(.08,.03,11),new THREE.MeshStandardMaterial({color:0xcaa85f,roughness:.8}));divider.position.y=.03;scene.add(divider);
const currentSeeds=[11,23,37],targetSeeds=[11,23,37];
for(let i=0;i<3;i++){
 const x=-7.2+i*2.2,z=(i%2)*.5-.25,t=createNaturalConifer({seed:currentSeeds[i],scale:.9+i*.08});t.position.set(x,0,z);scene.add(t);
 const u=createUnderstoryCluster({seed:200+i*17,scale:.78,flowers:true});u.position.set(x+.55,.02,z+.55);scene.add(u);
}
for(let i=0;i<3;i++){
 const x=2.8+i*2.2,z=(i%2)*.5-.25,t=createTargetConifer({seed:targetSeeds[i],scale:.9+i*.08});t.position.set(x,0,z);scene.add(t);
 const f=createTargetFernPatch({seed:400+i*19,scale:.9,count:24});f.position.set(x+.45,.02,z+.55);scene.add(f);
}
const labelMat=new THREE.MeshStandardMaterial({color:0x8a7850,roughness:1});for(const x of[-5,5]){const slab=new THREE.Mesh(new THREE.BoxGeometry(8.4,.12,1.2),labelMat);slab.position.set(x,.02,4.8);slab.receiveShadow=true;scene.add(slab)}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize,{passive:true});
function tick(){requestAnimationFrame(tick);renderer.render(scene,camera)}tick();
document.documentElement.dataset.m04TargetInspection='ready';document.documentElement.dataset.currentAsset='conifer_natural_v2@2.1.0';document.documentElement.dataset.candidateAsset='conifer_target_v3@3.0.0';
</script></body></html>
