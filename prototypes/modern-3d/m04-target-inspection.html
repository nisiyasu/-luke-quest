<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M04/M06 Target Asset Inspection</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"}}</script>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101710;color:#fff;font-family:system-ui,sans-serif}canvas{display:block}#legend{position:fixed;left:14px;top:12px;background:#071019d9;border:1px solid #caa85f;border-radius:8px;padding:9px 12px;font-size:12px;z-index:3}#legend b{color:#f2d172}.col{display:inline-block;margin-right:18px}</style></head>
<body><div id="legend"><span class="col"><b>LEFT</b> current natural_v2</span><span class="col"><b>CENTER</b> target_v3.0</span><span class="col"><b>RIGHT</b> target_v3.2 M06 variation</span></div>
<script type="module">
import * as THREE from 'three';
import {createNaturalConifer,createUnderstoryCluster} from './natural-assets.js';
import {createTargetConifer,createTargetFernPatch} from './m04-target-assets.js';
import {createTargetConiferV31} from './m04-conifer-target-v31.js';
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8ea59a);scene.fog=new THREE.FogExp2(0x9fb2a7,.006);
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,100);camera.position.set(0,8.7,20.5);camera.lookAt(0,2.6,0);
scene.add(new THREE.HemisphereLight(0xeaf2e8,0x253025,1.2));const sun=new THREE.DirectionalLight(0xffd28d,3.5);sun.position.set(-10,18,9);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-18;sun.shadow.camera.right=18;sun.shadow.camera.top=16;sun.shadow.camera.bottom=-8;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(34,14),new THREE.MeshStandardMaterial({color:0x688649,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
for(const x of[-5.4,5.4]){const divider=new THREE.Mesh(new THREE.BoxGeometry(.055,.03,11),new THREE.MeshStandardMaterial({color:0xcaa85f,roughness:.8}));divider.position.set(x,.03,0);scene.add(divider)}
const seeds=[11,23];
for(let i=0;i<2;i++){const x=-11+i*2.7,z=(i%2)*.45-.2,t=createNaturalConifer({seed:seeds[i],scale:.92+i*.08});t.position.set(x,0,z);scene.add(t);const u=createUnderstoryCluster({seed:200+i*17,scale:.78,flowers:true});u.position.set(x+.5,.02,z+.5);scene.add(u)}
for(let i=0;i<2;i++){const x=-2.7+i*2.7,z=(i%2)*.45-.2,t=createTargetConifer({seed:seeds[i],scale:.92+i*.08});t.position.set(x,0,z);scene.add(t);const f=createTargetFernPatch({seed:400+i*19,scale:.9,count:24});f.position.set(x+.45,.02,z+.5);scene.add(f)}
for(let i=0;i<2;i++){const x=7.2+i*2.7,z=(i%2)*.45-.2,t=createTargetConiferV31({seed:seeds[i],scale:.92+i*.08});t.position.set(x,0,z);scene.add(t);const f=createTargetFernPatch({seed:600+i*19,scale:.9,count:24});f.position.set(x+.45,.02,z+.5);scene.add(f)}
const labelMat=new THREE.MeshStandardMaterial({color:0x8a7850,roughness:1});for(const x of[-10,0,10]){const slab=new THREE.Mesh(new THREE.BoxGeometry(7.3,.12,1.2),labelMat);slab.position.set(x,.02,4.8);slab.receiveShadow=true;scene.add(slab)}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize,{passive:true});
function tick(){requestAnimationFrame(tick);renderer.render(scene,camera)}tick();
document.documentElement.dataset.m04TargetInspection='ready';document.documentElement.dataset.currentAsset='conifer_natural_v2@2.1.0';document.documentElement.dataset.previousCandidate='conifer_target_v3@3.0.0';document.documentElement.dataset.candidateAsset='conifer_target_v31@3.2.1';
</script></body></html>
