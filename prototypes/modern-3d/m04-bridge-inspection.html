<body><div id="legend"><span class="tag"><b>BRIDGE</b> bridge_principal_v1@1.2.0</span><span class="tag"><b>CONTEXT</b> conifer_target_v31@3.8.0 + bank_target_v4@4.7.0 + rock_cluster_v1@1.1.0</span><span class="tag"><b>CHECK</b> boards / thickness / supports / rails / wood variation / family coherence</span></div>
<script type="module">
import * as THREE from 'three';
import {createProductionBridge,createRockCluster} from './assets.js';
import {createTargetConiferV31} from './m04-conifer-target-v31.js';
import {createTargetBankV4} from './m04-bank-target-v4.js';
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8ea59a);scene.fog=new THREE.FogExp2(0x9fb2a7,.009);
