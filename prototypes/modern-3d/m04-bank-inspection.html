<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M04 Bank Inspection</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"}}</script>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101710;color:#fff;font-family:system-ui,sans-serif}canvas{display:block}#legend{position:fixed;left:14px;top:12px;background:#071019d9;border:1px solid #caa85f;border-radius:8px;padding:9px 12px;font-size:12px;z-index:3}#legend b{color:#f2d172}.col{display:inline-block;margin-right:18px}</style></head>
<body><div id="legend"><span class="col"><b>LEFT</b> layered_bank_v2</span><span class="col"><b>RIGHT</b> bank_target_v3</span></div>
<script type="module">
import * as THREE from 'three';
import {createLayeredBank} from './natural-assets.js';
import {createTargetBank} from './m04-target-assets.js';
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8ea59a);scene.fog=new THREE.FogExp2(0x9fb2a7,.007);
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,100);camera.position.set(0,8.6,17.5);camera.lookAt(0,-.3,0);
scene.add(new THREE.HemisphereLight(0xeaf2e8,0x253025,1.2));const sun=new THREE.DirectionalLight(0xffd28d,3.5);sun.position.set(-10,18,9);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-16;sun.shadow.camera.right=16;sun.shadow.camera.top=16;sun.shadow.camera.bottom=-10;scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(28,16),new THREE.MeshStandardMaterial({color:0x30462f,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-2.2;floor.receiveShadow=true;scene.add(floor);
const oldBank=createLayeredBank({seed:77,width:10,depth:6,facing:1});oldBank.position.set(-6.0,1.0,0);scene.add(oldBank);
const targetBank=createTargetBank({seed:77,width:10,depth:6,facing:1});targetBank.position.set(6.0,1.0,0);scene.add(targetBank);
const divider=new THREE.Mesh(new THREE.BoxGeometry(.06,.04,12),new THREE.MeshStandardMaterial({color:0xcaa85f,roughness:.8}));divider.position.set(0,-2.14,0);scene.add(divider);
function tick(){requestAnimationFrame(tick);renderer.render(scene,camera)}tick();
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize,{passive:true});
document.documentElement.dataset.m04BankInspection='ready';document.documentElement.dataset.currentAsset='layered_bank_v2@2.1.0';document.documentElement.dataset.candidateAsset='bank_target_v3@3.0.0';
</script></body></html>
