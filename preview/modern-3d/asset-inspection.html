<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUKE QUEST M04 Natural Asset Inspection</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"}}</script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#13201c;color:#fff;font-family:system-ui}canvas{display:block}#hud{position:fixed;z-index:5;left:12px;top:12px;padding:10px 12px;border-radius:9px;background:#071019d9;border:1px solid #d7b45f;font-size:12px}b{color:#e7c66c}</style></head><body><div id="hud"><b>M04 NATURAL ASSET INSPECTION</b><br>shared sun · natural tree / meadow / layered bank / rich water / bridge / rocks / Luke / sign</div><script type="module">import * as THREE from'three';import{createProductionBridge,createRockCluster,createLukeCharacter,createSign}from'./assets.js';import{createNaturalConifer,createLayeredBank,createRichWater,createUnderstoryCluster,createMeadowField,naturalAssetMetadata}from'./natural-assets.js';try{const r=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.1;document.body.prepend(r.domElement);const s=new THREE.Scene();s.background=new THREE.Color(0x8eaaa3);s.fog=new THREE.Fog(0x8eaaa3,24,46);const c=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);c.position.set(13,11.8,21);c.lookAt(0,1.4,0);s.add(new THREE.HemisphereLight(0xd9efff,0x283a2b,1.3));const sun=new THREE.DirectionalLight(0xffdfad,3.3);sun.position.set(-8,14,9);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);s.add(sun);const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,24),new THREE.MeshStandardMaterial({color:0x425c39,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.08;floor.receiveShadow=true;s.add(floor);const bank=createLayeredBank({seed:909,width:10,depth:7,facing:1});bank.position.set(0,1.0,-5.2);s.add(bank);const meadow=createMeadowField({seed:917,width:9,depth:4.8,density:240,flowers:36});meadow.position.set(0,1.03,-6.0);s.add(meadow);const water=createRichWater({width:8.2,depth:3.5});water.position.set(0,.02,5.1);s.add(water);const bridge=createProductionBridge();bridge.position.set(-4.5,0,1.2);bridge.rotation.y=-.08;s.add(bridge);for(let i=0;i<3;i++){const t=createNaturalConifer({seed:31+i*17,scale:.72+i*.12});t.position.set(3.0+i*2.35,0,-2.2+i*.45);s.add(t)}for(let i=0;i<4;i++){const u=createUnderstoryCluster({seed:71+i*11,scale:.72,flowers:true});u.position.set(2.4+i*1.5,.02,1.2+(i%2)*1.2);s.add(u)}for(let i=0;i<2;i++){const rocks=createRockCluster({seed:51+i*13,scale:.85+i*.14});rocks.position.set(4.2+i*2.4,0,4.4);s.add(rocks)}const luke=createLukeCharacter({scale:1});luke.position.set(.4,0,1.8);luke.rotation.y=-.35;s.add(luke);const sign=createSign();sign.position.set(-.4,0,-1.7);sign.rotation.y=.35;s.add(sign);const meta=naturalAssetMetadata();document.documentElement.dataset.m04Inspection='natural-v2-ready';document.documentElement.dataset.m04Assets=Object.values(meta).join('|');function tick(ms){requestAnimationFrame(tick);const t=ms/1000;water.userData.update(t);luke.userData.animate(t,.72);r.render(s,c)}requestAnimationFrame(tick);addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})}catch(e){document.documentElement.dataset.m04Inspection='error';document.documentElement.dataset.m04Error=String(e?.message||e).slice(0,160);throw e}</script></body></html>
