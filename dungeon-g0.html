<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUKE QUEST Dungeon G0</title><style>*{box-sizing:border-box}html,body{margin:0;background:#07101a;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}#game{position:relative;width:100vw;height:100vh;min-height:720px;background:radial-gradient(circle at 55% 45%,#183a45 0,#0b1d2a 34%,#07111b 67%,#03080d 100%);overflow:hidden}.rock{position:absolute;background:linear-gradient(135deg,#344348,#18262d);border:2px solid #526267;box-shadow:inset 0 0 18px #000b,0 12px 30px #000b}.path{position:absolute;background:linear-gradient(90deg,#4b4d45,#77705d 45%,#484b44);border:2px solid #272d2d;box-shadow:inset 0 0 24px #0008,0 8px 20px #0008}.path:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 45px,#1e292855 46px 49px),repeating-linear-gradient(90deg,transparent 0 58px,#1e292844 59px 62px)}.water{position:absolute;background:linear-gradient(180deg,#153d54,#08738a 50%,#082d47);box-shadow:inset 0 0 35px #020b12}.bridge{position:absolute;background:repeating-linear-gradient(90deg,#72543b 0 20px,#33251c 21px 24px);border-top:6px solid #9b7850;border-bottom:6px solid #9b7850;transform:rotate(2deg);box-shadow:0 10px 22px #000b}.stairs{position:absolute;background:repeating-linear-gradient(0deg,#55564e 0 16px,#262d2e 17px 21px);border:2px solid #222c2f;transform:perspective(350px) rotateX(14deg)}.door{position:absolute;background:linear-gradient(90deg,#253238,#0c151b 48%,#26343b);border:8px solid #59635d;border-radius:45% 45% 4px 4px;box-shadow:0 0 24px #d9973b55}.platform{position:absolute;background:linear-gradient(135deg,#4b514a,#282f30);border:3px solid #66706a;box-shadow:0 14px 28px #000c}.fall{position:absolute;background:linear-gradient(90deg,#9eeeffaa,#2ca6cddd,#d9ffffbb);filter:drop-shadow(0 0 12px #44d9ff99);border-radius:0 0 45% 45%}.torch{position:absolute;width:26px;height:26px;border-radius:50%;background:#ffd75b;box-shadow:0 0 18px 8px #ff8a2c,0 0 42px 18px #ff6a1833;z-index:8}.player{position:absolute;width:7.3%;height:7.4%;left:48.2%;top:55.8%;z-index:20;display:flex;align-items:center;justify-content:center;font-size:min(6vw,54px);filter:drop-shadow(0 6px 5px #000);transition:left .08s linear,top .08s linear}.player:before{content:"🧙‍♂️"}.hud{position:absolute;left:3%;top:2%;z-index:30;background:#07111fdd;border:2px solid #c79b49;border-radius:10px;padding:10px 18px;font-weight:800}.label{position:absolute;right:3%;top:2%;z-index:30;background:#07111fdd;border:2px solid #c79b49;border-radius:10px;padding:10px 18px}.dpad{position:absolute;left:3%;bottom:3%;z-index:30;display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px 48px;opacity:.65}.dpad button{background:#0d1724cc;color:white;border:1px solid #aaa8;border-radius:50%;font-size:22px}.u{grid-column:2}.l{grid-column:1;grid-row:2}.d{grid-column:2;grid-row:2}.r{grid-column:3;grid-row:2}@media(min-aspect-ratio:3/4){#game{width:min(100vw,896px);height:100vh;margin:auto}}</style></head><body><div id="game"><div class="hud">LUKE HP　62/69</div><div class="label">NEXT AREA<br>ダンジョン</div><div class="water" style="left:31.5%;top:42%;width:28.5%;height:17.5%"></div><div class="water" style="left:75%;top:26%;width:25%;height:49%"></div><div class="rock" style="left:0;top:0;width:25%;height:100%"></div><div class="rock" style="left:0;top:28%;width:45%;height:18%"></div><div class="rock" style="left:0;top:47%;width:24%;height:18%"></div><div class="path" style="left:37.9%;top:52.3%;width:25.7%;height:47.7%;clip-path:polygon(20% 0,82% 0,100% 100%,0 100%)"></div><div class="bridge" style="left:24.9%;top:36.2%;width:23.4%;height:7.1%"></div><div class="platform" style="left:58%;top:30%;width:25%;height:16%"></div><div class="stairs" style="left:70.9%;top:19.4%;width:13.8%;height:12%"></div><div class="door" style="left:70.5%;top:5.2%;width:17%;height:13.3%"></div><div class="platform" style="left:78.4%;top:38%;width:21.6%;height:23%"></div><div class="fall" style="left:87%;top:25.5%;width:13%;height:14.5%"></div><div class="fall" style="left:86%;top:56%;width:14%;height:18%"></div><div class="torch" style="left:12%;top:35%"></div><div class="torch" style="left:10%;top:57%"></div><div class="torch" style="left:27%;top:66%"></div><div class="torch" style="left:62%;top:55%"></div><div class="torch" style="left:64%;top:13%"></div><div class="torch" style="left:80%;top:13%"></div><div id="player" class="player"></div><div class="dpad"><button class="u" data-dy="-1">▲</button><button class="l" data-dx="-1">◀</button><button class="d" data-dy="1">▼</button><button class="r" data-dx="1">▶</button></div></div><script>const p=document.getElementById('player');let x=48.2,y=55.8;function move(dx,dy){x=Math.max(39,Math.min(58,x+dx*1.2));y=Math.max(52,Math.min(94,y+dy*1.2));p.style.left=x+'%';p.style.top=y+'%'}document.querySelectorAll('[data-dx],[data-dy]').forEach(b=>b.onclick=()=>move(+(b.dataset.dx||0),+(b.dataset.dy||0)));addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowup'||k==='w')move(0,-1);if(k==='arrowdown'||k==='s')move(0,1);if(k==='arrowleft'||k==='a')move(-1,0);if(k==='arrowright'||k==='d')move(1,0)});</script></body></html>
