name: REQ-145 Mobile Dialogue Focus

on:
  push:
    branches: ["experiment/gold-vertical-slice"]
    paths:
      - 'addons/zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz-req145-mobile-dialogue-focus.js'
      - '.github/workflows/req145-mobile-dialogue-focus.yml'
      - 'tools/lq-req145-assemble-local.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-dialogue-focus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate presentation source
        run: node --check addons/zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz-req145-mobile-dialogue-focus.js
      - name: Assemble challenger
        run: python3 tools/lq-req145-assemble-local.py --out req145-assembled.html
      - name: Exercise compact mobile dialogue focus
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$BROWSER"
          python3 -m http.server 8129 >/tmp/req145-dialogue-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          timeout 30 "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,844 --virtual-time-budget=1800 --dump-dom 'http://127.0.0.1:8129/req145-assembled.html?lqReq145MobileDialogueFocusSmoke=1' > /tmp/req145-dialogue-dom.html 2>/tmp/req145-dialogue-chrome.log || true
          test -s /tmp/req145-dialogue-dom.html
          grep -q 'id="lqReq145MobileDialogueFocusSmokeMarker"' /tmp/req145-dialogue-dom.html
          grep -q 'data-dialog-present="true"' /tmp/req145-dialogue-dom.html
          grep -q 'data-bottom-anchored="true"' /tmp/req145-dialogue-dom.html
          grep -q 'data-compact-height="true"' /tmp/req145-dialogue-dom.html
          grep -q 'data-scrollable="true"' /tmp/req145-dialogue-dom.html
          grep -q 'data-world-viewport-preserved="true"' /tmp/req145-dialogue-dom.html
          grep -q 'data-input-authority="false"' /tmp/req145-dialogue-dom.html
          grep -q 'data-save-authority="false"' /tmp/req145-dialogue-dom.html
          grep -q 'data-story-authority="false"' /tmp/req145-dialogue-dom.html
          grep -q 'data-battle-authority="false"' /tmp/req145-dialogue-dom.html
          if grep -E 'Uncaught (ReferenceError|TypeError|SyntaxError)|ReferenceError:|SyntaxError:' /tmp/req145-dialogue-chrome.log; then
            cat /tmp/req145-dialogue-chrome.log
            exit 1
          fi
          grep -o 'id="lqReq145MobileDialogueFocusSmokeMarker"[^>]*' /tmp/req145-dialogue-dom.html
          echo 'REQ-145 compact mobile dialogue focus PASS'
