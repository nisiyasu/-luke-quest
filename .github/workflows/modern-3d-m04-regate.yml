name: Modern 3D M04 Content-Aware Visual Regate

on:
  push:
    branches: ["prototype/modern-3d"]
    paths:
      - "prototypes/modern-3d/**"
      - ".github/workflows/modern-3d-m04-regate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modern-3d-m04-regate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-regate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Start prototype server
        run: |
          python3 -m http.server 8140 --directory prototypes/modern-3d >/tmp/modern3d-http.log 2>&1 &
          sleep 1
          curl -fsS http://127.0.0.1:8140/index.html >/dev/null
      - name: Prove runtime ready before capture
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          mkdir -p .modern3d-regate
          timeout 60s "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage \
            --disable-background-networking --disable-component-update --disable-sync --metrics-recording-only \
            --enable-webgl --ignore-gpu-blocklist --use-angle=swiftshader --enable-unsafe-swiftshader \
            --virtual-time-budget=1800 --dump-dom \
            'http://127.0.0.1:8140/index.html?ci=1&quality=high' > .modern3d-regate/dom.html 2>.modern3d-regate/dom-stderr.log
          grep -q 'data-lq-modern3d="m05-ready"' .modern3d-regate/dom.html
          grep -q 'data-m05-scene="ready"' .modern3d-regate/dom.html
          grep -Eq 'data-m04-assets="(integrated|natural-v[0-9]+-integrated|target-v[0-9]+(-[^"]+)?)"' .modern3d-regate/dom.html
          ! grep -q 'data-lq-modern3d="m05-error"' .modern3d-regate/dom.html
      - name: Capture and reject blank-world evidence
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          python3 -m pip install --quiet pillow
          capture(){
            local size="$1" out="$2" attempt rc
            for attempt in 1 2 3; do
              rm -f ".modern3d-regate/$out"
              set +e
              timeout 60s "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage \
                --disable-background-networking --disable-component-update --disable-sync --metrics-recording-only \
                --enable-webgl --ignore-gpu-blocklist --use-angle=swiftshader --enable-unsafe-swiftshader \
                --hide-scrollbars --window-size="$size" --force-device-scale-factor=1 --virtual-time-budget=2200 \
                --screenshot=".modern3d-regate/$out" 'http://127.0.0.1:8140/index.html?ci=1&quality=high'
              rc=$?
              set -e
              if test -s ".modern3d-regate/$out" && python3 - ".modern3d-regate/$out" <<'PY'
          import sys
          from PIL import Image, ImageStat
          p=sys.argv[1]
          im=Image.open(p).convert('RGB')
          w,h=im.size
          # HUD can render while WebGL world is blank. Judge the central world area only.
          crop=im.crop((int(w*.20),int(h*.20),int(w*.80),int(h*.78)))
          stat=ImageStat.Stat(crop)
          extrema=crop.getextrema()
          spread=sum(b-a for a,b in extrema)
          std=sum(stat.stddev)
          colors=crop.resize((max(1,crop.width//8),max(1,crop.height//8))).getcolors(maxcolors=1000000) or []
          unique=len(colors)
          print(f'CONTENT_CHECK path={p} spread={spread} std={std:.2f} unique={unique}')
          # A HUD-only dark frame has almost no variation in the central world area.
          assert spread > 45 and std > 12 and unique > 24, (spread,std,unique)
          PY
              then
                echo "M04_REGATE_CAPTURE $out attempt=$attempt PASS rc=$rc" >> .modern3d-regate/capture.txt
                return 0
              fi
              echo "M04_REGATE_CAPTURE $out attempt=$attempt RETRY rc=$rc" >> .modern3d-regate/capture.txt
              sleep 1
            done
            return 1
          }
          capture 390,844 portrait.png
          capture 864,1536 hq.png
      - name: Include visual authorities
        run: |
          cp assets/reference/owner_2026-09-11_ps1_visual_target/MINIMUM_QUALITY_LINE.png .modern3d-regate/
          cp assets/reference/owner_2026-09-11_ps1_visual_target/TARGET_PS1_FINAL.png .modern3d-regate/
          printf 'SOURCE_SHA=%s\nPACKET=M04-P02\nVISUAL_ACCEPTANCE=REQUIRES_DIRECT_COMPARISON\n' "$GITHUB_SHA" > .modern3d-regate/manifest.txt
      - name: Upload M04 regate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-3d-m04-regate-${{ github.sha }}
          path: |
            .modern3d-regate/**
            /tmp/modern3d-http.log
          retention-days: 14
