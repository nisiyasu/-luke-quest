name: REQ-117 promote and REQ-118 handoff

on:
  push:
    paths:
      - '.github/workflows/req117-promote-and-handoff.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote REQ-117 and select REQ-118
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          req=Path('requirements/REQ-117_WORLD_CHARACTER_VISUAL_RICHNESS_UPGRADE.md')
          t=req.read_text()
          t=t.replace('STATUS: READY','STATUS: VERIFY',1)
          stamp='''\n---\n\n# 11. IMPLEMENTATION CHECKPOINT — 2026-09-07\n\nSTATUS: `VERIFY`\nIOS_PHYSICAL_VERIFICATION: `PENDING`\n\nMachine/public evidence:\n\n- Checkpoint A: canonical character grounding, foot shadows, restrained idle motion and interaction easing. The stale duplicate-authority gate was repaired to validate `world-character-grounding.js` directly.\n- Checkpoint B: neighbor-aware town/field/forest edge depth retained while per-tile `filter: drop-shadow()` and `isolation:isolate` compositor layers were removed in favor of iPhone-safe box-shadow treatment.\n- Checkpoint C: canonical ambient authority reused; mobile particle count capped, fog blur/filter removed, hidden-page lifecycle and reduced-motion handling preserved.\n- Checkpoint D: approved Luke 4-direction × 3-frame WebP raster authority preserved and routed through the canonical visual-body wrapper. This repairs the prior risk where sprite application could delete the canonical foot-shadow/body structure. Multiple recurring NPCs retain the canonical grounded body and receive lightweight silhouette treatment without inventing fake formal NPC raster assets.\n- REQ-021 Tap Anywhere, REQ-022 iPhone Fullscreen and REQ-001 Dynamic Touch authority remain protected.\n- Dedicated REQ-117 A/B/C/D gate run `34074892503`: SUCCESS.\n- GitHub Pages run `34074892512` (#1219): SUCCESS on `707dab7a888bb7a0ba8e25f00316ee07d2e66327`.\n- Render Liveness run `34074892523`: SUCCESS after the compositor-safe character/sprite integration.\n- REQ-121 progression regression run `34074892552`: SUCCESS.\n\nSubjective final sprite/art feel remains Owner iPhone verification territory; machine success is not physical-device PASS.\n'''
          if '# 11. IMPLEMENTATION CHECKPOINT — 2026-09-07' not in t:
              t=t.replace('\nEOF\n',stamp+'\nEOF\n') if '\nEOF\n' in t else t+stamp
          req.write_text(t)

          q=Path('WORK_QUEUE.md')
          t=q.read_text()
          old=re.compile(r'^\| 108 \| REQ-117 \| P1 \| IN_PROGRESS \| World / Character Visual Richness Upgrade \| `requirements/REQ-117_WORLD_CHARACTER_VISUAL_RICHNESS_UPGRADE\.md` \|.*$',re.M)
          repl='| 108 | REQ-117 | P1 | VERIFY | World / Character Visual Richness Upgrade | `requirements/REQ-117_WORLD_CHARACTER_VISUAL_RICHNESS_UPGRADE.md` | A/B/C/D machine gates SUCCESS. Approved Luke 4dir×3frame raster preserved; grounding/sprite wrapper conflict repaired; map depth + ambient + character compositor filters hardened for iPhone. Pages 34074892512 SUCCESS; Render Liveness 34074892523 SUCCESS. IOS_PHYSICAL_VERIFICATION=PENDING. |'
          t,n=old.subn(repl,t,count=1)
          if n!=1: raise SystemExit(f'REQ-117 queue row replacement count={n}')
          old118=re.compile(r'^\| 109 \| REQ-118 \| P1 \| READY \| High-Quality Hero Selection Opening / Playable Prologue \| `requirements/REQ-118_HIGH_QUALITY_HERO_SELECTION_OPENING\.md` \|.*$',re.M)
          repl118='| 109 | REQ-118 | P1 | IN_PROGRESS | High-Quality Hero Selection Opening / Playable Prologue | `requirements/REQ-118_HIGH_QUALITY_HERO_SELECTION_OPENING.md` | Fresh Owner-approved Opening A-H. Selected after REQ-117 machine/public gates passed. Implement in staged recoverable checkpoints; existing progressed saves must bypass safely; preserve REQ-021/022/001. IOS_PHYSICAL_VERIFICATION=PENDING. |'
          t,n=old118.subn(repl118,t,count=1)
          if n!=1: raise SystemExit(f'REQ-118 queue row replacement count={n}')
          q.write_text(t)

          r118=Path('requirements/REQ-118_HIGH_QUALITY_HERO_SELECTION_OPENING.md')
          t=r118.read_text().replace('- STATUS: `READY`','- STATUS: `IN_PROGRESS`',1)
          r118.write_text(t)
          PY

      - name: Repair CURRENT to fresh handoff reality
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('CURRENT.md')
          t=p.read_text()
          fields={
            'UPDATED_AT':'2026-09-07 11:05 JST',
            'LATEST_IMPLEMENTATION_COMMIT_SHA':'`707dab7a888bb7a0ba8e25f00316ee07d2e66327`',
            'CURRENT_BUILD_STATUS':'`REQ-117 A/B/C/D MACHINE+PUBLIC PASS / PAGES SUCCESS / RENDER LIVENESS SUCCESS / IOS_PHYSICAL_VERIFICATION=PENDING`',
            'ACTIVE_REQUIREMENT_ID':'`REQ-118`',
            'ACTIVE_REQUIREMENT_PATH':'`requirements/REQ-118_HIGH_QUALITY_HERO_SELECTION_OPENING.md`',
            'QUEUE_PROJECTION_STATUS':'`REQ-117 promoted to VERIFY after A/B/C/D + Pages + render-liveness PASS. REQ-118 is the sole IN_PROGRESS WIP.`',
            'NEXT_ACTION':'`REQ-118 Checkpoint A+B. Fresh-audit title/newGame/continue/save/bootstrap/world/dialogue/audio/fade/input architecture; implement a recoverable cold-open plus playable Aldia opening path without forcing progressed saves backward.`',
            'NEXT_ACTION_COMPLETION_CONDITION':'`Fresh NEW GAME enters Opening A+B through canonical architecture; progressed saves bypass safely; REQ-021/022/001 regressions pass; checkpoint leaves HEAD playable and recoverable.`'
          }
          for k,v in fields.items():
            pat=re.compile(rf'^- {re.escape(k)}:.*$',re.M)
            if not pat.search(t): raise SystemExit(f'missing CURRENT field {k}')
            t=pat.sub(f'- {k}: {v}',t,count=1)
          # Remove stale claim that REQ-127 is active P0 from projection while preserving incident history.
          t=t.replace('- ACTIVE_REQUIREMENT_ID: `REQ-127`','- ACTIVE_REQUIREMENT_ID: `REQ-118`')
          checkpoint='''\n## REQ-117 — WORLD / CHARACTER VISUAL RICHNESS UPGRADE — MACHINE COMPLETE\n\n- STATUS: `VERIFY`.\n- Checkpoint A repaired canonical grounding authority and stale CI references; foot shadow/idle/prompt easing are presentation-only.\n- Checkpoint B keeps map depth while removing per-tile filter/isolation compositor layers on iPhone-sensitive paths.\n- Checkpoint C caps mobile ambient work and removes fog blur/filter while preserving map-aware atmosphere/lifecycle cleanup.\n- Checkpoint D preserves approved Luke 4-direction × 3-frame raster, routes it through the canonical visual body, and prevents sprite rerender from deleting the foot-shadow/body wrapper.\n- Dedicated A/B/C/D gate `34074892503`: SUCCESS. Pages `34074892512`: SUCCESS. Render Liveness `34074892523`: SUCCESS. REQ-121 regression `34074892552`: SUCCESS.\n- IOS_PHYSICAL_VERIFICATION: `PENDING`.\n'''
          if '## REQ-117 — WORLD / CHARACTER VISUAL RICHNESS UPGRADE — MACHINE COMPLETE' not in t:
            t += checkpoint
          p.write_text(t)
          PY

      - name: Verify WIP invariant and commit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          q=Path('WORK_QUEUE.md').read_text()
          rows=[ln for ln in q.splitlines() if '| IN_PROGRESS |' in ln]
          assert len(rows)==1, rows
          assert 'REQ-118' in rows[0], rows
          assert '| 108 | REQ-117 | P1 | VERIFY |' in q
          assert '- STATUS: `IN_PROGRESS`' in Path('requirements/REQ-118_HIGH_QUALITY_HERO_SELECTION_OPENING.md').read_text()
          assert 'STATUS: VERIFY' in Path('requirements/REQ-117_WORLD_CHARACTER_VISUAL_RICHNESS_UPGRADE.md').read_text()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WORK_QUEUE.md CURRENT.md requirements/REQ-117_WORLD_CHARACTER_VISUAL_RICHNESS_UPGRADE.md requirements/REQ-118_HIGH_QUALITY_HERO_SELECTION_OPENING.md
          git commit -m 'queue: promote REQ-117 and start REQ-118 opening'
          git push origin HEAD:main
