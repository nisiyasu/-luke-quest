name: Modern 3D M04 v45 Runtime Hotfix
on:
  push:
    branches: ["prototype/modern-3d"]
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 0
      - name: Repair exact v45 runtime typos
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prototypes/modern-3d/m04-bank-target-v4.js')
          s=p.read_text()
          fixes={
            'const z=.16+j+*.14':'const z=.16+j*.14',
            'new THREE.Float32BufferAttribut(verts,3)':'new THREE.Float32BufferAttribute(verts,3)'
          }
          for old,new in fixes.items():
            if old not in s:
              raise SystemExit(f'missing hotfix anchor: {old}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check prototypes/modern-3d/m04-bank-target-v4.js
          grep -q 'Float32BufferAttribute(verts,3)' prototypes/modern-3d/m04-bank-target-v4.js
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name nisiyasu
          git config user.email yasunori.hashigami@gmail.com
          git rm .github/workflows/modern-3d-m04-v45-hotfix.yml
          git add prototypes/modern-3d/m04-bank-target-v4.js
          git commit -m 'fix(modern-3d): repair v45 compound fern runtime typos'
          git push origin HEAD:prototype/modern-3d
