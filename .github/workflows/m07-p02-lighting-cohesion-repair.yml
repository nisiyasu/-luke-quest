name: M07-P02 Lighting Cohesion Repair

on:
  push:
    branches: ["prototype/modern-3d"]
    paths:
      - ".github/workflows/m07-p02-lighting-cohesion-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 0

      - name: Guard and apply coherent directional shadow repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prototypes/modern-3d/index.html')
          s=p.read_text()
          old="const sun=new THREE.DirectionalLight(0xffd7a1,4.18);sun.position.set(-20,36,12);sun.castShadow=true;const shadowSize=practicalPreset?1024:2048;sun.shadow.mapSize.set(shadowSize,shadowSize);sun.shadow.camera.left=-26;sun.shadow.camera.right=26;sun.shadow.camera.top=30;sun.shadow.camera.bottom=-30;sun.shadow.bias=-.00018;sun.shadow.normalBias=.028;scene.add(sun);\nconst skyFill=new THREE.DirectionalLight(0xb7d7e8,.31);skyFill.position.set(18,22,-22);skyFill.castShadow=false;scene.add(skyFill);document.documentElement.dataset.m07Lighting='cohesion-v1';"
          new="const sun=new THREE.DirectionalLight(0xffd7a1,4.18);sun.position.set(-20,36,12);sun.castShadow=true;const sunTarget=new THREE.Object3D();sunTarget.position.set(-1.35,0,1.10);scene.add(sunTarget);sun.target=sunTarget;const shadowSize=practicalPreset?1024:2048;sun.shadow.mapSize.set(shadowSize,shadowSize);sun.shadow.camera.left=-40;sun.shadow.camera.right=40;sun.shadow.camera.top=42;sun.shadow.camera.bottom=-42;sun.shadow.camera.near=1;sun.shadow.camera.far=100;sun.shadow.bias=-.00016;sun.shadow.normalBias=.035;sun.shadow.radius=practicalPreset?1:1.5;scene.add(sun);\nconst skyFill=new THREE.DirectionalLight(0xb7d7e8,.31);skyFill.position.set(18,22,-22);skyFill.castShadow=false;scene.add(skyFill);document.documentElement.dataset.m07Lighting='cohesion-v2-shadow-field';"
          n=s.count(old)
          if n!=1:
              raise SystemExit(f'guard failed: expected exact current lighting block once, got {n}')
          s=s.replace(old,new)
          p.write_text(s)
          PY
          git diff --check
          git diff -- prototypes/modern-3d/index.html

      - name: Commit lighting repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototypes/modern-3d/index.html
          git commit -m "fix(m07-p02): unify directional shadow field"
          git push origin HEAD:prototype/modern-3d
