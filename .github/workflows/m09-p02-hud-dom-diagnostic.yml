name: M09-P02 Live HUD DOM Diagnostic

on:
  push:
    branches: ["prototype/modern-3d"]
    paths:
      - ".github/workflows/m09-p02-hud-dom-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: |
          python3 -m http.server 8140 --directory prototypes/modern-3d >/tmp/hud-http.log 2>&1 &
          sleep 2
      - name: Inspect live transformed HUD
        run: |
          mkdir -p .huddiag
          cat > huddiag.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
            try{
              const page=await browser.newPage({viewport:{width:390,height:844}});
              await page.goto('http://127.0.0.1:8140/index.html?quality=high',{waitUntil:'domcontentloaded',timeout:150000});
              await page.waitForFunction(()=>document.documentElement.dataset.lqModern3d==='m05-ready'&&document.documentElement.dataset.m09OwnerHud==='pass',{timeout:150000});
              await page.waitForTimeout(500);
              const data=await page.evaluate(()=>({status:document.querySelector('#status')?.outerHTML||'',objective:document.querySelector('.objective')?.outerHTML||'',hint:document.querySelector('#hint')?.outerHTML||'',bodyText:document.body.innerText||'',head:document.documentElement.dataset.m09OwnerHud}));
              const text=JSON.stringify(data,null,2);fs.writeFileSync('.huddiag/live-hud.txt',text);console.log('LIVE_HUD_JSON='+text);
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node huddiag.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: m09-p02-live-hud-dom
          path: .huddiag
          include-hidden-files: true
          retention-days: 7