name: Modern 3D M10 Optimize Package Verify

on:
  push:
    branches: [prototype/modern-3d]
    paths: [.github/workflows/modern-3d-m10-bootstrap.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-candidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Build M10 candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prototypes/modern-3d/index.html'); s=p.read_text()
          old="const stateEl=document.querySelector('#state'),loading=document.querySelector('#loading'),errorEl=document.querySelector('#error'),ciEvidence=document.querySelector('#ci-evidence');\ntry{\nconst renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});\nrenderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.16;document.body.prepend(renderer.domElement);"
          new="const stateEl=document.querySelector('#state'),loading=document.querySelector('#loading'),errorEl=document.querySelector('#error'),ciEvidence=document.querySelector('#ci-evidence');\nconst query=new URLSearchParams(location.search);\nconst qualityPreset=query.get('quality')==='practical'?'practical':'high',practicalPreset=qualityPreset==='practical';\nconst simulatedDpr=Number(query.get('m10dpr'));\nconst sourceDpr=Number.isFinite(simulatedDpr)&&simulatedDpr>0?simulatedDpr:devicePixelRatio;\nconst effectiveDpr=Math.min(sourceDpr,practicalPreset?1.25:2);\ndocument.documentElement.dataset.m10QualityPreset=qualityPreset;\ndocument.documentElement.dataset.m10DprSource=Number.isFinite(simulatedDpr)&&simulatedDpr>0?'simulated-query':'device';\ndocument.documentElement.dataset.m10SourceDpr=sourceDpr.toFixed(2);\ndocument.documentElement.dataset.m10PixelRatio=effectiveDpr.toFixed(2);\ndocument.documentElement.dataset.m10ShadowMapSize=practicalPreset?'1024':'2048';\ntry{\nconst renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});\nrenderer.setPixelRatio(effectiveDpr);renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=practicalPreset?THREE.PCFShadowMap:THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.16;document.body.prepend(renderer.domElement);"
          assert old in s; s=s.replace(old,new,1)
          old="const sun=new THREE.DirectionalLight(0xffd28c,4.05);sun.position.set(-16,36,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-26;sun.shadow.camera.right=26;sun.shadow.camera.top=30;sun.shadow.camera.bottom=-30;sun.shadow.bias=-.00022;sun.shadow.normalBias=.04;scene.add(sun);"
          new="const sun=new THREE.DirectionalLight(0xffd28c,4.05);sun.position.set(-16,36,8);sun.castShadow=true;const shadowSize=practicalPreset?1024:2048;sun.shadow.mapSize.set(shadowSize,shadowSize);sun.shadow.camera.left=-26;sun.shadow.camera.right=26;sun.shadow.camera.top=30;sun.shadow.camera.bottom=-30;sun.shadow.bias=-.00022;sun.shadow.normalBias=.04;scene.add(sun);"
          assert old in s; s=s.replace(old,new,1)
          old="function tick(now){requestAnimationFrame(tick);const dt=Math.max(0,Math.min((now-last)/1000,.05));last=now;stepMovement(dt);const sec=now/1000;waterMain.userData.update(sec);waterLower.userData.update(sec);waterUpperRight.userData.update(sec);player.userData.animate(sec,moving?1:0);const target=new THREE.Vector3(player.position.x-.12,player.position.y*.1,player.position.z-5.7);const cameraBlend=1-Math.exp(-4.2*dt);camera.position.lerp(target.clone().add(offset),cameraBlend);camera.lookAt(target.x,target.y+.45,target.z);renderer.render(scene,camera)}"
          new="const m10PerfSamples=[];let m10PerfWarmup=8;\nfunction publishM10Perf(){if(m10PerfSamples.length<20)return;const a=[...m10PerfSamples].sort((x,y)=>x-y),median=a[Math.floor(a.length*.5)],p95=a[Math.min(a.length-1,Math.floor(a.length*.95))];document.documentElement.dataset.m10PerfMedianMs=median.toFixed(2);document.documentElement.dataset.m10PerfP95Ms=p95.toFixed(2);document.documentElement.dataset.m10DrawCalls=String(renderer.info.render.calls);document.documentElement.dataset.m10Triangles=String(renderer.info.render.triangles);document.documentElement.dataset.m10Textures=String(renderer.info.memory.textures);document.documentElement.dataset.m10PerfSamples=String(a.length);document.documentElement.dataset.m10PerfScope='browser-ci-proxy-not-physical-iphone';document.documentElement.dataset.m10PerfReady='1'}\nfunction tick(now){requestAnimationFrame(tick);const rawFrameMs=Math.max(0,now-last),dt=Math.max(0,Math.min(rawFrameMs/1000,.05));last=now;if(m10PerfWarmup>0)m10PerfWarmup--;else if(m10PerfSamples.length<60){m10PerfSamples.push(rawFrameMs);if(m10PerfSamples.length>=20)publishM10Perf()}stepMovement(dt);const sec=now/1000;waterMain.userData.update(sec);waterLower.userData.update(sec);waterUpperRight.userData.update(sec);player.userData.animate(sec,moving?1:0);const target=new THREE.Vector3(player.position.x-.12,player.position.y*.1,player.position.z-5.7);const cameraBlend=1-Math.exp(-4.2*dt);camera.position.lerp(target.clone().add(offset),cameraBlend);camera.lookAt(target.x,target.y+.45,target.z);renderer.render(scene,camera)}"
          assert old in s; s=s.replace(old,new,1)
          old="addEventListener('resize',resize,{passive:true});resize();syncState();camera.position.set(1.45,30.4,16.7);camera.lookAt(-1.47,.4,-2.5);const query=new URLSearchParams(location.search),m08Proof=query.get('m08proof')==='1';"
          new="addEventListener('resize',resize,{passive:true});resize();syncState();camera.position.set(1.45,30.4,16.7);camera.lookAt(-1.47,.4,-2.5);const m08Proof=query.get('m08proof')==='1';"
          assert old in s; s=s.replace(old,new,1)
          old="loading.remove();stateEl.textContent='王都近郊 · FIELD PROTOTYPE';"
          new="loading.remove();stateEl.textContent=`王都近郊 · ${practicalPreset?'PRACTICAL':'HIGH'}`;"
          assert old in s; s=s.replace(old,new,1)
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('prototypes/modern-3d'); src=(root/'index.html').read_text(); m=re.search(r'<script type="module">\n(.*?)\n</script>',src,re.S); assert m; (root/'.m10-entry.mjs').write_text(m.group(1))
          PY
          (cd prototypes/modern-3d && npx --yes esbuild@0.25.9 .m10-entry.mjs --bundle --format=esm --platform=browser --external:three --outfile=.m10-bundle.mjs)
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('prototypes/modern-3d'); src=(root/'index.html').read_text(); bundle=(root/'.m10-bundle.mjs').read_text(); packaged=re.sub(r'(<script type="module">\n).*?(\n</script>)',lambda m:m.group(1)+bundle+m.group(2),src,count=1,flags=re.S)
          dist=root/'dist'; dist.mkdir(exist_ok=True); (dist/'luke-quest-modern-3d.html').write_text(packaged); assert "from './" not in packaged and 'from "./' not in packaged; assert 'https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js' in packaged; (root/'.m10-entry.mjs').unlink(); (root/'.m10-bundle.mjs').unlink()
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prototypes/modern-3d/README.md'); s=p.read_text(); marker='## M10 distribution and quality presets'; block='''\n\n## M10 distribution and quality presets\n\nM10 keeps the editable source and packaged distribution side by side.\n\n- Source: `index.html` plus local JavaScript modules.\n- Single-HTML package: `dist/luke-quest-modern-3d.html`; HTML, CSS and local JavaScript are bundled into one HTML.\n- Three.js remains an explicit external CDN dependency pinned to `three@0.186.0` through the import map; offline Three.js is not claimed.\n- Supported launch is HTTP, for example `python3 -m http.server 8140 --directory prototypes/modern-3d`; direct `file://` is not the supported path.\n- High preset: `?quality=high` (default), DPR cap 2.0, 2048 shadow map.\n- iPhone practical preset: `?quality=practical`, DPR cap 1.25, 1024 shadow map. This does not redefine the Owner visual target downward.\n- CI uses simulated DPR 1.5 for the HIGH runtime path because Ubuntu SwiftShader at DPR 2.0 exceeded the bounded 120s capture window. HIGH still retains a runtime DPR cap of 2.0. Practical CI uses simulated DPR 2.0 and is capped to 1.25. These are CI proxy conditions, not physical-device measurements.\n- Browser CI statistics are proxy evidence only. After 8 warmup frames, statistics become publishable from 20 samples and continue updating up to 60 samples. Physical iPhone profiling remains `PENDING`.\n- Every material packaging change must reverify the packaged HTML itself; source success is not package success.\n''';
          if marker not in s: s=s.rstrip()+block+'\n'
          p.write_text(s)
          PY
          test -s prototypes/modern-3d/dist/luke-quest-modern-3d.html; grep -F "qualityPreset=query.get('quality')==='practical'?'practical':'high'" prototypes/modern-3d/index.html; grep -F 'three@0.186.0' prototypes/modern-3d/dist/luke-quest-modern-3d.html; ! grep -F "from './" prototypes/modern-3d/dist/luke-quest-modern-3d.html
      - uses: actions/upload-artifact@v4
        with: {name: 'm10-candidate-${{ github.sha }}', path: prototypes/modern-3d, retention-days: 14}

  verify-runtime:
    needs: build-candidate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {surface: source, page: index.html, preset: high, dpr: '1.5', expected_dpr: '1.50'}
          - {surface: source, page: index.html, preset: practical, dpr: '2', expected_dpr: '1.25'}
          - {surface: package, page: dist/luke-quest-modern-3d.html, preset: high, dpr: '1.5', expected_dpr: '1.50'}
          - {surface: package, page: dist/luke-quest-modern-3d.html, preset: practical, dpr: '2', expected_dpr: '1.25'}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: 'm10-candidate-${{ github.sha }}', path: candidate}
      - name: Start server
        run: |
          python3 -m http.server 8140 --directory candidate >/tmp/m10-http.log 2>&1 &
          sleep 1; curl -fsS http://127.0.0.1:8140/index.html >/dev/null
      - name: Capture runtime
        id: capture
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"; mkdir -p evidence; profile="$(mktemp -d)"
          timeout 120s "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --disable-background-networking --disable-component-update --disable-sync --no-first-run --no-default-browser-check --metrics-recording-only --user-data-dir="$profile" --enable-webgl --ignore-gpu-blocklist --use-angle=swiftshader --enable-unsafe-swiftshader --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=6000 --screenshot="evidence/${{ matrix.surface }}-${{ matrix.preset }}.png" --dump-dom "http://127.0.0.1:8140/${{ matrix.page }}?quality=${{ matrix.preset }}&m10dpr=${{ matrix.dpr }}&m08walk=1&m08steps=28" > "evidence/${{ matrix.surface }}-${{ matrix.preset }}.html" 2> "evidence/${{ matrix.surface }}-${{ matrix.preset }}-stderr.log"
          rc=$?; rm -rf "$profile"; echo "$rc" > "evidence/${{ matrix.surface }}-${{ matrix.preset }}-chrome-exit.txt"; exit "$rc"
      - name: Validate runtime
        shell: bash
        run: |
          set -euo pipefail
          f="evidence/${{ matrix.surface }}-${{ matrix.preset }}.html"; png="evidence/${{ matrix.surface }}-${{ matrix.preset }}.png"; echo "capture_outcome=${{ steps.capture.outcome }}"; test '${{ steps.capture.outcome }}' = success; test -s "$png"
          for key in m10-quality-preset m10-dpr-source m10-source-dpr m10-pixel-ratio m10-shadow-map-size m10-perf-ready m10-perf-scope m10-perf-samples m10-perf-median-ms m10-perf-p95-ms m08-walk-done; do printf '%s=' "$key"; grep -o "data-${key}=\"[^\"]*\"" "$f" | head -1 || true; done
          grep -q 'data-m10-perf-ready="1"' "$f"; grep -q 'data-m10-perf-scope="browser-ci-proxy-not-physical-iphone"' "$f"; python3 - "$f" <<'PY'
          import re,sys
          s=open(sys.argv[1],errors='replace').read(); m=re.search(r'data-m10-perf-samples="(\d+)"',s); assert m and int(m.group(1))>=20
          PY
          grep -q 'data-m08-walk-done="1"' "$f"; grep -q '3D PROTOTYPE · DEMO HUD' "$f"; grep -q 'data-m10-quality-preset="${{ matrix.preset }}"' "$f"; grep -q 'data-m10-pixel-ratio="${{ matrix.expected_dpr }}"' "$f"
          if [ '${{ matrix.preset }}' = high ]; then grep -q 'data-m10-shadow-map-size="2048"' "$f"; else grep -q 'data-m10-shadow-map-size="1024"' "$f"; fi
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: 'm10-runtime-${{ matrix.surface }}-${{ matrix.preset }}-${{ github.sha }}', path: evidence, if-no-files-found: warn, retention-days: 14}

  aggregate:
    needs: verify-runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'm10-runtime-*-${{ github.sha }}', path: all-evidence, merge-multiple: true}
      - name: Aggregate measurements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,struct
          root=Path('all-evidence'); rows=[]
          for surface in ('source','package'):
            for preset in ('high','practical'):
              dom=(root/f'{surface}-{preset}.html').read_text(errors='replace')
              def a(n):
                m=re.search(fr'data-{n}="([^"]+)"',dom); assert m,(surface,preset,n); return m.group(1)
              v={k:a(k) for k in ['m10-quality-preset','m10-dpr-source','m10-source-dpr','m10-pixel-ratio','m10-shadow-map-size','m10-perf-median-ms','m10-perf-p95-ms','m10-draw-calls','m10-triangles','m10-textures','m10-perf-samples','m10-perf-scope']}; assert v['m10-quality-preset']==preset and v['m10-dpr-source']=='simulated-query' and v['m10-perf-scope']=='browser-ci-proxy-not-physical-iphone' and int(v['m10-perf-samples'])>=20
              data=(root/f'{surface}-{preset}.png').read_bytes(); assert len(data)>15000 and data[:8]==b'\x89PNG\r\n\x1a\n' and struct.unpack('>II',data[16:24])==(390,844); rows.append((surface,preset,v,len(data)))
          assert all(r[2]['m10-pixel-ratio']=='1.50' and r[2]['m10-shadow-map-size']=='2048' for r in rows if r[1]=='high'); assert all(r[2]['m10-pixel-ratio']=='1.25' and r[2]['m10-shadow-map-size']=='1024' for r in rows if r[1]=='practical')
          L=['# M10 Measurement — CI proxy and package verification','', 'These are browser/GitHub-hosted CI proxy measurements, not physical iPhone measurements. `IOS_PHYSICAL_VERIFICATION` remains `PENDING`. HIGH uses simulated DPR 1.5 in CI because SwiftShader at DPR 2.0 exceeded the bounded capture window; the HIGH runtime cap remains 2.0.','', '| Surface | Preset | Source DPR | Effective DPR | Shadow map | Median ms | p95 ms | Draw calls | Triangles | Textures | Samples | PNG bytes |','|---|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|']
          for surface,preset,v,n in rows: L.append(f"| {surface} | {preset} | {v['m10-source-dpr']} | {v['m10-pixel-ratio']} | {v['m10-shadow-map-size']} | {v['m10-perf-median-ms']} | {v['m10-perf-p95-ms']} | {v['m10-draw-calls']} | {v['m10-triangles']} | {v['m10-textures']} | {v['m10-perf-samples']} | {n} |")
          L += ['', '## Interpretation', '', '- High and practical are explicit presets; practical lowers DPR and shadow-map size without redefining the Owner visual target.', '- CI values are bounded software-renderer proxy evidence only.', '- Source and bundled single-HTML package both booted, moved and rendered.', '- Physical iPhone sustained movement, background/foreground recovery, thermals and actual-device timing remain PENDING.', '']; Path('M10_MEASUREMENT.md').write_text('\n'.join(L))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: 'm10-aggregate-${{ github.sha }}', path: 'all-evidence\nM10_MEASUREMENT.md', retention-days: 14}

  promote:
    needs: aggregate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/download-artifact@v4
        with: {name: 'm10-candidate-${{ github.sha }}', path: candidate}
      - uses: actions/download-artifact@v4
        with: {name: 'm10-aggregate-${{ github.sha }}', path: aggregate}
      - name: Promote verified candidate
        shell: bash
        run: |
          set -euo pipefail
          cp candidate/index.html prototypes/modern-3d/index.html; cp candidate/README.md prototypes/modern-3d/README.md; mkdir -p prototypes/modern-3d/dist; cp candidate/dist/luke-quest-modern-3d.html prototypes/modern-3d/dist/luke-quest-modern-3d.html; cp aggregate/M10_MEASUREMENT.md prototypes/modern-3d/M10_MEASUREMENT.md
          git diff --check; git add prototypes/modern-3d/index.html prototypes/modern-3d/README.md prototypes/modern-3d/dist/luke-quest-modern-3d.html prototypes/modern-3d/M10_MEASUREMENT.md; git diff --cached --quiet && exit 0; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git commit -m 'feat(modern-3d): add M10 quality presets and single-html package'; git push origin HEAD:prototype/modern-3d
