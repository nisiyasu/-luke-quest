name: REQ-117 World Character Richness Gate

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "req117-richness"
  cancel-in-progress: true

jobs:
  richness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and addon contract
        run: |
          node --check addons/world-character-grounding.js
          node --check addons/world-map-depth.js
          node --check addons/world-ambient-layer.js
          node --check addons/zzz-luke-field-sprite.js
          node --check addons/zzzzz-req117-richness-checkpoint-a-smoke.js
          node tools/lq-addon-contract.mjs
      - name: Validate approved Luke field assets
        run: |
          for d in down up left right; do
            f="assets/characters/luke/field-${d}.webp.b64"
            test -s "$f"
            head -c 5 "$f" | grep -q 'UklGR'
          done
      - name: Assemble public Pages script order
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          html=p.read_text()
          marker='<div id="app"></div><script>'
          guard='<div id="app"></div><script src="prelude/autosave-bootstrap-guard.js"></script><script>'
          if html.count(marker)!=1: raise SystemExit('base marker mismatch')
          p.write_text(html.replace(marker,guard,1))
          PY
          mapfile -t patches < <(printf '%s\n' ux-v*.js | sort -V)
          for f in "${patches[@]}"; do sed -i "s#</body>#<script src=\"$f\"></script></body>#" index.html; done
          for f in addons/*.js; do sed -i "s#</body>#<script src=\"$f\"></script></body>#" index.html; done
      - name: Run 390x844 Checkpoint A acceptance
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"; test -n "$BROWSER"
          python3 -m http.server 8147 >/tmp/req117-http.log 2>&1 & pid=$!; trap 'kill "$pid" 2>/dev/null || true' EXIT; sleep 1
          set +e; timeout 35 "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --disable-background-networking --disable-extensions --disable-sync --no-first-run --window-size=390,844 --virtual-time-budget=5200 --dump-dom 'http://127.0.0.1:8147/?lqReq117Smoke=1' >/tmp/req117-dom.html 2>/tmp/req117-browser.log; status=$?; set -e; test -s /tmp/req117-dom.html
          for needle in 'id="lqReq117CheckpointAMarker"' 'data-status="PASS"' 'data-pointer-safe="true"' 'data-rerender-stable="true"' 'data-state-preserved="true"' 'data-save-preserved="true"' 'data-checkpoint="A"' 'data-authority="canonical-grounding"'; do grep -q "$needle" /tmp/req117-dom.html || { echo "REQ-117 A acceptance missing: $needle"; cat /tmp/req117-browser.log || true; exit 1; }; done
          if grep -q 'data-status="FAIL"' /tmp/req117-dom.html || grep -E 'Uncaught (ReferenceError|TypeError|SyntaxError)|ReferenceError:|SyntaxError:' /tmp/req117-browser.log; then echo 'REQ-117 A runtime failure'; cat /tmp/req117-browser.log; exit 1; fi
          echo "REQ-117 Checkpoint A PASS (browser status $status)"
      - name: Run 390x844 Checkpoint B compositor-safe map depth acceptance
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"; test -n "$BROWSER"
          python3 -m http.server 8148 >/tmp/req117-b-http.log 2>&1 & pid=$!; trap 'kill "$pid" 2>/dev/null || true' EXIT; sleep 1
          set +e; timeout 35 "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --disable-background-networking --disable-extensions --disable-sync --no-first-run --window-size=390,844 --virtual-time-budget=6500 --dump-dom 'http://127.0.0.1:8148/?lqReq117DepthSmoke=1' >/tmp/req117-b-dom.html 2>/tmp/req117-b-browser.log; status=$?; set -e; test -s /tmp/req117-b-dom.html
          for needle in 'id="lqReq117CheckpointBMarker"' 'data-status="PASS"' 'data-town="true"' 'data-field="true"' 'data-forest="true"' 'data-edges="true"' 'data-drop-shadows="true"' 'data-presentation-only="true"' 'data-compositor-safe="true"' 'data-filter-effects="false"' 'data-isolation-layers="false"'; do grep -q "$needle" /tmp/req117-b-dom.html || { echo "REQ-117 B acceptance missing: $needle"; cat /tmp/req117-b-browser.log || true; exit 1; }; done
          if grep -q 'lqReq117CheckpointBSmokeFailure' /tmp/req117-b-dom.html || grep -E 'Uncaught (ReferenceError|TypeError|SyntaxError)|ReferenceError:|SyntaxError:' /tmp/req117-b-browser.log; then echo 'REQ-117 B runtime failure'; cat /tmp/req117-b-browser.log; exit 1; fi
          echo "REQ-117 Checkpoint B PASS (browser status $status)"
      - name: Run 390x844 Checkpoint C ambient safety acceptance
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"; test -n "$BROWSER"
          python3 -m http.server 8149 >/tmp/req117-c-http.log 2>&1 & pid=$!; trap 'kill "$pid" 2>/dev/null || true' EXIT; sleep 1
          set +e; timeout 35 "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --disable-background-networking --disable-extensions --disable-sync --no-first-run --window-size=390,844 --virtual-time-budget=7200 --dump-dom 'http://127.0.0.1:8149/?lqReq117AmbientSmoke=1' >/tmp/req117-c-dom.html 2>/tmp/req117-c-browser.log; status=$?; set -e; test -s /tmp/req117-c-dom.html
          for needle in 'id="lqReq117CheckpointCMarker"' 'data-status="PASS"' 'data-town="motes"' 'data-forest="leaves"' 'data-mist="fog"' 'data-visibility-pause="true"' 'data-cleanup="true"' 'data-mobile-cap="true"' 'data-pointer-safe="true"' 'data-fog-filter-effects="false"' 'data-compositor-safe="true"'; do grep -q "$needle" /tmp/req117-c-dom.html || { echo "REQ-117 C acceptance missing: $needle"; cat /tmp/req117-c-browser.log || true; exit 1; }; done
          if grep -q 'lqReq117CheckpointCSmokeFailure' /tmp/req117-c-dom.html || grep -E 'Uncaught (ReferenceError|TypeError|SyntaxError)|ReferenceError:|SyntaxError:' /tmp/req117-c-browser.log; then echo 'REQ-117 C runtime failure'; cat /tmp/req117-c-browser.log; exit 1; fi
          echo "REQ-117 Checkpoint C PASS (browser status $status)"
      - name: Run 390x844 Checkpoint D approved sprite integration acceptance
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"; test -n "$BROWSER"
          python3 -m http.server 8150 >/tmp/req117-d-http.log 2>&1 & pid=$!; trap 'kill "$pid" 2>/dev/null || true' EXIT; sleep 1
          set +e; timeout 35 "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --disable-background-networking --disable-extensions --disable-sync --no-first-run --window-size=390,844 --virtual-time-budget=9000 --dump-dom 'http://127.0.0.1:8150/?lqReq117SpriteSmoke=1' >/tmp/req117-d-dom.html 2>/tmp/req117-d-browser.log; status=$?; set -e; test -s /tmp/req117-d-dom.html
          for needle in 'id="lqReq117CheckpointDMarker"' 'data-status="PASS"' 'data-directions="4"' 'data-frames="3"' 'data-approved-raster="true"' 'data-grounding-preserved="true"' 'data-npc-silhouette="true"' 'data-filter-effects="false"' 'data-presentation-only="true"'; do grep -q "$needle" /tmp/req117-d-dom.html || { echo "REQ-117 D acceptance missing: $needle"; grep -o 'lqReq117CheckpointDMarker[^<]*\|data-[a-z-]*="[^"]*"' /tmp/req117-d-dom.html | tail -80 || true; cat /tmp/req117-d-browser.log || true; exit 1; }; done
          if grep -q 'lqReq117CheckpointDSmokeFailure' /tmp/req117-d-dom.html || grep -E 'Uncaught (ReferenceError|TypeError|SyntaxError)|ReferenceError:|SyntaxError:' /tmp/req117-d-browser.log; then echo 'REQ-117 D runtime failure'; cat /tmp/req117-d-browser.log; exit 1; fi
          echo "REQ-117 Checkpoint D PASS with approved 4dir/3frame raster preserved (browser status $status)"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: req117-abcd-${{ github.sha }}
          path: |
            /tmp/req117-dom.html
            /tmp/req117-browser.log
            /tmp/req117-http.log
            /tmp/req117-b-dom.html
            /tmp/req117-b-browser.log
            /tmp/req117-b-http.log
            /tmp/req117-c-dom.html
            /tmp/req117-c-browser.log
            /tmp/req117-c-http.log
            /tmp/req117-d-dom.html
            /tmp/req117-d-browser.log
            /tmp/req117-d-http.log
          retention-days: 7
          if-no-files-found: warn
