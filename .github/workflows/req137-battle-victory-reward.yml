name: REQ-137 Battle Victory Reward

on:
  push:
    paths:
      - 'requirements/REQ-137_BATTLE_VICTORY_REWARD_SUMMARY.md'
      - 'addons/req137-battle-victory-reward-summary.js'
      - 'addons/zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz-req137-victory-reward-smoke.js'
      - '.github/workflows/req137-battle-victory-reward.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assembled-victory-reward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check addons/req137-battle-victory-reward-summary.js
          node --check addons/zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz-req137-victory-reward-smoke.js
          node --check addons/req136-battle-log-latest-follow.js
          node --check addons/req135-battle-command-feedback.js
          node --check addons/req134-iphone-battle-touch-ui.js
      - name: Assemble Pages-equivalent runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); html=p.read_text()
          marker='<div id="app"></div><script>'
          guard='<div id="app"></div><script src="prelude/autosave-bootstrap-guard.js"></script><script>'
          if html.count(marker)!=1: raise SystemExit('base marker mismatch')
          p.write_text(html.replace(marker,guard,1))
          PY
          mapfile -t patches < <(printf '%s\n' ux-v*.js | sort -V)
          for f in "${patches[@]}"; do sed -i "s#</body>#<script src=\"$f\"></script></body>#" index.html; done
          if compgen -G 'addons/*.js' > /dev/null; then for f in addons/*.js; do sed -i "s#</body>#<script src=\"$f\"></script></body>#" index.html; done; fi
      - name: 390x844 assembled victory reward acceptance
        id: acceptance
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"; test -n "$BROWSER"
          python3 -m http.server 8140 >/tmp/lq-req137-http.log 2>&1 & pid=$!; trap 'kill "$pid" 2>/dev/null || true' EXIT; sleep 1
          timeout 35 "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --disable-extensions --disable-sync --no-first-run --window-size=390,844 --virtual-time-budget=7000 --dump-dom 'http://127.0.0.1:8140/?lqReq137Smoke=1' >/tmp/lq-req137-dom.html 2>/tmp/lq-req137-chrome.log || true
          grep -o '<i id="lqReq137VictoryRewardSmokeMarker"[^>]*>' /tmp/lq-req137-dom.html | tee /tmp/lq-req137-marker.txt || true
          grep -q 'id="lqReq137VictoryRewardSmokeMarker"[^>]*data-pass="true"' /tmp/lq-req137-dom.html
      - name: REQ-136 regression
        id: req136
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          python3 -m http.server 8141 >/tmp/lq-req136-under-137-http.log 2>&1 & pid=$!; trap 'kill "$pid" 2>/dev/null || true' EXIT; sleep 1
          timeout 35 "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,844 --virtual-time-budget=7000 --dump-dom 'http://127.0.0.1:8141/?lqReq136Smoke=1' >/tmp/lq-req136-under-137-dom.html 2>/tmp/lq-req136-under-137-chrome.log || true
          grep -q 'id="lqReq136BattleLogFollowSmokeMarker"[^>]*data-pass="true"' /tmp/lq-req136-under-137-dom.html
      - name: REQ-135 regression
        id: req135
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          python3 -m http.server 8142 >/tmp/lq-req135-under-137-http.log 2>&1 & pid=$!; trap 'kill "$pid" 2>/dev/null || true' EXIT; sleep 1
          timeout 35 "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,844 --virtual-time-budget=7000 --dump-dom 'http://127.0.0.1:8142/?lqReq135Smoke=1' >/tmp/lq-req135-under-137-dom.html 2>/tmp/lq-req135-under-137-chrome.log || true
          grep -q 'id="lqReq135BattleFeedbackSmokeMarker"[^>]*data-pass="true"' /tmp/lq-req135-under-137-dom.html
      - name: REQ-134 regression
        id: req134
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          python3 -m http.server 8143 >/tmp/lq-req134-under-137-http.log 2>&1 & pid=$!; trap 'kill "$pid" 2>/dev/null || true' EXIT; sleep 1
          timeout 35 "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,844 --virtual-time-budget=7000 --dump-dom 'http://127.0.0.1:8143/?lqReq134Smoke=1' >/tmp/lq-req134-under-137-dom.html 2>/tmp/lq-req134-under-137-chrome.log || true
          grep -q 'id="lqReq134BattleTouchSmokeMarker"[^>]*data-pass="true"' /tmp/lq-req134-under-137-dom.html
      - name: Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: req137-diagnostics
          path: |
            /tmp/lq-req137-marker.txt
            /tmp/lq-req137-dom.html
            /tmp/lq-req137-chrome.log
          if-no-files-found: warn
          retention-days: 1
