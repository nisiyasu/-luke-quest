name: REQ-127 CURRENT Sync Once

on:
  push:
    paths:
      - '.github/workflows/req127-current-sync-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync CURRENT to fresh REQ-127 evidence
        env:
          TZ: Asia/Tokyo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, datetime
          p=Path('CURRENT.md')
          t=p.read_text()
          now=datetime.datetime.now().strftime('%Y-%m-%d %H:%M JST')
          def repl(prefix, value):
              global t
              pat=rf'(?m)^- {re.escape(prefix)}: .*?$'
              new=f'- {prefix}: `{value}`'
              t2,n=re.subn(pat,new,t,count=1)
              if n!=1:
                  raise SystemExit(f'expected one {prefix} line, got {n}')
              t=t2
          repl('UPDATED_AT', now)
          repl('CURRENT_BUILD_STATUS', 'REQ-127 remains P0 IN_PROGRESS. Production resume-heal v1.1 remains the latest gameplay implementation. A later red/green flip on identical game code was isolated to REQ-127 render-smoke timing: failed evidence was visibly non-black and the resume-heal marker itself was PASS, while the final smoke marker had not reached Chrome dump-dom. Test checkpoint 967408ad... adds a bounded timer fallback to frame settling without weakening any recovery assertion. Pages 34176697481 SUCCESS; Render Liveness 34176697478 SUCCESS including Chromium + Playwright WebKit pixel analysis; cache-busted recovery 34176750491 SUCCESS including exact-artifact pixel gate and real Pages deployment. Physical iPhone result remains unresolved; IOS_PHYSICAL_VERIFICATION=PENDING.')
          repl('RECENT_CHECKPOINTS', '6e50e93a... adds presentation-only PWA resume world-plane heal; d57783b2... upgrades it to clear frozen lqMapArrive 0% presentation state; a8611ba3... deliberately reproduces frozen arrival + dark fade + stale world plane; c402c3bb... requires the same recovery in WebKit; cf544fa3... fail-closes Render Liveness; c26b67b0... removes addon load-order race; 967408ad... stabilizes smoke frame settling after preserved failed evidence proved a diagnostic timing false-negative, with recovery assertions unchanged.')
          repl('TESTS_AND_VERIFICATION', 'Pages 34176697481 SUCCESS including real Pages deploy; Render Liveness 34176697478 SUCCESS including exact iPhone-sized Chromium capture/pixels plus Playwright WebKit iPhone-sized capture/pixels; cache-busted recovery 34176750491 SUCCESS including exact recovery artifact pixel gate, upload and real Pages deployment; REQ-023 evacuation guidance 34176697471 SUCCESS. Prior 49799159... Render/cache-bust red was a diagnostic timing false-negative: preserved screenshot was non-black, runtime/resume-heal markers were healthy, and c26b67b0...→49799159... changed only CURRENT.md.')
          repl('BLOCKERS', 'No machine-side blocker. REQ-127 production candidate and stabilized validation lanes are machine/public green; physical iPhone confirmation remains Owner-only. Continue evidence-based lifecycle/occluder/compositor diagnosis if the symptom persists.')
          repl('NEXT_ACTION', 'Keep REQ-127 active until Owner physical verification. Treat 967408ad... as validation-harness stabilization only, not a production black-screen fix. If the device remains dark after the d57783b2 recovery is live, expand runtime evidence for iPhone-only full-viewport occluders/compositor state rather than repeating rollback/cache/gamepad/ambient/generic compositor/fade-only theories.')
          anchor='- IOS_PHYSICAL_VERIFICATION: `PENDING`.\n\n## OWNER-APPROVED STORY REALITY'
          evidence=(
              '- Validation checkpoint `967408ad6c4faa5a6e4314b5d87ed8d316a1e23b` fixes a diagnostic-only requestAnimationFrame starvation race with an 80ms bounded timer fallback per settling frame; all fade/arrival/shell/fullscreen/world-size/logical-state/heal-marker assertions remain fail-closed.\n'
              '- The prior failed cache-busted evidence was not black: the captured world/player/shell were visible and `lqReq127ResumeWorldHealMarker` was PASS; only the final async render-smoke marker was absent at one-shot `--dump-dom` time.\n'
              '- On `967408ad...`, Standard Pages `34176697481`, Render Liveness `34176697478` (Chromium + WebKit pixels), cache-busted recovery `34176750491` (exact-artifact pixel gate + deploy), and REQ-023 `34176697471` are SUCCESS.\n'
              '- This stabilizes the diagnostic instrument; it does not by itself establish physical iPhone recovery.\n'
          )
          if 'Validation checkpoint `967408ad6c4faa5a6e4314b5d87ed8d316a1e23b`' not in t:
              if anchor not in t:
                  raise SystemExit('REQ-127 insertion anchor not found')
              t=t.replace(anchor,evidence+anchor,1)
          p.write_text(t)
          Path('.github/workflows/req127-current-sync-once.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT.md .github/workflows/req127-current-sync-once.yml
          git commit -m 'chore: sync REQ-127 validation evidence'
          git pull --rebase origin main
          git push origin HEAD:main
