name: M03-P01 Portrait Exact Evidence

on:
  push:
    branches: ["prototype/modern-3d"]
    paths:
      - ".github/workflows/m03-p01-portrait-exact-evidence.yml"
  workflow_dispatch:

jobs:
  portrait-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start runtime
        run: |
          python3 -m http.server 8141 --directory prototypes/modern-3d >/tmp/m03-p01-portrait-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8141/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/m03-p01-portrait-http.log
          exit 1
      - name: Capture exact-head portrait and canonical traversal gate
        run: |
          mkdir -p .m03-p01-portrait
          cat > capture-m03-p01-portrait.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            page.setDefaultTimeout(60000);
            const cdp=await page.context().newCDPSession(page);
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8141/index.html?quality=high',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>document.documentElement.dataset.lqModern3d==='m05-ready'&&document.documentElement.dataset.m09OwnerHud==='pass'&&document.documentElement.dataset.m03Ci==='pass',{timeout:60000});
            await page.waitForTimeout(1500);
            const meta=await page.evaluate(()=>({scene:document.documentElement.dataset.lqModern3d,hud:document.documentElement.dataset.m09OwnerHud,profile:document.documentElement.dataset.m03CameraProfile||'UNKNOWN',player:document.documentElement.dataset.m08Player,ci:document.documentElement.dataset.m03Ci,route:document.documentElement.dataset.m03Route||'',ciDetail:window.LQ_MODERN_3D_M05?.ci||null}));
            if(meta.scene!=='m05-ready'||meta.hud!=='pass'||meta.profile!=='portrait-target-family-v2'||meta.ci!=='pass'||errors.length) throw new Error('runtime invalid '+JSON.stringify({meta,errors}));
            const shot=await cdp.send('Page.captureScreenshot',{format:'png',fromSurface:true});
            fs.writeFileSync('.m03-p01-portrait/portrait-near.png',Buffer.from(shot.data,'base64'));
            fs.writeFileSync('.m03-p01-portrait/runtime-audit.txt',`head=${process.env.GITHUB_SHA}\nmeta=${JSON.stringify(meta)}\ncanonical-m03-traversal PASS\npage_errors=${errors.length}\n`);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node capture-m03-p01-portrait.cjs
      - name: Add target references
        run: |
          curl -L --fail --retry 3 -o .m03-p01-portrait/MINIMUM_QUALITY_LINE.png https://raw.githubusercontent.com/nisiyasu/-luke-quest/eb6ec9fafc053b6dbabb6ee473932b7c7851ebc6/assets/reference/owner_2026-09-11_ps1_visual_target/MINIMUM_QUALITY_LINE.png
          curl -L --fail --retry 3 -o .m03-p01-portrait/TARGET_PS1_FINAL.png https://raw.githubusercontent.com/nisiyasu/-luke-quest/eb6ec9fafc053b6dbabb6ee473932b7c7851ebc6/assets/reference/owner_2026-09-11_ps1_visual_target/TARGET_PS1_FINAL.png
      - uses: actions/upload-artifact@v4
        with:
          name: m03-p01-portrait-exact-evidence
          path: .m03-p01-portrait
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
