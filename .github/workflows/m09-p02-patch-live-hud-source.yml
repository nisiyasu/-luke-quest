name: M09-P02 Patch Live HUD Source

on:
  push:
    branches: ["prototype/modern-3d"]
    paths:
      - ".github/workflows/m09-p02-patch-live-hud-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 0
      - name: Remove fake HP markup and styles at generator source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prototypes/modern-3d/ui-quality-v51b.js')
          s=p.read_text()
          markup='<div class="hud-hp-row"><span>HP</span><div class="hud-hp-track"><i></i></div></div>'
          css='.hud-hp-row{display:grid;grid-template-columns:20px 1fr;align-items:center;gap:6px;margin-top:7px}.hud-hp-row>span{font:700 8px Georgia,serif;letter-spacing:.08em;color:#e5d5aa}.hud-hp-track{height:6px;border:1px solid rgba(226,198,123,.72);background:#152029;border-radius:4px;overflow:hidden;box-shadow:inset 0 1px 3px #0008}.hud-hp-track i{display:block;width:82%;height:100%;background:linear-gradient(90deg,#3ba85a,#7ada80);box-shadow:0 0 5px rgba(100,220,120,.35)}\n'
          media='.hud-hp-row{margin-top:4px}'
          if s.count(markup)!=1:
              raise SystemExit(f'FAIL_CLOSED markup count={s.count(markup)}')
          if s.count(css)!=1:
              raise SystemExit(f'FAIL_CLOSED css count={s.count(css)}')
          s=s.replace(markup,'').replace(css,'').replace(media,'')
          if 'hud-hp-row' in s or 'hud-hp-track' in s:
              raise SystemExit('FAIL_CLOSED fake HP source token remains')
          p.write_text(s)
          PY
          git diff --check
          git diff -- prototypes/modern-3d/ui-quality-v51b.js
      - name: Commit source repair
        run: |
          git config user.name "LUKE QUEST Scheduled Engineer"
          git config user.email "actions@users.noreply.github.com"
          git add prototypes/modern-3d/ui-quality-v51b.js
          git diff --cached --quiet && { echo 'No source patch produced'; exit 1; }
          git commit -m "fix(m09-p02): remove fake HP from live HUD"
          git push origin HEAD:prototype/modern-3d