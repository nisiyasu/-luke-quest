name: One-shot REQ-136 Queue Sync

on:
  push:
    paths:
      - '.github/workflows/zz-req136-queue-sync-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize REQ-136 and remove one-shot workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('WORK_QUEUE.md')
          s=p.read_text()
          if '| 118 | REQ-136 |' not in s:
              anchor='| 117 | REQ-135 | P1 | VERIFY | iPhone Battle Command Touch Feedback | `requirements/REQ-135_IPHONE_BATTLE_COMMAND_FEEDBACK.md` | Presentation-only active/focus/disabled feedback on existing REQ-134 battle command targets. Dedicated run 34195389737 SUCCESS and exact-HEAD Pages run 34195389767 SUCCESS on `dcaee504...`; embedded REQ-134 regression PASS; no duplicate battle handlers. IOS_PHYSICAL_VERIFICATION=PENDING. |'
              if anchor not in s:
                  raise SystemExit('REQ-135 queue anchor missing; fail closed')
              row='| 118 | REQ-136 | P1 | VERIFY | Battle Log Latest Message Follow | `requirements/REQ-136_BATTLE_LOG_LATEST_MESSAGE_FOLLOW.md` | Final assembled battle log now follows the latest combat result after base render and late presentation replacement. Dedicated 390x844 run 34199130632 SUCCESS; REQ-134/135 regressions PASS; exact-head Pages 34199130663 SUCCESS on `e29b136f...`; IOS_PHYSICAL_VERIFICATION=PENDING. |'
              s=s.replace(anchor,anchor+'\n'+row,1)
              p.write_text(s)
          PY
          rm .github/workflows/zz-req136-queue-sync-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WORK_QUEUE.md .github/workflows/zz-req136-queue-sync-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'meta: sync REQ-136 queue and remove one-shot workflow'
          git pull --rebase origin main
          git push origin HEAD:main
