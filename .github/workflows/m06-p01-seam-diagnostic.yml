name: M06-P01 Seam Cause Diagnostic

on:
  push:
    branches: ["prototype/modern-3d"]
    paths:
      - ".github/workflows/m06-p01-seam-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Build bounded diagnostic variants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          src=Path('prototypes/modern-3d')
          root=Path('.m06-diagnostic')
          root.mkdir(exist_ok=True)
          old='bank(509,14,13,-9.8,1.65,7.0,-1,Math.PI/2);'
          variants={
            'baseline':old,
            'bank509-narrow':'bank(509,14,9.0,-10.8,1.55,7.0,-1,Math.PI/2);',
            'bank509-mid':'bank(509,14,10.0,-10.6,1.55,7.0,-1,Math.PI/2);',
            'bank509-split':'bank(5091,7.8,8.8,-10.7,1.55,3.8,-1,Math.PI/2);bank(5092,7.5,8.4,-10.9,1.48,10.1,-1,Math.PI/2);',
            'bank509-split-left':'bank(5091,7.8,7.8,-11.2,1.50,3.8,-1,Math.PI/2);bank(5092,7.5,7.6,-11.3,1.44,10.1,-1,Math.PI/2);',
          }
          for name,repl in variants.items():
            dst=root/name
            shutil.copytree(src,dst)
            p=dst/'index.html'; t=p.read_text(encoding='utf-8')
            if t.count(old)!=1: raise SystemExit(f'FAIL_CLOSED {name} count={t.count(old)}')
            if name!='baseline': t=t.replace(old,repl,1)
            p.write_text(t,encoding='utf-8')
          PY
      - name: Start diagnostic runtime
        run: |
          python3 -m http.server 8141 --bind 127.0.0.1 >/tmp/m06diag-http.log 2>&1 &
          sleep 2
      - name: Capture static same-camera variants
        run: |
          cat > m06diag.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            const cases=['baseline','bank509-narrow','bank509-mid','bank509-split','bank509-split-left'];
            const audit=[];
            for(const name of cases){
              const errors=[]; const h=e=>errors.push(String(e)); page.on('pageerror',h);
              await page.goto(`http://127.0.0.1:8141/.m06-diagnostic/${name}/index.html?quality=high&m08gate=1&ci=1`,{waitUntil:'domcontentloaded',timeout:150000});
              await page.waitForFunction(()=>document.documentElement.dataset.lqModern3d==='m05-ready',{timeout:150000});
              await page.waitForTimeout(120);
              await page.screenshot({path:`.m06-diagnostic/${name}.png`,fullPage:true,timeout:150000});
              audit.push(`${name}: page_errors=${errors.length}`); page.off('pageerror',h);
            }
            audit.push(`head=${process.env.GITHUB_SHA||'UNKNOWN'}`);
            fs.writeFileSync('.m06-diagnostic/audit.txt',audit.join('\n')+'\n');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node m06diag.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m06-p01-seam-diagnostic
          path: |
            .m06-diagnostic/*.png
            .m06-diagnostic/audit.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
