name: Repair Pages Legacy Map Assertion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-pages-legacy-map-assertion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Align persisted-map assertion with canonical migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/pages.yml')
          text = p.read_text()
          old = "assert_dom 'data-map=\"northCliffRoad\"' /tmp/lq-persisted-addon-map-dom.html persisted-map-restored"
          new = "assert_dom 'data-map=\"evacRoute\"' /tmp/lq-persisted-addon-map-dom.html persisted-map-migrated"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale assertion, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'LUKE QUEST Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/pages.yml
          git commit -m 'test: expect canonical evacRoute after legacy save migration'
          git push origin HEAD:main
