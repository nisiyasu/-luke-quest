name: Modern 3D M07 Water Light Evidence
# m07-p01 exact-head refresh
# evidence-v68: Playwright runtime capture after Chromium --screenshot timeout

on:
  push:
    branches: [prototype/modern-3d]
    paths:
      - 'prototypes/modern-3d/**'
      - '.github/workflows/modern-3d-m07-water-light-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Start prototype server
        run: |
          python3 -m http.server 8140 --directory prototypes/modern-3d >/tmp/m07-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8140/index.html >/dev/null

      - name: Verify M07 water source contract
        run: |
          set -euo pipefail
          grep -Eq "stage:'(M04_REGATE|M07_IN_PROGRESS)'" prototypes/modern-3d/m04-water-target-v3.js
          grep -q "single-pass analytic wave-normal Fresnel sky reflection" prototypes/modern-3d/m04-water-target-v3.js
          grep -q "qualityPreset:resolvedQuality" prototypes/modern-3d/m04-water-target-v3.js

      - name: Capture fresh portrait landscape and motion evidence
        run: |
          set -euo pipefail
          mkdir -p .m07-evidence
          cat > m07-proof.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const rows = [];
          const persist = () => fs.writeFileSync('.m07-evidence/m07-performance.txt', rows.join('\n') + '\n');

          async function openReady(browser, quality, viewport, label) {
            const page = await browser.newPage({ viewport, deviceScaleFactor: 1 });
            page.setDefaultTimeout(150000);
            const errors = [];
            page.on('pageerror', e => errors.push(`pageerror:${String(e)}`));
            page.on('console', m => { if (m.type() === 'error') errors.push(`console:${m.text()}`); });
            const started = Date.now();
            await page.goto(`http://127.0.0.1:8140/index.html?quality=${quality}`, { waitUntil: 'domcontentloaded', timeout: 150000 });
            await page.waitForFunction(() => document.documentElement.dataset.lqModern3d === 'm05-ready', { timeout: 150000 });
            await page.waitForTimeout(1200);
            const meta = await page.evaluate(() => ({
              scene: document.documentElement.dataset.lqModern3d || 'UNKNOWN',
              waterStage: window.LQ_M04_WATER_TARGET_V3?.stage || 'UNKNOWN',
              quality: window.LQ_M04_WATER_TARGET_V3?.qualityPreset || 'UNKNOWN',
              player: document.documentElement.dataset.m08Player || 'UNKNOWN',
              camera: document.documentElement.dataset.m03CameraProfile || 'UNKNOWN'
            }));
            if (errors.length) throw new Error(`${label} runtime errors=${JSON.stringify(errors)}`);
            rows.push(`${label} ready_ms=${Date.now() - started} meta=${JSON.stringify(meta)}`);
            persist();
            return page;
          }

          async function snap(page, path, label) {
            const started = Date.now();
            await page.screenshot({ path, fullPage: true, timeout: 150000 });
            if (!fs.existsSync(path) || fs.statSync(path).size === 0) throw new Error(`${label} screenshot missing`);
            rows.push(`${label} screenshot_ms=${Date.now() - started} file=${path} bytes=${fs.statSync(path).size} result=PASS`);
            persist();
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--use-angle=swiftshader', '--enable-unsafe-swiftshader', '--ignore-gpu-blocklist', '--disable-dev-shm-usage']
            });
            try {
              let page = await openReady(browser, 'practical', { width: 390, height: 844 }, 'practical-portrait');
              await snap(page, '.m07-evidence/practical-390x844.png', 'practical-portrait');
              await page.close();

              page = await openReady(browser, 'high', { width: 390, height: 844 }, 'high-portrait');
              await snap(page, '.m07-evidence/high-390x844.png', 'high-portrait');
              await page.close();

              page = await openReady(browser, 'high', { width: 844, height: 390 }, 'high-landscape');
              await snap(page, '.m07-evidence/high-844x390.png', 'high-landscape');
              await page.close();

              page = await openReady(browser, 'practical', { width: 390, height: 844 }, 'motion');
              for (let i = 1; i <= 3; i++) {
                await page.waitForTimeout(i === 1 ? 250 : 700);
                await snap(page, `.m07-evidence/motion-0${i}.png`, `motion-0${i}`);
              }
              await page.close();
              rows.push('MOTION_FRAMES_CAPTURED=3');
              persist();
            } catch (e) {
              rows.push(`FAIL ${String(e)}`);
              persist();
              throw e;
            } finally {
              await browser.close();
            }
          })().catch(e => { console.error(e); process.exit(1); });
          JS
          node m07-proof.cjs
          test -s .m07-evidence/high-390x844.png
          test -s .m07-evidence/high-844x390.png
          test -s .m07-evidence/practical-390x844.png
          test "$(find .m07-evidence -maxdepth 1 -name 'motion-*.png' -type f | wc -l | tr -d ' ')" -ge 2

      - name: Encode bounded water motion video
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -y -pattern_type glob -framerate 2 -i '.m07-evidence/motion-*.png' \
            -c:v libx264 -pix_fmt yuv420p .m07-evidence/water-motion-practical.mp4 >/tmp/m07-ffmpeg.log 2>&1
          test -s .m07-evidence/water-motion-practical.mp4
          echo 'MOTION_VIDEO=PASS bounded practical-preset runtime frame sequence' >> .m07-evidence/m07-performance.txt

      - name: Record M07 evidence manifest
        if: ${{ always() }}
        run: |
          mkdir -p .m07-evidence
          STILL_HIGH_390=$(test -s .m07-evidence/high-390x844.png && echo PASS || echo MISSING)
          STILL_HIGH_LANDSCAPE=$(test -s .m07-evidence/high-844x390.png && echo PASS || echo MISSING)
          STILL_PRACTICAL_390=$(test -s .m07-evidence/practical-390x844.png && echo PASS || echo MISSING)
          MOTION_COUNT=$(find .m07-evidence -maxdepth 1 -name 'motion-*.png' -type f 2>/dev/null | wc -l | tr -d ' ')
          MOTION_VIDEO=$(test -s .m07-evidence/water-motion-practical.mp4 && echo PASS || echo MISSING)
          cat > .m07-evidence/M07_EVIDENCE.txt <<EOF
          HEAD=${GITHUB_SHA}
          REFLECTION_METHOD=single-pass analytic wave-normal Fresnel sky reflection + directional sun specular; no planar RTT/SSR
          HIGH_PRESET=96x40 water grid; denser glints/shore treatment; shoreline rock cast shadows
          PRACTICAL_PRESET=52x20 water grid; reduced glints/shore treatment; fewer rocks; no shoreline rock cast shadows
          VIEWPORTS=390x844 high/practical; 844x390 high landscape
          MOTION=bounded practical-preset runtime sequence; two or more frames required; MP4 encoded with ffmpeg
          STILL_HIGH_390=${STILL_HIGH_390}
          STILL_HIGH_LANDSCAPE=${STILL_HIGH_LANDSCAPE}
          STILL_PRACTICAL_390=${STILL_PRACTICAL_390}
          MOTION_FRAME_COUNT=${MOTION_COUNT}
          MOTION_VIDEO=${MOTION_VIDEO}
          OWNER_EXPERIENCE_PASS=PENDING
          IOS_PHYSICAL_VERIFICATION=PENDING
          EOF
          test -f .m07-evidence/m07-performance.txt && cat .m07-evidence/m07-performance.txt >> .m07-evidence/M07_EVIDENCE.txt || true

      - name: Upload M07 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: modern-3d-m07-water-light-${{ github.sha }}
          path: |
            .m07-evidence/
            /tmp/m07-http.log
            /tmp/m07-ffmpeg.log
            assets/reference/owner_2026-09-11_ps1_visual_target/MINIMUM_QUALITY_LINE.png
            assets/reference/owner_2026-09-11_ps1_visual_target/TARGET_PS1_FINAL.png
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14