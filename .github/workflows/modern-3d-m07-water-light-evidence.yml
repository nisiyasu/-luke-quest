name: Modern 3D M07 Water Light Evidence

on:
  push:
    branches: [prototype/modern-3d]
    paths:
      - 'prototypes/modern-3d/**'
      - '.github/workflows/modern-3d-m07-water-light-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Start prototype server
        run: |
          python3 -m http.server 8140 --directory prototypes/modern-3d >/tmp/m07-http.log 2>&1 &
          sleep 1
          curl -fsS http://127.0.0.1:8140/index.html >/dev/null

      - name: Verify M07 water contract and runtime
        run: |
          set -euo pipefail
          grep -q "stage:'M07_IN_PROGRESS'" prototypes/modern-3d/m04-water-target-v3.js
          grep -q "single-pass analytic wave-normal Fresnel sky reflection" prototypes/modern-3d/m04-water-target-v3.js
          grep -q "qualityPreset:resolvedQuality" prototypes/modern-3d/m04-water-target-v3.js
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          test -n "$BROWSER"
          mkdir -p .m07-evidence
          timeout 55s "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-webgl --ignore-gpu-blocklist --use-angle=swiftshader --enable-unsafe-swiftshader \
            --window-size=390,844 --virtual-time-budget=850 --dump-dom \
            'http://127.0.0.1:8140/index.html?ci=1&quality=high' > .m07-evidence/high-dom.html 2>.m07-evidence/high-chrome.log
          grep -q 'data-lq-modern3d="m05-ready"' .m07-evidence/high-dom.html
          grep -q 'data-m03-ci="pass"' .m07-evidence/high-dom.html

      - name: Capture high and practical preset stills
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          mkdir -p .m07-evidence
          capture(){
            local quality="$1" size="$2" budget="$3" out="$4"
            local attempt start end rc
            for attempt in 1 2; do
              start=$(date +%s%3N)
              set +e
              timeout 65s "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage \
                --enable-webgl --ignore-gpu-blocklist --use-angle=swiftshader --enable-unsafe-swiftshader \
                --hide-scrollbars --window-size="$size" --virtual-time-budget="$budget" \
                --screenshot=".m07-evidence/$out" "http://127.0.0.1:8140/index.html?quality=$quality"
              rc=$?
              set -e
              end=$(date +%s%3N)
              if [ "$rc" -eq 0 ] && test -s ".m07-evidence/$out"; then
                echo "$quality $size budget_ms=$budget wall_ms=$((end-start)) file=$out attempt=$attempt result=PASS" >> .m07-evidence/m07-performance.txt
                return 0
              fi
              echo "$quality $size budget_ms=$budget wall_ms=$((end-start)) file=$out attempt=$attempt result=RETRY rc=$rc" >> .m07-evidence/m07-performance.txt
              rm -f ".m07-evidence/$out"
              sleep 1
            done
            echo "$quality $size file=$out result=FAIL_AFTER_RETRY" >> .m07-evidence/m07-performance.txt
            return 1
          }
          # Capture the practical proof first so a late high/HQ timeout cannot erase preset comparison evidence.
          capture practical 390,844 900 practical-390x844.png
          capture high 390,844 900 high-390x844.png
          capture high 864,1536 900 high-864x1536.png
          test -s .m07-evidence/high-390x844.png
          test -s .m07-evidence/high-864x1536.png
          test -s .m07-evidence/practical-390x844.png

      - name: Capture deterministic water motion sequence
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          # Motion proof uses the practical preset because appearance is already proven by high stills.
          # Capture attempts are individually bounded; at least two successful time-separated frames
          # are required before a video is allowed to be emitted.
          success=0
          for spec in '01 450' '02 1050' '03 1800'; do
            set -- $spec
            start=$(date +%s%3N)
            if timeout 50s "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage \
              --enable-webgl --ignore-gpu-blocklist --use-angle=swiftshader --enable-unsafe-swiftshader \
              --hide-scrollbars --window-size=390,844 --virtual-time-budget="$2" \
              --screenshot=".m07-evidence/motion-$1.png" 'http://127.0.0.1:8140/index.html?quality=practical'; then
              end=$(date +%s%3N)
              success=$((success+1))
              echo "motion frame=$1 quality=practical budget_ms=$2 wall_ms=$((end-start)) result=PASS" >> .m07-evidence/m07-performance.txt
            else
              end=$(date +%s%3N)
              echo "motion frame=$1 quality=practical budget_ms=$2 wall_ms=$((end-start)) result=TIMEOUT" >> .m07-evidence/m07-performance.txt
            fi
          done
          echo "MOTION_FRAMES_CAPTURED=$success" >> .m07-evidence/m07-performance.txt
          test "$success" -ge 2
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -y -pattern_type glob -framerate 2 -i '.m07-evidence/motion-*.png' \
            -c:v libx264 -pix_fmt yuv420p .m07-evidence/water-motion-practical.mp4 >/tmp/m07-ffmpeg.log 2>&1
          test -s .m07-evidence/water-motion-practical.mp4
          echo 'MOTION_VIDEO=PASS bounded practical-preset deterministic frame sequence' >> .m07-evidence/m07-performance.txt

      - name: Record M07 evidence manifest
        if: ${{ always() }}
        run: |
          mkdir -p .m07-evidence
          STILL_HIGH_390=$(test -s .m07-evidence/high-390x844.png && echo PASS || echo MISSING)
          STILL_HIGH_HQ=$(test -s .m07-evidence/high-864x1536.png && echo PASS || echo MISSING)
          STILL_PRACTICAL_390=$(test -s .m07-evidence/practical-390x844.png && echo PASS || echo MISSING)
          MOTION_COUNT=$(find .m07-evidence -maxdepth 1 -name 'motion-*.png' -type f 2>/dev/null | wc -l | tr -d ' ')
          MOTION_VIDEO=$(test -s .m07-evidence/water-motion-practical.mp4 && echo PASS || echo MISSING)
          cat > .m07-evidence/M07_EVIDENCE.txt <<EOF
          HEAD=${GITHUB_SHA}
          REFLECTION_METHOD=single-pass analytic wave-normal Fresnel sky reflection + directional sun specular; no planar RTT/SSR
          HIGH_PRESET=96x40 water grid; denser glints/shore treatment; shoreline rock cast shadows
          PRACTICAL_PRESET=52x20 water grid; reduced glints/shore treatment; fewer rocks; no shoreline rock cast shadows
          VIEWPORTS=390x844 high/practical; 864x1536 high
          MOTION=bounded practical-preset deterministic runtime sequence; two or more frames required; MP4 encoded with ffmpeg
          STILL_HIGH_390=${STILL_HIGH_390}
          STILL_HIGH_HQ=${STILL_HIGH_HQ}
          STILL_PRACTICAL_390=${STILL_PRACTICAL_390}
          MOTION_FRAME_COUNT=${MOTION_COUNT}
          MOTION_VIDEO=${MOTION_VIDEO}
          OWNER_EXPERIENCE_PASS=PENDING
          IOS_PHYSICAL_VERIFICATION=PENDING
          EOF
          test -f .m07-evidence/m07-performance.txt && cat .m07-evidence/m07-performance.txt >> .m07-evidence/M07_EVIDENCE.txt || true

      - name: Upload M07 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: modern-3d-m07-water-light-${{ github.sha }}
          path: |
            .m07-evidence/
            /tmp/m07-http.log
            /tmp/m07-ffmpeg.log
            assets/reference/owner_2026-09-11_ps1_visual_target/MINIMUM_QUALITY_LINE.png
            assets/reference/owner_2026-09-11_ps1_visual_target/TARGET_PS1_FINAL.png
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
