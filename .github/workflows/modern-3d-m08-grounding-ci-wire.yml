name: Modern 3D M08 Grounding CI Wire

on:
  push:
    branches: [prototype/modern-3d]
    paths:
      - '.github/workflows/modern-3d-m08-grounding-ci-wire.yml'

permissions:
  contents: write

jobs:
  wire-grounding-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 1
      - name: Add grounding samples to runtime CI
        shell: python
        run: |
          from pathlib import Path
          p=Path('prototypes/modern-3d/index.html')
          s=p.read_text()
          old1="dispatchEvent(new Event('blur'));dispatchEvent(new Event('resize'));const released=blurRelease&&activeDirs().length===0&&resizes>=2;"
          new1="dispatchEvent(new Event('blur'));dispatchEvent(new Event('resize'));const released=blurRelease&&activeDirs().length===0&&resizes>=2;const groundSamples=[playerGroundY(-1.35,-2.45),playerGroundY(-1.35,-3.05),playerGroundY(-1.35,-3.65),playerGroundY(-1.35,4.65),playerGroundY(-1.35,5.25),playerGroundY(-1.35,5.85)];const groundingSmooth=Math.abs(groundSamples[0]-.42)<.02&&groundSamples[1]>.42&&groundSamples[1]<1.04&&Math.abs(groundSamples[2]-1.04)<.02&&Math.abs(groundSamples[3]-.42)<.02&&groundSamples[4]<.42&&groundSamples[4]>-.28&&Math.abs(groundSamples[5]+.28)<.02;"
          old2="const noHole=walkable(player.position.x,player.position.z)&&walkable(-10,-12)&&walkable(-10,12),pass=crossedBridge&&blockedAtShore&&pointerMoved&&released&&noHole;"
          new2="const noHole=walkable(player.position.x,player.position.z)&&walkable(-10,-12)&&walkable(-10,12),pass=crossedBridge&&blockedAtShore&&pointerMoved&&released&&noHole&&groundingSmooth;"
          old3="document.documentElement.dataset.m02Ci='pass';document.documentElement.dataset.m03Ci=pass?'pass':'fail';document.documentElement.dataset.m05Scene=pass?'ready':'runtime-fail';document.documentElement.dataset.m05Variant='m03-composition-v29-island-corridor';"
          new3="document.documentElement.dataset.m02Ci='pass';document.documentElement.dataset.m03Ci=pass?'pass':'fail';document.documentElement.dataset.m08Ci=pass?'pass':'fail';document.documentElement.dataset.m05Scene=pass?'ready':'runtime-fail';document.documentElement.dataset.m05Variant='m03-composition-v29-island-corridor';"
          old4="window.LQ_MODERN_3D_M05.ci={crossedBridge,blockedAtShore,pointerMoved,released,noHole,route:routeText,pass};"
          new4="window.LQ_MODERN_3D_M05.ci={crossedBridge,blockedAtShore,pointerMoved,released,noHole,groundingSmooth,groundSamples:groundSamples.map(v=>+v.toFixed(3)),route:routeText,pass};"
          for old,new,label in [(old1,new1,'samples'),(old2,new2,'pass'),(old3,new3,'dataset'),(old4,new4,'object')]:
              count=s.count(old)
              if count!=1: raise SystemExit(f'{label}: expected 1 match, found {count}')
              s=s.replace(old,new)
          p.write_text(s)
      - name: Verify exact evidence wiring
        run: |
          git diff --check
          grep -F "dataset.m08Ci=pass?'pass':'fail'" prototypes/modern-3d/index.html
          grep -F 'groundingSmooth' prototypes/modern-3d/index.html
          grep -F 'groundSamples:groundSamples.map' prototypes/modern-3d/index.html
          git diff -- prototypes/modern-3d/index.html
      - name: Commit M08 grounding evidence wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototypes/modern-3d/index.html
          git diff --cached --quiet && exit 1
          git commit -m 'test(modern-3d): expose M08 grounding samples in runtime CI'
          git push origin HEAD:prototype/modern-3d
