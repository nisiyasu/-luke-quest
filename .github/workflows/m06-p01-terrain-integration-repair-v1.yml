name: M06-P01 Terrain Integration Repair v1

on:
  push:
    branches: ["prototype/modern-3d"]
    paths:
      - ".ci/m06-p01-terrain-integration-v1.txt"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 0

      - name: Replace only near-field terrain mass generator
        shell: python
        run: |
          from pathlib import Path
          path=Path('prototypes/modern-3d/index.html')
          text=path.read_text(encoding='utf-8')
          old="""function nearFieldMass(x,z,radius,height,ry=0){
  const geo=new THREE.CylinderGeometry(radius*.84,radius,height,7,1,false);
  const mesh=new THREE.Mesh(geo,[nearMassSideMat,nearMassTopMat,nearMassSideMat]);
  mesh.position.set(x,-.28+height/2,z);
  mesh.rotation.y=ry;
  mesh.receiveShadow=true;
  mesh.castShadow=true;
  scene.add(mesh);
  return mesh
}"""
          new="""function nearFieldMass(x,z,radius,height,ry=0){
  // M06-P01 v1: preserve the proven footprint while removing the regular heptagonal slab read.
  // Deterministic multi-frequency perimeter breakup keeps every run stable for screenshot comparison.
  const segments=18;
  const geo=new THREE.CylinderGeometry(radius*.88,radius,height,segments,2,false);
  const pos=geo.attributes.position;
  const phase=x*.173+z*.119+radius*.311;
  for(let i=0;i<pos.count;i++){
    const px=pos.getX(i),py=pos.getY(i),pz=pos.getZ(i);
    const a=Math.atan2(pz,px);
    const radial=1+.055*Math.sin(a*3+phase)+.028*Math.sin(a*7-phase*.63)+.016*Math.sin(a*11+phase*.37);
    const yNorm=(py/Math.max(height,.001))+.5;
    const edgeBias=.96+.04*Math.sin(Math.PI*Math.max(0,Math.min(1,yNorm)));
    const crown=(yNorm>.80?(.035+.018*Math.sin(a*4+phase))*radius:0);
    pos.setXYZ(i,px*radial*edgeBias,py+crown,pz*radial*edgeBias);
  }
  pos.needsUpdate=true;
  geo.computeVertexNormals();
  const mesh=new THREE.Mesh(geo,[nearMassSideMat,nearMassTopMat,nearMassSideMat]);
  mesh.position.set(x,-.30+height/2,z);
  mesh.rotation.y=ry;
  mesh.receiveShadow=true;
  mesh.castShadow=true;
  scene.add(mesh);
  return mesh
}"""
          count=text.count(old)
          if count != 1:
            raise SystemExit(f'FAIL_CLOSED nearFieldMass match count={count}')
          path.write_text(text.replace(old,new,1),encoding='utf-8')

      - name: Validate bounded diff
        run: |
          git diff --check
          grep -F "M06-P01 v1: preserve the proven footprint" prototypes/modern-3d/index.html
          grep -F "const segments=18;" prototypes/modern-3d/index.html
          if git diff --name-only | grep -v '^prototypes/modern-3d/index.html$'; then
            echo 'unexpected changed file'; exit 1
          fi

      - name: Commit exact repair
        run: |
          if git diff --quiet; then echo 'no diff'; exit 1; fi
          git config user.name 'LUKE QUEST Autonomous Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add prototypes/modern-3d/index.html
          git commit -m 'fix(m06-p01): integrate organic near-field terrain masses'
          git push origin HEAD:prototype/modern-3d
