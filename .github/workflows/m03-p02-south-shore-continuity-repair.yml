name: M03-P02 South Shore Continuity Repair

on:
  push:
    branches: ["prototype/modern-3d"]
    paths:
      - ".github/workflows/m03-p02-south-shore-continuity-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 1
      - name: Extend south water envelope beyond follow-camera view
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prototypes/modern-3d/index.html')
          s=p.read_text()
          old="const waterLower=createTargetWaterV3({width:8.6,depth:28.5,seed:317});waterLower.position.set(-4.65,.04,13.6);waterLower.rotation.y=.08;scene.add(waterLower);"
          new="const waterLower=createTargetWaterV3({width:14.8,depth:38.5,seed:317});waterLower.position.set(-4.65,.04,18.6);waterLower.rotation.y=.08;scene.add(waterLower);"
          if new in s:
              raise SystemExit('v64 downstream water envelope already present')
          if old not in s:
              raise SystemExit('expected v63 waterLower anchor not found exactly')
          s=s.replace(old,new,1)
          marker='// v63 M03-P02: continue the south receiving terrain beyond the bridge approach so the lower camera cannot expose a flat rectangular underlay/world-hole edge beside the downstream river.'
          if marker not in s:
              raise SystemExit('v63 receiving-terrain repair missing; refuse unsafe patch')
          s=s.replace(marker, marker+'\n// v64 M03-P02: widen/deepen the downstream water envelope so its finite rectangular mesh boundary stays outside the south endpoint follow-camera view while preserving bridge/camera composition.',1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- prototypes/modern-3d/index.html
      - name: Commit bounded runtime repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototypes/modern-3d/index.html
          git commit -m "fix(m03-p02): widen downstream water envelope"
          git push origin HEAD:prototype/modern-3d
