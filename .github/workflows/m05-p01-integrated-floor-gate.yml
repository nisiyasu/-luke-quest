# fresh exact-head revalidation trigger: 2026-09-13 after M04-P03
name: M05-P01 Integrated Minimum Floor Gate

on:
  push:
    branches: ["prototype/modern-3d"]
    paths:
      - ".github/workflows/m05-p01-integrated-floor-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start exact-head runtime
        run: |
          python3 -m http.server 8140 --directory prototypes/modern-3d >/tmp/m05-p01-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8140/index.html >/dev/null
      - name: Capture exact-head frame and prove movement
        run: |
          mkdir -p .m05-p01
          cat > m05-p01.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          function parsePos(s){return String(s||'').split(',').map(Number)}
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            try{
              await page.goto('http://127.0.0.1:8140/index.html?quality=high',{waitUntil:'domcontentloaded',timeout:150000});
              await page.waitForFunction(()=>document.documentElement.dataset.lqModern3d==='m05-ready'&&document.documentElement.dataset.m09OwnerHud==='pass'&&document.documentElement.dataset.m08Player,{timeout:150000});
              await page.waitForTimeout(1200);
              if(errors.length)throw new Error(`page errors=${JSON.stringify(errors)}`);
              const before=await page.evaluate(()=>({player:document.documentElement.dataset.m08Player,scene:document.documentElement.dataset.lqModern3d,camera:document.documentElement.dataset.m03CameraProfile||'UNKNOWN'}));
              await page.screenshot({path:'.m05-p01/current-exact-head.png',fullPage:true,timeout:150000});
              let after=null,moved=false,used='';
              for(const key of ['ArrowUp','ArrowLeft','ArrowRight','ArrowDown']){
                await page.keyboard.down(key);await page.waitForTimeout(700);await page.keyboard.up(key);await page.waitForTimeout(150);
                after=await page.evaluate(()=>({player:document.documentElement.dataset.m08Player}));
                const a=parsePos(before.player),b=parsePos(after.player);
                if(a.length>=3&&b.length>=3&&a.every(Number.isFinite)&&b.every(Number.isFinite)&&Math.hypot(b[0]-a[0],b[2]-a[2])>.05){moved=true;used=key;break}
              }
              if(!moved)throw new Error(`movement regression: before=${before.player} after=${after&&after.player}`);
              fs.writeFileSync('.m05-p01/runtime-audit.txt',[`scene=${before.scene}`,`camera=${before.camera}`,`player_before=${before.player}`,`player_after=${after.player}`,`movement_key=${used}`,`movement=PASS`,`page_errors=0`,`head=${process.env.GITHUB_SHA||'UNKNOWN'}`].join('\n')+'\n');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node m05-p01.cjs
      - name: Add visual authorities
        if: always()
        run: |
          curl -L --fail --retry 3 -o .m05-p01/MINIMUM_QUALITY_LINE.png https://raw.githubusercontent.com/nisiyasu/-luke-quest/eb6ec9fafc053b6dbabb6ee473932b7c7851ebc6/assets/reference/owner_2026-09-11_ps1_visual_target/MINIMUM_QUALITY_LINE.png
          curl -L --fail --retry 3 -o .m05-p01/TARGET_PS1_FINAL.png https://raw.githubusercontent.com/nisiyasu/-luke-quest/eb6ec9fafc053b6dbabb6ee473932b7c7851ebc6/assets/reference/owner_2026-09-11_ps1_visual_target/TARGET_PS1_FINAL.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m05-p01-integrated-floor-gate
          path: .m05-p01
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
