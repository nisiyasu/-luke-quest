name: One-shot REQ-135 Queue Sync

on:
  push:
    paths:
      - '.github/workflows/queue-sync-req135-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert REQ-135 queue row and self-remove
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('WORK_QUEUE.md')
          text=p.read_text()
          row="| 117 | REQ-135 | P1 | VERIFY | iPhone Battle Command Touch Feedback | `requirements/REQ-135_IPHONE_BATTLE_COMMAND_FEEDBACK.md` | Presentation-only active/focus/disabled feedback on existing REQ-134 battle command targets. Dedicated run 34195389737 SUCCESS and exact-HEAD Pages run 34195389767 SUCCESS on `dcaee504...`; embedded REQ-134 regression PASS; no duplicate battle handlers. IOS_PHYSICAL_VERIFICATION=PENDING. |\n"
          if 'REQ-135 | P1 |' not in text:
              marker='\n## STATUS DEFINITIONS\n'
              if text.count(marker)!=1:
                  raise SystemExit('WORK_QUEUE marker mismatch')
              text=text.replace(marker,'\n'+row+marker,1)
              p.write_text(text)
          PY
          rm -f .github/workflows/queue-sync-req135-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WORK_QUEUE.md .github/workflows/queue-sync-req135-once.yml
          if git diff --cached --quiet; then
            echo 'No queue mutation needed.'
            exit 0
          fi
          git commit -m 'meta: sync REQ-135 queue inventory'
          git push origin HEAD:main
