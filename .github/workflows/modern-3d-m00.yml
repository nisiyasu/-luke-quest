name: Modern 3D M02 Runtime Gate

on:
  push:
    branches: ["prototype/modern-3d"]
    paths:
      - "prototypes/modern-3d/**"
      - ".github/workflows/modern-3d-m00.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modern-3d-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-webgl-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned Three.js resource
        shell: bash
        run: |
          curl -fLsS --retry 3 'https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js' -o /tmp/three.module.js
          test -s /tmp/three.module.js
          grep -q 'REVISION' /tmp/three.module.js
      - name: Start isolated server
        shell: bash
        run: |
          python3 -m http.server 8140 --directory prototypes/modern-3d >/tmp/modern3d-http.log 2>&1 &
          sleep 1
          curl -fsS http://127.0.0.1:8140/index.html >/dev/null
      - name: Prove WebGL movement input release and redisplay
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$BROWSER"
          mkdir -p .modern3d
          "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-webgl --ignore-gpu-blocklist --use-angle=swiftshader \
            --virtual-time-budget=7000 --dump-dom \
            'http://127.0.0.1:8140/index.html?ci=1' > .modern3d/m02-dom.html
          grep -q 'data-lq-modern3d="m02-ready"' .modern3d/m02-dom.html
          grep -q 'data-three-revision="186"' .modern3d/m02-dom.html
          grep -q 'data-m02-ci="pass"' .modern3d/m02-dom.html
          ! grep -q 'data-lq-modern3d="m02-error"' .modern3d/m02-dom.html
      - name: Capture M02 portrait evidence
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-webgl --ignore-gpu-blocklist --use-angle=swiftshader \
            --window-size=390,844 --force-device-scale-factor=1 \
            --virtual-time-budget=7000 \
            --screenshot=.modern3d/m02-390x844.png \
            'http://127.0.0.1:8140/index.html?ci=1'
          test -s .modern3d/m02-390x844.png
          test "$(stat -c %s .modern3d/m02-390x844.png)" -gt 10000
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path('.modern3d/m02-390x844.png').read_bytes()
          assert p[:8]==b'\x89PNG\r\n\x1a\n'
          w,h=struct.unpack('>II',p[16:24])
          assert w==390 and h>=800,(w,h)
          print(f'M02_PNG={w}x{h}')
          PY
      - name: Record runtime evidence
        shell: bash
        run: |
          {
            echo '## Modern 3D M02 runtime gate'
            echo "- source SHA: $GITHUB_SHA"
            echo '- Three.js 0.186.0 / revision 186: PASS'
            echo '- browser/WebGL: PASS'
            echo '- keyboard movement: PASS'
            echo '- pointer/touch-path movement: PASS'
            echo '- blur input release: PASS'
            echo '- resize/redisplay handler: PASS'
            echo '- 390x844 frame: PASS'
            echo '- art-quality target: NOT inferred'
            echo '- physical iPhone: PENDING'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: modern-3d-m02-${{ github.sha }}
          path: |
            .modern3d/m02-dom.html
            .modern3d/m02-390x844.png
            prototypes/modern-3d/index.html
            prototypes/modern-3d/M01_ART_DIRECTION_AND_COMPARISON_CONTRACT.md
          retention-days: 14
