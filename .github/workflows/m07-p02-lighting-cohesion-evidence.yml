name: M07-P02 Lighting Cohesion Evidence

on:
  push:
    branches: ["prototype/modern-3d"]
    paths:
      - ".github/workflows/m07-p02-lighting-cohesion-evidence.yml"

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start runtime
        run: |
          python3 -m http.server 8140 --directory prototypes/modern-3d >/tmp/m07p02-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8140/index.html >/dev/null
      - name: Capture HQ practical and moved-position actual runtime
        run: |
          set -euo pipefail
          mkdir -p .m07p02-evidence
          cat > m07p02-proof.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
            const rows=[];
            async function ready(quality,viewport,label){
              const page=await browser.newPage({viewport,deviceScaleFactor:1});
              const errors=[]; page.on('pageerror',e=>errors.push(String(e))); page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              const t0=Date.now();
              await page.goto(`http://127.0.0.1:8140/index.html?quality=${quality}`,{waitUntil:'domcontentloaded',timeout:120000});
              await page.waitForFunction(()=>document.documentElement.dataset.lqModern3d==='m05-ready',{timeout:120000});
              await page.waitForFunction(()=>document.documentElement.dataset.m07Lighting==='cohesion-v1',{timeout:120000});
              await page.waitForTimeout(1200);
              if(errors.length) throw new Error(`${label} runtime errors: ${errors.join(' | ')}`);
              rows.push(`${label} ready_ms=${Date.now()-t0}`);
              return page;
            }
            async function shot(page,name){
              const path=`.m07p02-evidence/${name}.png`; const t=Date.now();
              await page.screenshot({path,fullPage:true,timeout:120000});
              if(!fs.existsSync(path)||fs.statSync(path).size<10000) throw new Error(`bad screenshot ${name}`);
              rows.push(`${name} screenshot_ms=${Date.now()-t} bytes=${fs.statSync(path).size}`);
            }
            try{
              let p=await ready('high',{width:390,height:844},'high-portrait'); await shot(p,'high-portrait');
              await p.keyboard.down('ArrowUp'); await p.waitForTimeout(1400); await p.keyboard.up('ArrowUp'); await p.waitForTimeout(800); await shot(p,'high-moved'); await p.close();
              p=await ready('practical',{width:390,height:844},'practical-portrait'); await shot(p,'practical-portrait'); await p.close();
              p=await ready('high',{width:844,height:390},'high-landscape'); await shot(p,'high-landscape'); await p.close();
              fs.writeFileSync('.m07p02-evidence/performance.txt',rows.join('\n')+'\n');
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node m07p02-proof.cjs
          test -s .m07p02-evidence/high-portrait.png
          test -s .m07p02-evidence/high-moved.png
          test -s .m07p02-evidence/practical-portrait.png
          test -s .m07p02-evidence/high-landscape.png
      - name: Record exact-head manifest
        if: ${{ always() }}
        run: |
          mkdir -p .m07p02-evidence
          cat > .m07p02-evidence/M07_P02_EVIDENCE.txt <<EOF
          HEAD=${GITHUB_SHA}
          PACKET=M07-P02
          LIGHTING_PROFILE=cohesion-v1
          HQ_SCREENSHOT=$(test -s .m07p02-evidence/high-portrait.png && echo PASS || echo MISSING)
          PRACTICAL_SCREENSHOT=$(test -s .m07p02-evidence/practical-portrait.png && echo PASS || echo MISSING)
          MOVED_POSITION=$(test -s .m07p02-evidence/high-moved.png && echo PASS || echo MISSING)
          LANDSCAPE=$(test -s .m07p02-evidence/high-landscape.png && echo PASS || echo MISSING)
          PHYSICAL_IPHONE=PENDING
          EOF
          test -f .m07p02-evidence/performance.txt && cat .m07p02-evidence/performance.txt >> .m07p02-evidence/M07_P02_EVIDENCE.txt || true
      - name: Upload lighting evidence and references
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: m07-p02-lighting-cohesion-${{ github.sha }}
          path: |
            .m07p02-evidence/
            /tmp/m07p02-http.log
            assets/reference/owner_2026-09-11_ps1_visual_target/MINIMUM_QUALITY_LINE.png
            assets/reference/owner_2026-09-11_ps1_visual_target/TARGET_PS1_FINAL.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14