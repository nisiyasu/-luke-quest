name: M03 P01 v76 coordinated world massing repair

on:
  push:
    branches: [prototype/modern-3d]
    paths:
      - '.github/workflows/m03-p01-v76-world-massing.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 0
      - name: Apply coordinated macro world-layout repair
        shell: python
        run: |
          from pathlib import Path
          p=Path('prototypes/modern-3d/index.html')
          s=p.read_text()
          replacements={
            "<title>LUKE QUEST Modern 3D — M03 Composition Rebuild v75</title>":"<title>LUKE QUEST Modern 3D — M03 Composition Rebuild v76</title>",
            "const waterMain=createTargetWaterV3({width:30,depth:6.2,seed:311});waterMain.position.set(-1.0,.02,1.0);scene.add(waterMain);":"const waterMain=createTargetWaterV3({width:25.2,depth:5.25,seed:311});waterMain.position.set(-.55,.02,.72);waterMain.rotation.y=-.06;scene.add(waterMain);",
            "const bridgeRight=bridgeAt(4.35,-5.25,1.14,false);bridgeRight.position.y=.82;bridgeRight.scale.z=.78;":"const bridgeRight=bridgeAt(5.35,-6.55,.92,false);bridgeRight.position.y=.82;bridgeRight.rotation.y=-.16;bridgeRight.scale.set(.88,1,.66);",
            "terrainPathRibbon([[-1.35,-4.45],[-.95,-5.15],[-.48,-5.95],[-.62,-6.90],[-1.12,-8.05],[-1.72,-9.55],[-2.28,-11.15],[-2.82,-12.85],[-3.30,-14.45]],.66,.055);":"terrainPathRibbon([[-1.35,-4.45],[-1.05,-5.15],[-.70,-5.95],[-.52,-6.85],[-.58,-7.95],[-.82,-9.20],[-1.05,-10.55],[-1.15,-12.10],[-1.05,-13.85]],1.02,.055);",
            "terrainPathRibbon([[-.52,-5.92],[.20,-6.02],[.82,-6.15],[1.38,-6.30],[1.82,-6.48]],.44,.06);":"terrainPathRibbon([[-.42,-6.10],[.35,-6.38],[1.15,-6.70],[2.10,-7.00],[3.05,-7.20],[3.95,-7.12]],.52,.06);"
          }
          for old,new in replacements.items():
            count=s.count(old)
            if count!=1:
              raise SystemExit(f'expected exactly one match, got {count}: {old[:90]}')
            s=s.replace(old,new)
          marker="document.documentElement.dataset.m03WorldMassing='v76-lower-entry-open-corridor';\n"
          anchor="const meadowA=createMeadowField"
          if marker not in s:
            if anchor not in s: raise SystemExit('marker anchor missing')
            s=s.replace(anchor,marker+anchor,1)
          p.write_text(s)
      - name: Verify bounded changes
        run: |
          grep -F "M03 Composition Rebuild v76" prototypes/modern-3d/index.html
          grep -F "v76-lower-entry-open-corridor" prototypes/modern-3d/index.html
          grep -F "width:25.2,depth:5.25" prototypes/modern-3d/index.html
          grep -F "bridgeAt(5.35,-6.55,.92,false)" prototypes/modern-3d/index.html
      - name: Commit product repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prototypes/modern-3d/index.html
          git commit -m "fix(m03-p01): reshape route river and secondary crossing v76"
          git push origin HEAD:prototype/modern-3d
