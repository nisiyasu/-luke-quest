name: LUKE QUEST Environment Visual Evidence Production

run-name: LQ Env Evidence ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Immutable evidence capture request ID
        required: true
        type: string
      lane_id:
        description: Environment lane
        required: true
        type: choice
        options:
          - village
          - castle
          - dungeon
      implementation_sha:
        description: Exact implementation commit SHA to capture
        required: true
        type: string
      child_issue:
        description: Current child Issue number
        required: true
        type: number

permissions:
  contents: read
  issues: read

jobs:
  capture:
    uses: ./.github/workflows/environment-visual-evidence-common-v2.yml
    with:
      lane_id: ${{ inputs.lane_id }}
      implementation_ref: ${{ inputs.implementation_sha }}
      runtime_dir: ${{ inputs.lane_id == 'dungeon' && '.' || 'prototypes/modern-3d' }}
      page_path: ${{ inputs.lane_id == 'village' && 'village-g0.html' || inputs.lane_id == 'castle' && 'castle-g0.html' || 'dungeon-g0.html' }}
      target_source_commit: 0d225f77944eb54eed648b76f00869879f4284ff
      target_path: ${{ inputs.lane_id == 'village' && 'references/target-quality/environments/VILLAGE_TARGET_OWNER_20260914.png' || inputs.lane_id == 'castle' && 'references/target-quality/environments/CASTLE_INTERIOR_TARGET_OWNER_20260914.png' || 'references/target-quality/environments/DUNGEON_TARGET_OWNER_20260914.png' }}
      target_blob_sha: ${{ inputs.lane_id == 'village' && 'e6536371eddcc7fb5cf5803568216f008011a5f1' || inputs.lane_id == 'castle' && '573c13225471820d063043a37e3ee26fad389d63' || '198d0f5f3da115b70218ae8180d5f8363d744959' }}
      parent_issue: ${{ inputs.lane_id == 'village' && 51 || inputs.lane_id == 'castle' && 52 || 53 }}
      child_issue: ${{ inputs.child_issue }}
      ready_mode: ${{ inputs.lane_id == 'dungeon' && 'load' || 'visual-ready' }}
      artifact_name: lq-env-evidence-${{ inputs.request_id }}
      viewport_width: 941
      viewport_height: 1672
      common_workflow_path: .github/workflows/environment-visual-evidence-common-v2.yml
      common_workflow_commit_sha: c82e0ba6e940af3b94660cf8ad6abca7e14da75b
      common_workflow_blob_sha: 182e13ff2e2df5b48fd5196126b4b31103b405bb
