name: LUKE QUEST Environment Visual Evidence Production

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  issues: read
  actions: read

concurrency:
  group: lq-env-evidence-capture-poller
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
      count: ${{ steps.scan.outputs.count }}
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Clone request channel snapshot
        run: |
          git clone --depth 1 https://github.com/nisiyasu/luke-env-gateway-requests.git "$RUNNER_TEMP/lq-env-requests"
          git -C "$RUNNER_TEMP/lq-env-requests" rev-parse HEAD

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan eligible evidence capture requests
        id: scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LQ_ENV_REQUEST_CHECKOUT: ${{ runner.temp }}/lq-env-requests
        run: python tools/env_visual_gateway/evidence_capture_request_scanner.py

  capture:
    needs: scan
    if: ${{ needs.scan.outputs.count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.scan.outputs.matrix) }}
    uses: ./.github/workflows/environment-visual-evidence-common-v2.yml
    with:
      lane_id: ${{ matrix.lane_id }}
      implementation_ref: ${{ matrix.implementation_sha }}
      runtime_dir: ${{ matrix.runtime_dir }}
      page_path: ${{ matrix.page_path }}
      target_source_commit: ${{ matrix.target_source_commit }}
      target_path: ${{ matrix.target_path }}
      target_blob_sha: ${{ matrix.target_blob_sha }}
      parent_issue: ${{ matrix.parent_issue }}
      child_issue: ${{ matrix.child_issue }}
      ready_mode: ${{ matrix.ready_mode }}
      artifact_name: ${{ matrix.artifact_name }}
      viewport_width: 941
      viewport_height: 1672
      common_workflow_path: .github/workflows/environment-visual-evidence-common-v2.yml
      common_workflow_commit_sha: c82e0ba6e940af3b94660cf8ad6abca7e14da75b
      common_workflow_blob_sha: 182e13ff2e2df5b48fd5196126b4b31103b405bb
