name: M09-P02 Remove Fake HP

on:
  push:
    branches: ["prototype/modern-3d"]
    paths:
      - ".github/workflows/m09-p02-remove-fake-hp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 0
      - name: Trace fake HP generator across runtime source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          tokens=['hud-hp-row','hud-hp-track','FOREST BRIDGE','NEXT AREA','MONSTER FOREST']
          hits=0
          for p in Path('prototypes/modern-3d').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.html','.js','.mjs','.css','.json'}: continue
              try: s=p.read_text()
              except Exception: continue
              matched=[t for t in tokens if t in s]
              if matched:
                  hits+=1
                  print('FILE',p,'TOKENS',matched)
                  for t in matched:
                      start=0
                      while True:
                          i=s.find(t,start)
                          if i<0: break
                          print('CONTEXT',t,repr(s[max(0,i-220):i+420]))
                          start=i+1
          if not hits:
              raise SystemExit('FAIL_CLOSED: no HUD generator source found')
          PY