name: M09-P02 Remove Fake HP

on:
  push:
    branches: ["prototype/modern-3d"]
    paths:
      - ".github/workflows/m09-p02-remove-fake-hp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 0
      - name: Inspect exact fake HP source construction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('prototypes/modern-3d/index.html').read_text()
          for token in ['hud-hp-row','hud-hp-track','HP']:
              hits=[]; start=0
              while True:
                  i=s.find(token,start)
                  if i<0: break
                  hits.append(i); start=i+1
              print('TOKEN',token,'COUNT',len(hits),'OFFSETS',hits[:20])
              for i in hits[:8]: print('CONTEXT',repr(s[max(0,i-240):i+360]))
          if 'hud-hp-row' not in s:
              raise SystemExit('FAIL_CLOSED: live HUD HP class not found in source')
          PY