name: Modern 3D M08 Idle Motion Fix

on:
  push:
    branches: [prototype/modern-3d]
    paths:
      - '.github/workflows/modern-3d-m08-idle-fix.yml'

permissions:
  contents: write

jobs:
  patch-m08-idle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 1
      - name: Patch exact idle motion call
        shell: python
        run: |
          from pathlib import Path
          p = Path('prototypes/modern-3d/index.html')
          s = p.read_text()
          old = 'player.userData.animate(sec,moving?1:.12)'
          new = 'player.userData.animate(sec,moving?1:0)'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one idle-motion call, found {count}')
          p.write_text(s.replace(old, new))
      - name: Verify patch scope
        run: |
          git diff --check
          git diff -- prototypes/modern-3d/index.html
          grep -F 'player.userData.animate(sec,moving?1:0)' prototypes/modern-3d/index.html
          if grep -F 'player.userData.animate(sec,moving?1:.12)' prototypes/modern-3d/index.html; then exit 1; fi
      - name: Commit exact M08 fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototypes/modern-3d/index.html
          git diff --cached --quiet && exit 1
          git commit -m 'fix(modern-3d): stop walk cycle while Luke is idle'
          git push origin HEAD:prototype/modern-3d
