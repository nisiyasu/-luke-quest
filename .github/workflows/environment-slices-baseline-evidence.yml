name: Environment Slices Baseline Evidence

on:
  push:
    branches: ["experiment/environment-vertical-slices"]
    paths:
      - "prototypes/environment-slices/**"
      - ".github/workflows/environment-slices-baseline-evidence.yml"
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Start exact-head runtime
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/env-slices-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/prototypes/environment-slices/castle/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/env-slices-http.log
          exit 1
      - name: Capture three environment baselines
        run: |
          cat > /tmp/capture.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:900}, deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror', e=>errors.push(String(e)));
            page.on('console', m=>{ if(m.type()==='error') errors.push('console:'+m.text()); });
            fs.mkdirSync('evidence/environment-slices',{recursive:true});
            const cases=[['castle','castle-baseline-v1'],['town','town-baseline-v1'],['dungeon','dungeon-baseline-v1']];
            const audit=[];
            for(const [name, marker] of cases){
              await page.goto(`http://127.0.0.1:4173/prototypes/environment-slices/${name}/`,{waitUntil:'networkidle',timeout:60000});
              await page.waitForFunction(m=>document.body.dataset.ready===m, marker,{timeout:30000});
              await page.waitForTimeout(1200);
              const info=await page.evaluate(()=>({ready:document.body.dataset.ready,canvas:[document.querySelector('canvas')?.width,document.querySelector('canvas')?.height],title:document.querySelector('#title')?.textContent}));
              audit.push(`${name}: ${JSON.stringify(info)}`);
              await page.screenshot({path:`evidence/environment-slices/${name}-current.png`,fullPage:true});
            }
            audit.push(`head=${process.env.GITHUB_SHA}`);
            audit.push(`page_errors=${errors.length}`);
            if(errors.length) audit.push(...errors);
            fs.writeFileSync('evidence/environment-slices/audit.txt',audit.join('\n')+'\n');
            await browser.close();
            if(errors.length) process.exit(1);
          })();
          NODE
          node /tmp/capture.cjs
      - name: Upload baseline evidence
        uses: actions/upload-artifact@v4
        with:
          name: environment-slices-baseline-evidence
          path: evidence/environment-slices/
          if-no-files-found: error
