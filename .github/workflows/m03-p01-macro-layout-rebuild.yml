name: M03-P01 Macro Layout Rebuild Verification

on:
  push:
    branches: [prototype/modern-3d]
    paths:
      - '.github/workflows/m03-p01-macro-layout-rebuild.yml'

permissions:
  contents: read

jobs:
  verify-v68:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
      - name: Verify grounded-route repair already landed
        shell: bash
        run: |
          set -euo pipefail
          grep -q "M03 Composition Rebuild v68" prototypes/modern-3d/index.html
          grep -q "function terrainPathRibbon" prototypes/modern-3d/index.html
          grep -q "main-plus-diagonal-target-crossing-v4-grounded-route" prototypes/modern-3d/index.html
