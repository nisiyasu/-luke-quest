name: M03-P01 Macro Layout Rebuild

on:
  push:
    branches: [prototype/modern-3d]
    paths:
      - '.github/workflows/m03-p01-macro-layout-rebuild.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 0
      - name: Rebuild secondary crossing river and route as one macro unit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prototypes/modern-3d/index.html')
          s=p.read_text()
          old="const waterUpperRight=createTargetWaterV3({width:8.2,depth:22.0,seed:331});waterUpperRight.position.set(5.25,.05,-9.0);waterUpperRight.rotation.y=-.34;scene.add(waterUpperRight);"
          new="const waterUpperRight=createTargetWaterV3({width:8.6,depth:19.0,seed:331});waterUpperRight.position.set(5.15,.05,-6.35);waterUpperRight.rotation.y=-.38;scene.add(waterUpperRight);"
          if old not in s: raise SystemExit('upper river v66 anchor not found')
          s=s.replace(old,new,1)
          old="const bridgeRight=bridgeAt(4.35,-8.65,Math.PI/2-.48,false);bridgeRight.position.y=.82;\nbank(880,2.15,2.20,-1.05,1.02,-10.25,1,.18);bank(887,2.15,2.20,9.15,1.05,-6.05,1,-.18);"
          new="const bridgeRight=bridgeAt(4.05,-5.95,Math.PI/2-.58,false);bridgeRight.position.y=.82;\nbank(880,2.20,2.25,-1.10,1.02,-7.85,1,.20);bank(887,2.20,2.25,9.05,1.05,-3.85,1,-.20);"
          if old not in s: raise SystemExit('secondary bridge v66 anchor not found')
          s=s.replace(old,new,1)
          old="pathRibbon([[-4.95,-9.2],[-3.7,-10.1],[-2.15,-10.85],[-.55,-11.15],[1.15,-10.65],[2.55,-9.75],[3.55,-8.95]],.72,2.28);"
          new="pathRibbon([[-4.95,-9.2],[-3.65,-8.75],[-2.25,-8.15],[-.75,-7.45],[.85,-6.85],[2.35,-6.35],[3.45,-6.0]],.72,2.28);"
          if old not in s: raise SystemExit('north route v66 anchor not found')
          s=s.replace(old,new,1)
          s=s.replace('M03 Composition Rebuild v66','M03 Composition Rebuild v67',1)
          s=s.replace("bridgeLayout:'main-plus-diagonal-target-crossing-v2'","bridgeLayout:'main-plus-diagonal-target-crossing-v3-midground'",1)
          p.write_text(s)
          PY
          git diff --check
          grep -q "bridgeAt(4.05,-5.95,Math.PI/2-.58,false)" prototypes/modern-3d/index.html
          grep -q "main-plus-diagonal-target-crossing-v3-midground" prototypes/modern-3d/index.html
      - name: Commit bounded macro rebuild
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "lq-scheduled-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prototypes/modern-3d/index.html
          git commit -m "fix(m03-p01): lower secondary crossing into target midground"
          git push origin HEAD:prototype/modern-3d
