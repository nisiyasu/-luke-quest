name: REQ-144 Queue Registration Sync

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/req144-queue-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Register REQ-144 and CURRENT active checkpoint
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          q=Path('WORK_QUEUE.md')
          text=q.read_text()
          row='| 126 | REQ-144 | P1 | IN_PROGRESS | Original Generic Field NPC Art | `requirements/REQ-144_ORIGINAL_GENERIC_FIELD_NPC_ART.md` | Fresh audit proved canonical generic human NPC emoji remain visible through the grounding body layer. Replace only scoped generic people with lightweight original repository SVG art; no protected-character canon, input, save or story authority change. |\n\n'
          if 'REQ-144 |' not in text:
              marker='## STATUS DEFINITIONS'
              if text.count(marker)!=1: raise SystemExit('WORK_QUEUE status marker mismatch')
              text=text.replace(marker,row+marker,1)
              q.write_text(text)

          c=Path('CURRENT.md')
          text=c.read_text()
          replacements={
            '- ACTIVE_REQUIREMENT_ID: `NONE`':'- ACTIVE_REQUIREMENT_ID: `REQ-144`',
            '- ACTIVE_REQUIREMENT_PATH: `NONE`':'- ACTIVE_REQUIREMENT_PATH: `requirements/REQ-144_ORIGINAL_GENERIC_FIELD_NPC_ART.md`',
            '- CONTINUE_GATE_LAST_RESULT: `CONTINUE — public Chapter 1 quality-gap audit remains safe and executable after metadata repair.`':'- CONTINUE_GATE_LAST_RESULT: `CONTINUE — REQ-144 is an evidenced Q2 player-visible gap and is safe to implement under WIP=1.`'
          }
          for old,new in replacements.items():
              if old in text: text=text.replace(old,new,1)
          if '## REQ-144 ORIGINAL GENERIC FIELD NPC ART' not in text:
              insert='''\n## REQ-144 ORIGINAL GENERIC FIELD NPC ART\n\n- STATUS: `IN_PROGRESS`\n- QUALITY_LEVEL: `Q2`\n- EVIDENCE: `Canonical generic person emoji remain visible after world-character-grounding because that layer wraps existing glyph nodes rather than replacing them.`\n- SCOPE: `Generic elder / merchant / acolyte / farmer / observation watch only. Protected named-character identity excluded.`\n- ART_STATUS: `INTERIM_ORIGINAL_SVG / NOT_FORMAL_CHARACTER_CANON`\n- INPUT_AUTHORITY_CHANGE: `NONE`\n- SAVE_SCHEMA_CHANGE: `NONE`\n- STORY_CHANGE: `NONE`\n- IOS_PHYSICAL_VERIFICATION: `PENDING`\n'''
              marker='\n## P0 INPUT / FULLSCREEN PROTECTION'
              if marker not in text: raise SystemExit('CURRENT insertion marker missing')
              text=text.replace(marker,insert+marker,1)
          c.write_text(text)
          PY
      - name: Commit sync if needed
        shell: bash
        run: |
          if git diff --quiet -- WORK_QUEUE.md CURRENT.md; then
            echo 'REQ-144 already registered'
            exit 0
          fi
          git config user.name 'luke-quest-autonomous'
          git config user.email 'luke-quest-autonomous@users.noreply.github.com'
          git add WORK_QUEUE.md CURRENT.md
          git commit -m 'REQ-144: register active queue checkpoint'
          git push origin HEAD:main
