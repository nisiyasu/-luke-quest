name: M04 Organic Terrain Forest Repair v63

on:
  push:
    branches: ["prototype/modern-3d"]
    paths:
      - ".github/workflows/m04-v63-organic-assets.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 0
      - name: Repair bank silhouette and forest family
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          bank=Path('prototypes/modern-3d/m04-bank-target-v4.js')
          s=bank.read_text()
          replacement=(
          "function makeOrganicTop(r,seed,width,depth,facing){\n"
          "  // v4.6 Owner re-gate: all four terrain edges meander; denser relief removes rectangular slab reads.\n"
          "  const cols=32,rows=9;\n"
          "  const vertices=[],indices=[],uvs=[];\n"
          "  for(let i=0;i<=cols;i++){\n"
          "    const tx=i/cols,baseX=-width*.5+tx*width;\n"
          "    const frontWave=Math.sin(tx*Math.PI*3+seed*.19)*.42+Math.sin(tx*Math.PI*7+seed*.07)*.14+(r()-.5)*.08;\n"
          "    const backWave=Math.sin(tx*Math.PI*2.35+seed*.23)*.23+Math.sin(tx*Math.PI*5.2+seed*.09)*.09;\n"
          "    const front=facing*(depth*.5-.42+frontWave),back=-facing*(depth*.5-.18+backWave);\n"
          "    for(let j=0;j<=rows;j++){\n"
          "      const tz=j/rows,sideInfluence=Math.pow(Math.abs(tx-.5)*2,5.5),sideSign=tx<.5?-1:1;\n"
          "      const sideWave=Math.sin(tz*Math.PI*3.1+seed*.17+sideSign*.8)*.22+Math.sin(tz*Math.PI*6.3+seed*.07)*.07;\n"
          "      const x=baseX+sideSign*sideInfluence*sideWave,z=THREE.MathUtils.lerp(back,front,tz);\n"
          "      const centerLift=Math.sin(Math.PI*tz)*(.14+.065*Math.sin(tx*Math.PI*4+seed*.11));\n"
          "      const crossRoll=Math.sin(tx*Math.PI*2.1+tz*Math.PI*1.7+seed*.13)*.075;\n"
          "      const macroRoll=Math.sin(tx*Math.PI*1.35+seed*.21)*Math.sin(tz*Math.PI)*.055;\n"
          "      const micro=(r()-.5)*.032,frontLift=tz*tz*(.045+.030*Math.sin(tx*Math.PI*2.2));\n"
          "      const y=.015+centerLift+crossRoll+macroRoll+micro+frontLift;\n"
          "      vertices.push(x,y,z);uvs.push(tx,tz);\n"
          "    }\n"
          "  }\n"
          "  const stride=rows+1;"
          )
          s,n=re.subn(r"function makeOrganicTop\(r,seed,width,depth,facing\)\{.*?  const stride=rows\+1;",replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('makeOrganicTop replacement failed')
          s=s.replace("// v4.5 re-gate: heightfield relief + denser authored microdetail makes the playable top read as terrain rather than a smooth green slab.","// v4.6 re-gate: four-edge scalloped heightfield + authored microdetail prevents rectangular terrain-slab silhouettes.")
          s=s.replace("version:'4.5.0'","version:'4.6.0'")
          bank.write_text(s)

          idx=Path('prototypes/modern-3d/index.html')
          h=idx.read_text()
          new_loop="for(let i=0;i<trees.length;i++){const [x,z,s,seed]=trees[i];const scaleJitter=.86+(seed%7)*.026;const px=x+((seed%7)-3)*.10,pz=z+((seed%11)-5)*.065;const t=createTargetConiferV31({seed,scale:s*scaleJitter});t.position.set(px,terrainY(px,pz),pz);scene.add(t);if(i%2===0){const f=createTargetFernPatch({seed:9000+seed,scale:.78+(seed%4)*.045,count:18+(seed%4)*3});f.position.set(px+((seed%5)-2)*.22,terrainY(px,pz)+.03,pz+.42+((seed%3)-1)*.18);scene.add(f)}}"
          h,n=re.subn(r"for\(let i=0;i<trees\.length;i\+\+\)\{const \[x,z,s,seed\]=trees\[i\],useTarget=.*?\}\}",new_loop,h,count=1)
          if n!=1: raise SystemExit('main forest loop replacement failed')
          h=h.replace("targetConifers:targetTreeIndices.size+destinationTrees.length","targetConifers:trees.length+destinationTrees.length+southRightFrameTrees.length")
          h=h.replace("compositionTrees:37","compositionTrees:trees.length+destinationTrees.length+southRightFrameTrees.length+3")
          idx.write_text(h)
          PY
          git diff --check
          grep -q 'const cols=32,rows=9' prototypes/modern-3d/m04-bank-target-v4.js
          grep -q 'sideInfluence' prototypes/modern-3d/m04-bank-target-v4.js
          grep -q 'scaleJitter' prototypes/modern-3d/index.html
      - name: Commit v63 asset repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototypes/modern-3d/m04-bank-target-v4.js prototypes/modern-3d/index.html
          git commit -m "fix(m04): organic terrain edges and varied target forest [m04-v63]"
          git push origin HEAD:prototype/modern-3d
