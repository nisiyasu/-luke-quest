name: M06-P01 Terrain Shore Seam Evidence

on:
  push:
    branches: ["prototype/modern-3d"]
    paths:
      - ".github/workflows/m06-p01-seam-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seam-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start exact-head runtime
        run: |
          python3 -m http.server 8140 --directory prototypes/modern-3d >/tmp/m06-p01-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8140/index.html >/dev/null
      - name: Capture canonical and nearby moved continuity evidence
        run: |
          mkdir -p .m06-p01
          cat > m06-p01.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const pos=s=>String(s||'').split(',').map(Number);
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            try{
              await page.goto('http://127.0.0.1:8140/index.html?quality=high',{waitUntil:'domcontentloaded',timeout:150000});
              await page.waitForFunction(()=>document.documentElement.dataset.lqModern3d==='m05-ready'&&document.documentElement.dataset.m08Player&&document.documentElement.dataset.m09OwnerHud==='pass',{timeout:150000});
              await page.waitForTimeout(1200);
              const before=await page.evaluate(()=>({player:document.documentElement.dataset.m08Player,camera:document.documentElement.dataset.m03CameraProfile||'UNKNOWN'}));
              await page.screenshot({path:'.m06-p01/canonical.png',fullPage:true,timeout:150000});
              await page.keyboard.down('ArrowUp');await page.waitForTimeout(1800);await page.keyboard.up('ArrowUp');await page.waitForTimeout(700);
              const north=await page.evaluate(()=>({player:document.documentElement.dataset.m08Player}));
              await page.screenshot({path:'.m06-p01/nearby-north.png',fullPage:true,timeout:150000});
              await page.keyboard.down('ArrowRight');await page.waitForTimeout(950);await page.keyboard.up('ArrowRight');await page.waitForTimeout(650);
              const side=await page.evaluate(()=>({player:document.documentElement.dataset.m08Player}));
              await page.screenshot({path:'.m06-p01/nearby-side.png',fullPage:true,timeout:150000});
              const a=pos(before.player),b=pos(north.player),c=pos(side.player);
              if(errors.length)throw new Error(`page errors=${JSON.stringify(errors)}`);
              if(a.length<3||b.length<3||c.length<3||![...a,...b,...c].every(Number.isFinite))throw new Error('invalid player coordinates');
              const northDelta=Math.hypot(b[0]-a[0],b[2]-a[2]),sideDelta=Math.hypot(c[0]-b[0],c[2]-b[2]);
              if(northDelta<.25)throw new Error(`north traversal blocked unexpectedly delta=${northDelta}`);
              if(sideDelta<.12)throw new Error(`side traversal blocked unexpectedly delta=${sideDelta}`);
              fs.writeFileSync('.m06-p01/traversal-audit.txt',[`head=${process.env.GITHUB_SHA||'UNKNOWN'}`,`camera=${before.camera}`,`canonical=${before.player}`,`north=${north.player}`,`side=${side.player}`,`north_delta=${northDelta.toFixed(3)}`,`side_delta=${sideDelta.toFixed(3)}`,`collision_route=PASS`,`page_errors=0`].join('\n')+'\n');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node m06-p01.cjs
      - name: Add visual authorities
        if: always()
        run: |
          curl -L --fail --retry 3 -o .m06-p01/MINIMUM_QUALITY_LINE.png https://raw.githubusercontent.com/nisiyasu/-luke-quest/eb6ec9fafc053b6dbabb6ee473932b7c7851ebc6/assets/reference/owner_2026-09-11_ps1_visual_target/MINIMUM_QUALITY_LINE.png
          curl -L --fail --retry 3 -o .m06-p01/TARGET_PS1_FINAL.png https://raw.githubusercontent.com/nisiyasu/-luke-quest/eb6ec9fafc053b6dbabb6ee473932b7c7851ebc6/assets/reference/owner_2026-09-11_ps1_visual_target/TARGET_PS1_FINAL.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m06-p01-seam-evidence
          path: .m06-p01
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
