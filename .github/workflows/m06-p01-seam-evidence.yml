# fresh exact-head revalidation trigger: 2026-09-14 authored south fringe banks 1c707b5a
# fresh exact-head revalidation trigger: 2026-09-14 organic near-field terrain integration c2a0b3fb
# fresh exact-head revalidation trigger: 2026-09-14 deterministic movement repair after headless RAF throttling false-failed run 34809967925
# fresh exact-head revalidation trigger: 2026-09-14 after bank_target_v4@4.8.0 M04 repair and M05 minimum-floor PASS
# fresh exact-head revalidation trigger: 2026-09-14 after secondary bridge clearance d5447038
# fresh exact-head revalidation trigger: 2026-09-14 current router M06-P01 after M05 re-entry
name: M06-P01 Terrain Shore Seam Evidence

on:
  push:
    branches: ["prototype/modern-3d"]
    paths:
      - ".github/workflows/m06-p01-seam-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seam-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start exact-head runtime
        run: |
          python3 -m http.server 8140 --directory prototypes/modern-3d >/tmp/m06-p01-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8140/index.html >/dev/null
      - name: Capture canonical and deterministic nearby continuity evidence
        run: |
          mkdir -p .m06-p01
          cat > m06-p01.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const pos=s=>String(s||'').split(',').map(Number);
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            try{
              await page.goto('http://127.0.0.1:8140/index.html?quality=high&m08gate=1',{waitUntil:'domcontentloaded',timeout:150000});
              await page.waitForFunction(()=>document.documentElement.dataset.lqModern3d==='m05-ready'&&document.documentElement.dataset.m08Player&&document.documentElement.dataset.m09OwnerHud==='pass'&&window.LQ_MODERN_3D_M08_GATE,{timeout:150000});
              await page.waitForTimeout(800);
              const before=await page.evaluate(()=>({player:document.documentElement.dataset.m08Player,camera:document.documentElement.dataset.m03CameraProfile||'UNKNOWN',blockedWater:window.LQ_MODERN_3D_M05.blockedWater,blockedBounds:window.LQ_MODERN_3D_M05.blockedBounds}));
              await page.screenshot({path:'.m06-p01/canonical.png',fullPage:true,timeout:150000});
              await page.keyboard.down('ArrowUp');
              await page.evaluate(()=>{for(let i=0;i<18;i++)window.LQ_MODERN_3D_M08_GATE.stepMovement(.1);window.LQ_MODERN_3D_M08_GATE.syncState()});
              await page.keyboard.up('ArrowUp');
              await page.waitForTimeout(150);
              const north=await page.evaluate(()=>({player:document.documentElement.dataset.m08Player,blockedWater:window.LQ_MODERN_3D_M05.blockedWater,blockedBounds:window.LQ_MODERN_3D_M05.blockedBounds}));
              await page.screenshot({path:'.m06-p01/nearby-north-landing.png',fullPage:true,timeout:150000});
              await page.keyboard.down('ArrowRight');
              await page.evaluate(()=>{for(let i=0;i<4;i++)window.LQ_MODERN_3D_M08_GATE.stepMovement(.1);window.LQ_MODERN_3D_M08_GATE.syncState()});
              await page.keyboard.up('ArrowRight');
              await page.waitForTimeout(150);
              const side=await page.evaluate(()=>({player:document.documentElement.dataset.m08Player,blockedWater:window.LQ_MODERN_3D_M05.blockedWater,blockedBounds:window.LQ_MODERN_3D_M05.blockedBounds}));
              await page.screenshot({path:'.m06-p01/nearby-side.png',fullPage:true,timeout:150000});
              const a=pos(before.player),b=pos(north.player),c=pos(side.player);
              if(errors.length)throw new Error(`page errors=${JSON.stringify(errors)}`);
              if(a.length<3||b.length<3||c.length<3||![...a,...b,...c].every(Number.isFinite))throw new Error('invalid player coordinates');
              const northDelta=Math.hypot(b[0]-a[0],b[2]-a[2]),sideDelta=Math.hypot(c[0]-b[0],c[2]-b[2]);
              const waterDelta=north.blockedWater-before.blockedWater,boundsDelta=north.blockedBounds-before.blockedBounds;
              if(northDelta<5.5)throw new Error(`deterministic north traversal blocked unexpectedly delta=${northDelta}`);
              if(sideDelta<1.15)throw new Error(`deterministic side traversal blocked unexpectedly delta=${sideDelta}`);
              if(waterDelta!==0||boundsDelta!==0)throw new Error(`route collision regression waterDelta=${waterDelta} boundsDelta=${boundsDelta}`);
              fs.writeFileSync('.m06-p01/traversal-audit.txt',[`head=${process.env.GITHUB_SHA||'UNKNOWN'}`,`camera=${before.camera}`,`canonical=${before.player}`,`north_landing=${north.player}`,`side=${side.player}`,`north_delta=${northDelta.toFixed(3)}`,`side_delta=${sideDelta.toFixed(3)}`,`blocked_water_delta=${waterDelta}`,`blocked_bounds_delta=${boundsDelta}`,`collision_route=PASS`,`movement_method=production_stepMovement_deterministic`,`page_errors=0`].join('\n')+'\n');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node m06-p01.cjs
      - name: Add visual authorities
        if: always()
        run: |
          curl -L --fail --retry 3 -o .m06-p01/MINIMUM_QUALITY_LINE.png https://raw.githubusercontent.com/nisiyasu/-luke-quest/eb6ec9fafc053b6dbabb6ee473932b7c7851ebc6/assets/reference/owner_2026-09-11_ps1_visual_target/MINIMUM_QUALITY_LINE.png
          curl -L --fail --retry 3 -o .m06-p01/TARGET_PS1_FINAL.png https://raw.githubusercontent.com/nisiyasu/-luke-quest/eb6ec9fafc053b6dbabb6ee473932b7c7851ebc6/assets/reference/owner_2026-09-11_ps1_visual_target/TARGET_PS1_FINAL.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m06-p01-seam-evidence
          path: .m06-p01
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
