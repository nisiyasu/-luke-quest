name: M03-P01 Landscape Composition Repair

on:
  push:
    branches: [prototype/modern-3d]
    paths:
      - '.github/workflows/m03-p01-landscape-composition-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 0
      - name: Apply target-family macro framing repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('prototypes/modern-3d/index.html')
          s=p.read_text()
          s,n0=re.subn(r"offsetPortrait=new THREE\.Vector3\([^)]*\)","offsetPortrait=new THREE.Vector3(1.2,32.4,23.0)",s,count=1)
          if n0 != 1:
              raise SystemExit(f'portrait camera anchor count={n0}')
          s,n1=re.subn(r"offsetLandscape=new THREE\.Vector3\([^)]*\)","offsetLandscape=new THREE.Vector3(.8,10.8,15.0)",s,count=1)
          if n1 != 1:
              raise SystemExit(f'landscape camera anchor count={n1}')
          s,n2=re.subn(r"camera\.fov=landscape\?\d+(?:\.\d+)?:\d+(?:\.\d+)?","camera.fov=landscape?39:43",s,count=1)
          if n2 != 1:
              raise SystemExit(f'camera fov count={n2}')
          s=s.replace("landscape-target-depth-v3-perspective':'portrait-canonical'","landscape-target-depth-v3-perspective':'portrait-target-family-v2'",1)
          p.write_text(s)
          PY
          git diff --check
          grep -q "offsetPortrait=new THREE.Vector3(1.2,32.4,23.0)" prototypes/modern-3d/index.html
          grep -q "offsetLandscape=new THREE.Vector3(.8,10.8,15.0)" prototypes/modern-3d/index.html
          grep -q "camera.fov=landscape?39:43" prototypes/modern-3d/index.html
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "lq-scheduled-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prototypes/modern-3d/index.html
          git commit -m "fix(m03-p01): reduce portrait bridge dominance"
          git push origin HEAD:prototype/modern-3d
