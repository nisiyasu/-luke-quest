name: M03-P01 Landscape Composition Repair

on:
  push:
    branches: [prototype/modern-3d]
    paths:
      - '.github/workflows/m03-p01-landscape-composition-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 0
      - name: Apply target-depth macro camera repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prototypes/modern-3d/index.html')
          s=p.read_text()
          old="offsetLandscape=new THREE.Vector3(.8,20.8,14.0)"
          new="offsetLandscape=new THREE.Vector3(.8,17.6,17.2)"
          if old not in s:
              raise SystemExit('current landscape camera anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          grep -q "offsetLandscape=new THREE.Vector3(.8,17.6,17.2)" prototypes/modern-3d/index.html
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "lq-scheduled-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prototypes/modern-3d/index.html
          git commit -m "fix(m03-p01): restore landscape depth staging"
          git push origin HEAD:prototype/modern-3d
