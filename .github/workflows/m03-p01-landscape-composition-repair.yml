name: M03-P01 Landscape Composition Repair

on:
  push:
    branches: [prototype/modern-3d]
    paths:
      - '.github/workflows/m03-p01-landscape-composition-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 0
      - name: Replace T-junction with curved north route and short side spur
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prototypes/modern-3d/index.html')
          s=p.read_text()

          old_bridge="const bridgeRight=bridgeAt(5.00,-5.10,1.12,false);bridgeRight.position.y=.82;bridgeRight.scale.z=.85;"
          new_bridge="const bridgeRight=bridgeAt(4.35,-5.25,1.14,false);bridgeRight.position.y=.82;bridgeRight.scale.z=.78;"
          if old_bridge not in s: raise SystemExit('v71 secondary bridge anchor not found')
          s=s.replace(old_bridge,new_bridge,1)

          old_routes="terrainPathRibbon([[-1.35,-4.45],[-1.55,-5.35],[-1.85,-6.35],[-2.10,-7.55],[-2.25,-8.95],[-2.45,-10.55],[-2.80,-12.35],[-3.20,-14.45]],.72,.06);pathRibbon([[-1.35,5.95],[-.75,7.35],[-1.45,9.0],[-2.3,10.7],[-2.8,12.6],[-3.35,14.6]],.76,-.18);terrainPathRibbon([[-1.80,-6.05],[-.75,-6.15],[.35,-6.20],[1.35,-6.30],[2.30,-6.40]],.62,.065);"
          new_routes="terrainPathRibbon([[-1.35,-4.45],[-.95,-5.15],[-.48,-5.95],[-.62,-6.90],[-1.12,-8.05],[-1.72,-9.55],[-2.28,-11.15],[-2.82,-12.85],[-3.30,-14.45]],.66,.055);pathRibbon([[-1.35,5.95],[-.75,7.35],[-1.45,9.0],[-2.3,10.7],[-2.8,12.6],[-3.35,14.6]],.76,-.18);terrainPathRibbon([[-.52,-5.92],[.20,-6.02],[.82,-6.15],[1.38,-6.30],[1.82,-6.48]],.44,.06);"
          if old_routes not in s: raise SystemExit('v71 route block not found')
          s=s.replace(old_routes,new_routes,1)

          if 'M03 Composition Rebuild v71' not in s: raise SystemExit('v71 title anchor not found')
          s=s.replace('M03 Composition Rebuild v71','M03 Composition Rebuild v72',1)
          if "bridgeLayout:'main-plus-diagonal-target-crossing-v7-north-corridor'" not in s: raise SystemExit('v71 layout marker not found')
          s=s.replace("bridgeLayout:'main-plus-diagonal-target-crossing-v7-north-corridor'","bridgeLayout:'main-plus-diagonal-target-crossing-v8-organic-junction'",1)
          p.write_text(s)
          PY
          git diff --check
          grep -q "M03 Composition Rebuild v72" prototypes/modern-3d/index.html
          grep -q "bridgeAt(4.35,-5.25,1.14,false)" prototypes/modern-3d/index.html
          grep -q "terrainPathRibbon(\[\[-.52,-5.92\]" prototypes/modern-3d/index.html
          grep -q "main-plus-diagonal-target-crossing-v8-organic-junction" prototypes/modern-3d/index.html
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "lq-scheduled-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prototypes/modern-3d/index.html
          git commit -m "fix(m03-p01): replace T-junction with organic side crossing"
          git push origin HEAD:prototype/modern-3d
