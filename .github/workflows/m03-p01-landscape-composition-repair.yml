name: M03-P01 Landscape Composition Repair

on:
  push:
    branches: [prototype/modern-3d]
    paths:
      - '.github/workflows/m03-p01-landscape-composition-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 0
      - name: Rebuild north corridor and right-midground crossing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prototypes/modern-3d/index.html')
          s=p.read_text()

          old_bridge="const bridgeRight=bridgeAt(4.55,-6.55,1.10,false);bridgeRight.position.y=.82;bridgeRight.scale.z=.92;"
          new_bridge="const bridgeRight=bridgeAt(5.00,-5.10,1.12,false);bridgeRight.position.y=.82;bridgeRight.scale.z=.85;"
          if old_bridge not in s: raise SystemExit('v70 secondary bridge anchor not found')
          s=s.replace(old_bridge,new_bridge,1)

          old_routes="pathRibbon([[-1.35,-4.45],[-2.25,-4.9],[-3.45,-5.8],[-4.55,-7.0],[-5.25,-9.0],[-5.8,-11.1],[-5.55,-13.4],[-6.4,-14.6]],.70,1.08);pathRibbon([[-1.35,5.95],[-.75,7.35],[-1.45,9.0],[-2.3,10.7],[-2.8,12.6],[-3.35,14.6]],.76,-.18);terrainPathRibbon([[-3.45,-5.80],[-2.55,-6.05],[-1.55,-6.35],[-.35,-6.75],[.75,-7.20],[1.65,-7.75]],.64,.06);"
          new_routes="terrainPathRibbon([[-1.35,-4.45],[-1.55,-5.35],[-1.85,-6.35],[-2.10,-7.55],[-2.25,-8.95],[-2.45,-10.55],[-2.80,-12.35],[-3.20,-14.45]],.72,.06);pathRibbon([[-1.35,5.95],[-.75,7.35],[-1.45,9.0],[-2.3,10.7],[-2.8,12.6],[-3.35,14.6]],.76,-.18);terrainPathRibbon([[-1.80,-6.05],[-.75,-6.15],[.35,-6.20],[1.35,-6.30],[2.30,-6.40]],.62,.065);"
          if old_routes not in s: raise SystemExit('v70 route block not found')
          s=s.replace(old_routes,new_routes,1)

          if 'M03 Composition Rebuild v70' not in s: raise SystemExit('v70 title anchor not found')
          s=s.replace('M03 Composition Rebuild v70','M03 Composition Rebuild v71',1)
          if "bridgeLayout:'main-plus-diagonal-target-crossing-v6-grounded-side-junction'" not in s: raise SystemExit('v70 layout marker not found')
          s=s.replace("bridgeLayout:'main-plus-diagonal-target-crossing-v6-grounded-side-junction'","bridgeLayout:'main-plus-diagonal-target-crossing-v7-north-corridor'",1)
          p.write_text(s)
          PY
          git diff --check
          grep -q "M03 Composition Rebuild v71" prototypes/modern-3d/index.html
          grep -q "bridgeAt(5.00,-5.10,1.12,false)" prototypes/modern-3d/index.html
          grep -q "terrainPathRibbon(\[\[-1.35,-4.45\]" prototypes/modern-3d/index.html
          grep -q "main-plus-diagonal-target-crossing-v7-north-corridor" prototypes/modern-3d/index.html
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "lq-scheduled-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prototypes/modern-3d/index.html
          git commit -m "fix(m03-p01): open north corridor and stage right crossing"
          git push origin HEAD:prototype/modern-3d
