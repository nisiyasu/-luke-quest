name: M03-P01 Landscape Composition Repair

on:
  push:
    branches: [prototype/modern-3d]
    paths:
      - '.github/workflows/m03-p01-landscape-composition-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 0
      - name: Apply aspect-aware macro camera repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prototypes/modern-3d/index.html')
          s=p.read_text()
          old="const offset=new THREE.Vector3(1.2,30.2,20.4);const m10PerfSamples=[];"
          new="const offsetPortrait=new THREE.Vector3(1.2,30.2,20.4),offsetLandscape=new THREE.Vector3(.8,20.8,14.0),offset=new THREE.Vector3();function syncCameraOffset(){const a=Math.max(.1,camera.aspect||1);offset.copy(a>1.25?offsetLandscape:offsetPortrait);document.documentElement.dataset.m03CameraProfile=a>1.25?'landscape-tight':'portrait-canonical'}syncCameraOffset();const m10PerfSamples=[];"
          if old not in s:
              raise SystemExit('camera offset anchor not found')
          s=s.replace(old,new,1)
          old2="camera.aspect=v.w/v.h;camera.updateProjectionMatrix();resizes++;"
          new2="camera.aspect=v.w/v.h;camera.updateProjectionMatrix();syncCameraOffset();resizes++;"
          if old2 not in s:
              raise SystemExit('resize anchor not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          git diff --check
          grep -q "landscape-tight" prototypes/modern-3d/index.html
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "lq-scheduled-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prototypes/modern-3d/index.html
          git commit -m "fix(m03-p01): tighten landscape macro camera"
          git push origin HEAD:prototype/modern-3d
