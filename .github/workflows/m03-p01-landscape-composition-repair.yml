name: M03-P01 Landscape Composition Repair

on:
  push:
    branches: [prototype/modern-3d]
    paths:
      - '.github/workflows/m03-p01-landscape-composition-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 0
      - name: Reposition secondary crossing and reconnect with grounded trail
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prototypes/modern-3d/index.html')
          s=p.read_text()

          old_bridge="const bridgeRight=bridgeAt(2.10,-4.82,Math.PI/2+.33,false);bridgeRight.position.y=.82;bridgeRight.scale.z=1.06;"
          new_bridge="const bridgeRight=bridgeAt(4.55,-6.55,1.10,false);bridgeRight.position.y=.82;bridgeRight.scale.z=.92;"
          if old_bridge not in s: raise SystemExit('v69 secondary bridge anchor not found')
          s=s.replace(old_bridge,new_bridge,1)

          anchor="function pathRibbon(points,width=.95,y=1.08){"
          idx=s.find(anchor)
          if idx < 0: raise SystemExit('pathRibbon anchor not found')
          end=s.find("\npathRibbon([[-1.35,-4.45]",idx)
          if end < 0: raise SystemExit('main path call anchor not found')
          helper="\nfunction terrainPathRibbon(points,width=.72,lift=.055){const verts=[],idx=[];for(let i=0;i<points.length;i++){const [x,z]=points[i],prev=points[Math.max(0,i-1)],next=points[Math.min(points.length-1,i+1)];const dx=next[0]-prev[0],dz=next[1]-prev[1],len=Math.hypot(dx,dz)||1,nx=-dz/len,nz=dx/len,w=width*(i===0||i===points.length-1?.78:1),y=terrainY(x,z)+lift;verts.push(x+nx*w,y,z+nz*w,x-nx*w,y,z-nz*w);if(i<points.length-1){const a=i*2,b=a+1,c=a+2,d=a+3;idx.push(a,c,b,c,d,b)}}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setIndex(idx);geo.computeVertexNormals();const m=new THREE.Mesh(geo,pathMat);m.receiveShadow=true;m.castShadow=false;scene.add(m);return m}\n"
          if 'function terrainPathRibbon(' not in s:
              s=s[:end]+helper+s[end:]

          route_anchor="pathRibbon([[-1.35,-4.45],[-2.25,-4.9],[-3.45,-5.8],[-4.55,-7.0],[-5.25,-9.0],[-5.8,-11.1],[-5.55,-13.4],[-6.4,-14.6]],.70,1.08);pathRibbon([[-1.35,5.95],[-.75,7.35],[-1.45,9.0],[-2.3,10.7],[-2.8,12.6],[-3.35,14.6]],.76,-.18);"
          if route_anchor not in s: raise SystemExit('v69 main path calls not found')
          route_new=route_anchor+"terrainPathRibbon([[-3.45,-5.80],[-2.55,-6.05],[-1.55,-6.35],[-.35,-6.75],[.75,-7.20],[1.65,-7.75]],.64,.06);"
          s=s.replace(route_anchor,route_new,1)

          if 'M03 Composition Rebuild v69' not in s: raise SystemExit('v69 title anchor not found')
          s=s.replace('M03 Composition Rebuild v69','M03 Composition Rebuild v70',1)
          if "bridgeLayout:'main-plus-diagonal-target-crossing-v5-connected-junction'" not in s: raise SystemExit('v69 layout marker not found')
          s=s.replace("bridgeLayout:'main-plus-diagonal-target-crossing-v5-connected-junction'","bridgeLayout:'main-plus-diagonal-target-crossing-v6-grounded-side-junction'",1)
          p.write_text(s)
          PY
          git diff --check
          grep -q "M03 Composition Rebuild v70" prototypes/modern-3d/index.html
          grep -q "bridgeAt(4.55,-6.55,1.10,false)" prototypes/modern-3d/index.html
          grep -q "terrainPathRibbon" prototypes/modern-3d/index.html
          grep -q "main-plus-diagonal-target-crossing-v6-grounded-side-junction" prototypes/modern-3d/index.html
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "lq-scheduled-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prototypes/modern-3d/index.html
          git commit -m "fix(m03-p01): move secondary crossing into right midground"
          git push origin HEAD:prototype/modern-3d
