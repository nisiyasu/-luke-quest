name: M03-P01 Portrait Target Composition Repair

on:
  push:
    branches: [prototype/modern-3d]
    paths:
      - '.github/workflows/m03-p01-landscape-composition-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 0
      - name: Reframe portrait camera and focal hierarchy toward target family
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prototypes/modern-3d/index.html')
          s=p.read_text()
          old="const offsetPortrait=new THREE.Vector3(1.2,32.4,23.0),offsetLandscape=new THREE.Vector3(.8,10.8,15.0),offset=new THREE.Vector3();function syncCameraOffset(){const a=Math.max(.1,camera.aspect||1),landscape=a>1.25;offset.copy(landscape?offsetLandscape:offsetPortrait);camera.fov=landscape?39:43;camera.updateProjectionMatrix();document.documentElement.dataset.m03CameraProfile=landscape?'landscape-target-depth-v3-perspective':'portrait-target-family-v2'}"
          new="const offsetPortrait=new THREE.Vector3(1.2,27.2,25.8),offsetLandscape=new THREE.Vector3(.8,10.8,15.0),offset=new THREE.Vector3();function syncCameraOffset(){const a=Math.max(.1,camera.aspect||1),landscape=a>1.25;offset.copy(landscape?offsetLandscape:offsetPortrait);camera.fov=landscape?39:39;camera.updateProjectionMatrix();document.documentElement.dataset.m03CameraProfile=landscape?'landscape-target-depth-v3-perspective':'portrait-target-depth-v3'}"
          if old not in s: raise SystemExit('camera profile anchor not found')
          s=s.replace(old,new,1)
          old_target="const target=new THREE.Vector3(player.position.x-.12,player.position.y*.1,player.position.z-5.9);"
          new_target="const target=new THREE.Vector3(player.position.x-.12,player.position.y*.1,player.position.z-7.2);"
          if old_target not in s: raise SystemExit('follow target anchor not found')
          s=s.replace(old_target,new_target,1)
          old_proof="const proofTarget=new THREE.Vector3(player.position.x-.12,player.position.y*.1,player.position.z-5.9);"
          new_proof="const proofTarget=new THREE.Vector3(player.position.x-.12,player.position.y*.1,player.position.z-7.2);"
          if old_proof not in s: raise SystemExit('proof target anchor not found')
          s=s.replace(old_proof,new_proof,1)
          if 'M03 Composition Rebuild v73' not in s: raise SystemExit('v73 title anchor not found')
          s=s.replace('M03 Composition Rebuild v73','M03 Composition Rebuild v74',1)
          p.write_text(s)
          PY
          git diff --check
          grep -q "M03 Composition Rebuild v74" prototypes/modern-3d/index.html
          grep -q "offsetPortrait=new THREE.Vector3(1.2,27.2,25.8)" prototypes/modern-3d/index.html
          grep -q "portrait-target-depth-v3" prototypes/modern-3d/index.html
          test "$(grep -o "player.position.z-7.2" prototypes/modern-3d/index.html | wc -l)" -eq 2
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "lq-scheduled-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prototypes/modern-3d/index.html
          git commit -m "fix(m03-p01): repair target-family portrait composition"
          git push origin HEAD:prototype/modern-3d
