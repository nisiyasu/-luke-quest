name: M03-P01 Landscape Composition Repair

on:
  push:
    branches: [prototype/modern-3d]
    paths:
      - '.github/workflows/m03-p01-landscape-composition-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 0
      - name: Rebuild secondary crossing as a target-family junction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prototypes/modern-3d/index.html')
          s=p.read_text()

          old_bridge="const bridgeRight=bridgeAt(4.05,-5.95,Math.PI/2-.58,false);bridgeRight.position.y=.82;"
          new_bridge="const bridgeRight=bridgeAt(2.10,-4.82,Math.PI/2+.33,false);bridgeRight.position.y=.82;bridgeRight.scale.z=1.06;"
          if old_bridge not in s: raise SystemExit('v68 secondary bridge anchor not found')
          s=s.replace(old_bridge,new_bridge,1)

          helper_start=s.find('function terrainPathRibbon(points,width=.76,lift=.055)')
          route_start=s.find('terrainPathRibbon([[-5.2,-9.6]',helper_start)
          if helper_start < 0 or route_start < 0: raise SystemExit('v68 temporary grounded-route block not found')
          route_end=s.find(';',route_start)
          if route_end < 0: raise SystemExit('v68 temporary route terminator not found')
          s=s[:helper_start]+s[route_end+1:]

          if 'M03 Composition Rebuild v68' not in s: raise SystemExit('v68 title anchor not found')
          s=s.replace('M03 Composition Rebuild v68','M03 Composition Rebuild v69',1)
          if "bridgeLayout:'main-plus-diagonal-target-crossing-v4-grounded-route'" not in s: raise SystemExit('v68 layout marker not found')
          s=s.replace("bridgeLayout:'main-plus-diagonal-target-crossing-v4-grounded-route'","bridgeLayout:'main-plus-diagonal-target-crossing-v5-connected-junction'",1)
          p.write_text(s)
          PY
          git diff --check
          grep -q "M03 Composition Rebuild v69" prototypes/modern-3d/index.html
          grep -q "bridgeAt(2.10,-4.82,Math.PI/2+.33,false)" prototypes/modern-3d/index.html
          grep -q "main-plus-diagonal-target-crossing-v5-connected-junction" prototypes/modern-3d/index.html
          if grep -q "terrainPathRibbon" prototypes/modern-3d/index.html; then
            echo "temporary v68 route still present" >&2
            exit 1
          fi
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "lq-scheduled-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prototypes/modern-3d/index.html
          git commit -m "fix(m03-p01): connect secondary bridge to main route"
          git push origin HEAD:prototype/modern-3d
