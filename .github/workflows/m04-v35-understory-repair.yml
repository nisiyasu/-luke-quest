name: M04 Understory Repair

on:
  push:
    branches: [prototype/modern-3d]
    paths:
      - .github/workflows/m04-v35-understory-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 0
      - name: Replace blade-wall understory with low frond groundcover
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prototypes/modern-3d/m04-target-assets.js')
          s=p.read_text()
          start=s.index('export function createTargetFernPatch')
          end=s.index('\nexport function createTargetBank', start)
          new='''export function createTargetFernPatch({seed=1,scale=1,count=18}={}){
  const r=rng(seed),g=new THREE.Group(),dummy=new THREE.Object3D();
  const groups=[[],[]];
  for(let i=0;i<count;i++){
    const a=r()*Math.PI*2,rad=Math.sqrt(r())*.72*scale;
    const len=(.30+r()*.32)*scale,w=(.18+r()*.12)*scale;
    groups[i%2].push({x:Math.cos(a)*rad,z:Math.sin(a)*rad,a,len,w,lean:.30+r()*.25,twist:(r()-.5)*.32});
  }
  [fernDark,fernLight].forEach((mat,mi)=>{
    const list=groups[mi],mesh=new THREE.InstancedMesh(FROND,mat,list.length);
    list.forEach((v,i)=>{
      dummy.position.set(v.x,.025*scale,v.z);
      dummy.rotation.set(-v.lean,-v.a+Math.PI/2,v.twist);
      dummy.scale.set(v.w,1,v.len);
      dummy.updateMatrix();mesh.setMatrixAt(i,dummy.matrix);
    });
    mesh.instanceMatrix.needsUpdate=true;mesh.castShadow=false;mesh.receiveShadow=true;g.add(mesh);
  });
  g.userData={assetId:'fern_patch_target_v2',version:'2.0.0',seed,stage:'M04_PRODUCTION_CANDIDATE',source:'repo-procedural',intent:'low layered fern groundcover without vertical blade-wall silhouette'};
  return g;
}'''
          s=s[:start]+new+s[end:]
          p.write_text(s)

          n=Path('prototypes/modern-3d/natural-assets.js')
          x=n.read_text()
          old="const h=.55+r()*.85;dummy.position.set((r()-.5)*width,.12+r()*.03,(r()-.5)*depth);dummy.rotation.set((r()-.5)*.22,r()*Math.PI*2,(r()-.5)*.38);dummy.scale.set(.65+r()*.75,h,.65+r()*.55)"
          new2="const h=.22+r()*.34;dummy.position.set((r()-.5)*width,.055+r()*.02,(r()-.5)*depth);dummy.rotation.set((r()-.5)*.18,r()*Math.PI*2,(r()-.5)*.30);dummy.scale.set(.48+r()*.48,h,.48+r()*.42)"
          if old not in x: raise SystemExit('meadow blade anchor missing')
          x=x.replace(old,new2,1)
          x=x.replace("assetId:'meadow_field_v1',version:'1.0.0'","assetId:'meadow_field_v1',version:'1.1.0'",1)
          n.write_text(x)

          m=Path('prototypes/modern-3d/ASSET_MANIFEST.json')
          y=m.read_text()
          y=y.replace('fern_patch_target_v1@1.0.0 + meadow_field_v1@1.0.0','fern_patch_target_v2@2.0.0 + meadow_field_v1@1.1.0')
          y=y.replace('"id": "fern_patch_target_v1"','"id": "fern_patch_target_v2"')
          y=y.replace('"path": "m04-target-assets.js#createTargetFernPatch",\n      "dimensions_m": "configurable patch scale and count",\n      "origin": "patch footprint center",\n      "features": ["two-tone instanced fern blades", "seeded radial scatter", "lean/height variation"],\n      "version": "1.0.0"','"path": "m04-target-assets.js#createTargetFernPatch",\n      "dimensions_m": "configurable patch scale and count",\n      "origin": "patch footprint center",\n      "features": ["two-tone instanced low fronds", "seeded radial scatter", "low layered groundcover silhouette", "lean/length variation"],\n      "version": "2.0.0"')
          y=y.replace('"version": "1.0.0"\n    },\n    {\n      "id": "layered_bank_v2"','"version": "1.1.0"\n    },\n    {\n      "id": "layered_bank_v2"',1)
          if 'fern_patch_target_v2@2.0.0' not in y: raise SystemExit('manifest active understory patch failed')
          m.write_text(y)
          PY
          rm .github/workflows/m04-v35-understory-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototypes/modern-3d/m04-target-assets.js prototypes/modern-3d/natural-assets.js prototypes/modern-3d/ASSET_MANIFEST.json .github/workflows/m04-v35-understory-repair.yml
          git commit -m "fix(modern-3d): replace blade-wall understory"
          git push origin HEAD:prototype/modern-3d
