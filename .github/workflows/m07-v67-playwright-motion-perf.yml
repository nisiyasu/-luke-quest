name: M07 v67 Motion Performance Evidence
# m07-p01 exact-head fallback refresh v2

on:
  push:
    branches: ["prototype/modern-3d"]
    paths:
      - ".github/workflows/m07-v67-playwright-motion-perf.yml"

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start runtime
        run: |
          python3 -m http.server 8140 --directory prototypes/modern-3d >/tmp/m07-v67-motion-http.log 2>&1 &
          sleep 2
      - name: Capture motion and preset timing
        run: |
          mkdir -p .m07-v67-motion/videos
          cat > capture-m07-v67-motion.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const rows=[];
            for(const quality of ['practical','high']){
              const context=await browser.newContext({viewport:{width:390,height:844},recordVideo:quality==='practical'?{dir:'.m07-v67-motion/videos',size:{width:390,height:844}}:undefined});
              const page=await context.newPage(); const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
              const t0=Date.now();
              await page.goto(`http://127.0.0.1:8140/index.html?quality=${quality}`,{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForFunction(()=>document.documentElement.dataset.lqModern3d==='m05-ready' && document.documentElement.dataset.m09OwnerHud==='pass',{timeout:60000});
              const ready=Date.now()-t0;
              await page.screenshot({path:`.m07-v67-motion/${quality}-t0.png`,fullPage:true,timeout:60000});
              await page.waitForTimeout(2400);
              await page.screenshot({path:`.m07-v67-motion/${quality}-t1.png`,fullPage:true,timeout:60000});
              if(errors.length) throw new Error(`${quality}: ${errors.join(' | ')}`);
              rows.push(`${quality} ready_wall_ms=${ready}`);
              await page.close(); await context.close();
            }
            const vids=fs.readdirSync('.m07-v67-motion/videos').filter(x=>x.endsWith('.webm'));
            if(!vids.length) throw new Error('practical motion video missing');
            fs.renameSync(`.m07-v67-motion/videos/${vids[0]}`,'.m07-v67-motion/water-shadow-motion-practical.webm');
            fs.writeFileSync('.m07-v67-motion/performance.txt',rows.join('\n')+'\nHIGH_WATER_GRID=96x40\nPRACTICAL_WATER_GRID=52x20\nMOTION_VIDEO=PASS\n');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node capture-m07-v67-motion.cjs
          test -s .m07-v67-motion/water-shadow-motion-practical.webm
          test -s .m07-v67-motion/practical-t0.png
          test -s .m07-v67-motion/practical-t1.png
          test -s .m07-v67-motion/high-t0.png
          test -s .m07-v67-motion/high-t1.png
      - uses: actions/upload-artifact@v4
        with:
          name: m07-v67-motion-performance
          path: .m07-v67-motion
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14