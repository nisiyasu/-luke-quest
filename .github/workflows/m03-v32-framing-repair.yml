name: M03 v32 Framing Repair

on:
  push:
    branches: [prototype/modern-3d]
    paths:
      - .github/workflows/m03-v32-framing-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 0
      - name: Raise player and hero bridge inside portrait frame
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prototypes/modern-3d/index.html')
          s=p.read_text()
          s=s.replace('M03 Composition Rebuild v31','M03 Composition Rebuild v32')
          s=s.replace("player.position.z-5.7","player.position.z-3.4")
          s=s.replace("camera.lookAt(-1.47,.4,-2.5);","camera.lookAt(-1.47,.4,-.2);")
          s=s.replace("m03-composition-v31-centered-hero","m03-composition-v32-hero-frame")
          if s.count('player.position.z-3.4') != 2 or 'm03-composition-v32-hero-frame' not in s:
              raise SystemExit('v32 patch verification failed')
          p.write_text(s)
          PY
          rm .github/workflows/m03-v32-framing-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototypes/modern-3d/index.html .github/workflows/m03-v32-framing-repair.yml
          git commit -m "fix(modern-3d): align M03 portrait hero frame"
          git push origin HEAD:prototype/modern-3d
