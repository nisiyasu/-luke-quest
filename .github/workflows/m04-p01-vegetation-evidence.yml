# fresh exact-head revalidation trigger: 2026-09-13 v64
name: M04-P01 Vegetation Evidence

on:
  push:
    branches: ["prototype/modern-3d"]
    paths:
      - ".github/workflows/m04-p01-vegetation-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start runtime
        run: |
          python3 -m http.server 8140 --directory prototypes/modern-3d >/tmp/m04-p01-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8140/m04-target-inspection.html >/dev/null
          curl -fsS http://127.0.0.1:8140/index.html >/dev/null
      - name: Capture common-light vegetation inspection and integrated frame
        run: |
          mkdir -p .m04-p01
          cat > vegetation-evidence.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
            const rows=[];
            try{
              const inspect=await browser.newPage({viewport:{width:1280,height:760},deviceScaleFactor:1});
              const inspectErrors=[];inspect.on('pageerror',e=>inspectErrors.push(String(e)));
              await inspect.goto('http://127.0.0.1:8140/m04-target-inspection.html',{waitUntil:'domcontentloaded',timeout:150000});
              await inspect.waitForFunction(()=>document.documentElement.dataset.m04TargetInspection==='ready'&&document.documentElement.dataset.candidateAsset==='conifer_target_v31@3.8.0',{timeout:150000});
              await inspect.waitForTimeout(1200);
              const meta=await inspect.evaluate(()=>({ready:document.documentElement.dataset.m04TargetInspection,current:document.documentElement.dataset.currentAsset,previous:document.documentElement.dataset.previousCandidate,candidate:document.documentElement.dataset.candidateAsset}));
              if(inspectErrors.length)throw new Error(`inspection errors=${JSON.stringify(inspectErrors)}`);
              await inspect.screenshot({path:'.m04-p01/common-light-vegetation-inspection.png',fullPage:true,timeout:150000});
              rows.push(`inspection ${JSON.stringify(meta)}`);
              await inspect.close();

              const scene=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
              const sceneErrors=[];scene.on('pageerror',e=>sceneErrors.push(String(e)));
              await scene.goto('http://127.0.0.1:8140/index.html?quality=high',{waitUntil:'domcontentloaded',timeout:150000});
              await scene.waitForFunction(()=>document.documentElement.dataset.lqModern3d==='m05-ready'&&document.documentElement.dataset.m09OwnerHud==='pass',{timeout:150000});
              await scene.waitForTimeout(1200);
              const sm=await scene.evaluate(()=>({scene:document.documentElement.dataset.lqModern3d,player:document.documentElement.dataset.m08Player,camera:document.documentElement.dataset.m03CameraProfile||'UNKNOWN'}));
              if(sceneErrors.length)throw new Error(`scene errors=${JSON.stringify(sceneErrors)}`);
              await scene.screenshot({path:'.m04-p01/integrated-canonical.png',fullPage:true,timeout:150000});
              rows.push(`scene ${JSON.stringify(sm)}`);
              await scene.close();

              const manifest=JSON.parse(fs.readFileSync('prototypes/modern-3d/ASSET_MANIFEST.json','utf8'));
              const conifer=manifest.assets.find(x=>x.id==='conifer_target_v31');
              const fern=manifest.assets.find(x=>x.id==='fern_patch_target_v3');
              if(manifest.active_target_set.conifer!=='conifer_target_v31@3.8.0'||!conifer||conifer.version!=='3.8.0'||!fern||fern.version!=='3.0.0')throw new Error('manifest vegetation authority mismatch');
              rows.push(`manifest conifer=${manifest.active_target_set.conifer} understory=${manifest.active_target_set.understory} coniferVersion=${conifer.version} fernVersion=${fern.version} source=${conifer.source}/${fern.source}`);
              fs.writeFileSync('.m04-p01/vegetation-audit.txt',rows.join('\n')+'\n');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node vegetation-evidence.cjs
      - name: Add visual authorities
        if: always()
        run: |
          curl -L --fail --retry 3 -o .m04-p01/MINIMUM_QUALITY_LINE.png https://raw.githubusercontent.com/nisiyasu/-luke-quest/eb6ec9fafc053b6dbabb6ee473932b7c7851ebc6/assets/reference/owner_2026-09-11_ps1_visual_target/MINIMUM_QUALITY_LINE.png
          curl -L --fail --retry 3 -o .m04-p01/TARGET_PS1_FINAL.png https://raw.githubusercontent.com/nisiyasu/-luke-quest/eb6ec9fafc053b6dbabb6ee473932b7c7851ebc6/assets/reference/owner_2026-09-11_ps1_visual_target/TARGET_PS1_FINAL.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m04-p01-vegetation-evidence
          path: .m04-p01
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14