name: Modern 3D M03 Fast Evidence

on:
  push:
    branches: ["prototype/modern-3d"]
    paths:
      - ".github/workflows/modern-3d-m03-fast-evidence.yml"
      - "prototypes/modern-3d/**"

permissions:
  contents: read

concurrency:
  group: modern-3d-m03-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deterministic local browser fixture
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .modern3d-ci
          cp -a prototypes/modern-3d .modern3d-ci
          curl -fL --retry 4 --retry-all-errors --connect-timeout 10 'https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js' -o .modern3d-ci/three.module.js
          curl -fL --retry 4 --retry-all-errors --connect-timeout 10 'https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.core.js' -o .modern3d-ci/three.core.js
          test -s .modern3d-ci/three.module.js
          test -s .modern3d-ci/three.core.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.modern3d-ci/index.html')
          s=p.read_text()
          old='https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js'
          assert old in s
          p.write_text(s.replace(old,'./three.module.js',1))
          PY
      - name: Start local server and verify module HTTP
        shell: bash
        run: |
          set -euo pipefail
          (cd .modern3d-ci && python3 -m http.server 8140 >/tmp/modern3d-fast-http.log 2>&1 &)
          for i in {1..30}; do curl -fsS http://127.0.0.1:8140/index.html >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8140/three.module.js >/dev/null
          curl -fsS http://127.0.0.1:8140/three.core.js >/dev/null
      - name: Verify traversal state
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          mkdir -p .modern3d-fast
          timeout 75s "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --enable-webgl --ignore-gpu-blocklist --use-angle=swiftshader --enable-unsafe-swiftshader --virtual-time-budget=5000 --dump-dom 'http://127.0.0.1:8140/index.html?ci=1' > .modern3d-fast/dom.html 2>.modern3d-fast/chrome-stderr.log || true
          grep -q 'data-lq-modern3d="m05-ready"' .modern3d-fast/dom.html
          grep -q 'data-m02-ci="pass"' .modern3d-fast/dom.html
          grep -q 'data-m03-ci="pass"' .modern3d-fast/dom.html
          grep -q 'data-m05-scene="ready"' .modern3d-fast/dom.html
          grep -oE 'data-m03-route="[^"]*"' .modern3d-fast/dom.html > .modern3d-fast/route.txt
      - name: Install CDP capture harness
        shell: bash
        run: npm install --no-save --no-package-lock puppeteer-core
      - name: Capture exact frames after proven WebGL boot
        shell: bash
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const fs=require('fs');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.BROWSER,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            const page=await browser.newPage();
            const diag=[];
            page.on('console',m=>diag.push(`console:${m.type()}:${m.text()}`));
            page.on('pageerror',e=>diag.push(`pageerror:${e.message}`));
            await page.setViewport({width:800,height:600,deviceScaleFactor:1});
            await page.goto('http://127.0.0.1:8140/index.html?ci=1',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>document.body.dataset.lqModern3d==='m05-ready'&&document.body.dataset.m02Ci==='pass'&&document.body.dataset.m03Ci==='pass',{timeout:60000,polling:250});
            async function shot(width,height,out){
              await page.setViewport({width,height,deviceScaleFactor:1});
              await new Promise(r=>setTimeout(r,1500));
              const state=await page.evaluate(()=>({innerWidth,innerHeight,clientWidth:document.documentElement.clientWidth,clientHeight:document.documentElement.clientHeight,ready:document.body.dataset.lqModern3d,m02:document.body.dataset.m02Ci,m03:document.body.dataset.m03Ci,scene:document.body.dataset.m05Scene,profile:document.body.dataset.m03CameraProfile||'',canvas:[...document.querySelectorAll('canvas')].map(c=>({w:c.width,h:c.height,cw:c.clientWidth,ch:c.clientHeight}))}));
              if(state.innerWidth!==width||state.innerHeight!==height||state.clientWidth!==width||state.clientHeight!==height) throw new Error(`viewport mismatch ${JSON.stringify(state)}`);
              if(state.ready!=='m05-ready'||state.m02!=='pass'||state.m03!=='pass'||state.scene!=='ready') throw new Error(`runtime lost readiness after resize ${JSON.stringify(state)}`);
              await page.screenshot({path:`.modern3d-fast/${out}`,fullPage:false});
              fs.appendFileSync('.modern3d-fast/cdp-viewport.txt',`${out} ${JSON.stringify(state)}\n`);
            }
            await shot(390,844,'m03-390x844.png');
            await shot(864,1536,'m03-864x1536.png');
            fs.writeFileSync('.modern3d-fast/cdp-console.txt',diag.join('\n'));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          python3 - <<'PY'
          from pathlib import Path
          import struct
          for path, expected in [('.modern3d-fast/m03-390x844.png',(390,844)),('.modern3d-fast/m03-864x1536.png',(864,1536))]:
              p=Path(path).read_bytes()
              assert len(p)>15000 and p[:8]==b'\x89PNG\r\n\x1a\n'
              assert struct.unpack('>II',p[16:24])==expected
              print(path, expected, len(p))
          print(Path('.modern3d-fast/cdp-viewport.txt').read_text())
          PY
      - name: Upload bounded M03 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-3d-m03-fast-${{ github.sha }}
          path: |
            .modern3d-fast/dom.html
            .modern3d-fast/route.txt
            .modern3d-fast/chrome-stderr.log
            .modern3d-fast/cdp-viewport.txt
            .modern3d-fast/cdp-console.txt
            .modern3d-fast/m03-390x844.png
            .modern3d-fast/m03-864x1536.png
            /tmp/modern3d-fast-http.log
            assets/reference/owner_2026-09-11_ps1_visual_target/MINIMUM_QUALITY_LINE.png
            assets/reference/owner_2026-09-11_ps1_visual_target/TARGET_PS1_FINAL.png
            prototypes/modern-3d/index.html
            prototypes/modern-3d/natural-assets.js
          if-no-files-found: warn
          retention-days: 14
