name: Modern 3D M08 Motion Evidence

on:
  push:
    branches: ["prototype/modern-3d"]
    paths:
      - ".github/workflows/modern-3d-m08-motion-evidence.yml"
      - "prototypes/modern-3d/**"

permissions:
  contents: read

concurrency:
  group: modern-3d-m08-motion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m08-motion-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify M08 motion camera and grounding contracts in source
        shell: bash
        run: |
          set -euo pipefail
          grep -F "player.userData.animate(sec,moving?1:0)" prototypes/modern-3d/index.html
          ! grep -F "player.userData.animate(sec,moving?1:.12)" prototypes/modern-3d/index.html
          grep -F "THREE.MathUtils.clamp(movement,0,1)" prototypes/modern-3d/assets.js
          grep -F "THREE.MathUtils.smoothstep(-z,2.45,3.65)" prototypes/modern-3d/index.html
          grep -F "THREE.MathUtils.smoothstep(z,4.65,5.85)" prototypes/modern-3d/index.html
          grep -F "const cameraBlend=1-Math.exp(-4.2*dt)" prototypes/modern-3d/index.html
          grep -F "const dt=Math.max(0,Math.min((now-last)/1000,.05));last=now;" prototypes/modern-3d/index.html
          ! grep -F "camera.position.lerp(target.clone().add(offset),.06)" prototypes/modern-3d/index.html
          grep -F "addEventListener('blur',()=>{releaseAll();blurRelease=true})" prototypes/modern-3d/index.html
          grep -F "document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll()})" prototypes/modern-3d/index.html
          grep -F "dataset.m08Ci=pass?'pass':'fail'" prototypes/modern-3d/index.html
          grep -F "groundSamples:groundSamples.map" prototypes/modern-3d/index.html
          grep -F "m08Proof=query.get('m08proof')==='1'" prototypes/modern-3d/index.html
          grep -F "for(let i=0;i<96;i++)stepMovement(1/60)" prototypes/modern-3d/index.html
          grep -F "dataset.m08ProofStart=" prototypes/modern-3d/index.html
          grep -F "dataset.m08ProofEnd=" prototypes/modern-3d/index.html
          grep -F "dataset.m08ProofDone='1'" prototypes/modern-3d/index.html
      - name: Start isolated prototype server
        shell: bash
        run: |
          python3 -m http.server 8140 --directory prototypes/modern-3d >/tmp/m08-http.log 2>&1 &
          sleep 1
          curl -fsS http://127.0.0.1:8140/index.html >/dev/null
      - name: Run movement collision release and grounding evidence
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          mkdir -p .modern3d-m08
          timeout 75s "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-webgl --ignore-gpu-blocklist --use-angle=swiftshader --enable-unsafe-swiftshader \
            --virtual-time-budget=1000 --dump-dom \
            'http://127.0.0.1:8140/index.html?ci=1' > .modern3d-m08/dom.html 2>.modern3d-m08/chrome-stderr.log
          grep -q 'data-lq-modern3d="m05-ready"' .modern3d-m08/dom.html
          grep -q 'data-m02-ci="pass"' .modern3d-m08/dom.html
          grep -q 'data-m03-ci="pass"' .modern3d-m08/dom.html
          grep -q 'data-m08-ci="pass"' .modern3d-m08/dom.html
          grep -q 'data-m05-scene="ready"' .modern3d-m08/dom.html
          grep -q '"crossedBridge":true' .modern3d-m08/dom.html
          grep -q '"blockedAtShore":true' .modern3d-m08/dom.html
          grep -q '"pointerMoved":true' .modern3d-m08/dom.html
          grep -q '"released":true' .modern3d-m08/dom.html
          grep -q '"noHole":true' .modern3d-m08/dom.html
          grep -q '"groundingSmooth":true' .modern3d-m08/dom.html
      - name: Prove bounded walking advances the real player
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          timeout 35s "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-webgl --ignore-gpu-blocklist --use-angle=swiftshader --enable-unsafe-swiftshader \
            --virtual-time-budget=200 --dump-dom \
            'http://127.0.0.1:8140/index.html?m08proof=1' > .modern3d-m08/walk-proof.html 2>>.modern3d-m08/chrome-stderr.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('.modern3d-m08/walk-proof.html').read_text()
          def attr(name):
              m=re.search(fr'{name}="([^"]+)"', text)
              assert m, f'missing {name}'
              return m.group(1)
          assert attr('data-m08-proof-done') == '1'
          start=[float(v) for v in attr('data-m08-proof-start').split(',')]
          end=[float(v) for v in attr('data-m08-proof-end').split(',')]
          assert abs(start[0]+1.35)<.15 and abs(end[0]+1.35)<.15, (start,end)
          assert end[2] < start[2]-4.5, (start,end)
          assert .30 < start[1] < .55 and .30 < end[1] < .55, (start,end)
          Path('.modern3d-m08/walk-position-proof.txt').write_text(f'start={start}\nend={end}\ndelta_z={end[2]-start[2]:.3f}\nPASS\n')
          print(start,end)
          PY
      - name: Capture M08 idle and proof-pose frames
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          timeout 75s "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-webgl --ignore-gpu-blocklist --use-angle=swiftshader --enable-unsafe-swiftshader \
            --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=700 \
            --screenshot=.modern3d-m08/m08-390x844.png \
            'http://127.0.0.1:8140/index.html'
          timeout 75s "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-webgl --ignore-gpu-blocklist --use-angle=swiftshader --enable-unsafe-swiftshader \
            --window-size=864,1536 --force-device-scale-factor=1 --virtual-time-budget=700 \
            --screenshot=.modern3d-m08/m08-864x1536.png \
            'http://127.0.0.1:8140/index.html'
          timeout 35s "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-webgl --ignore-gpu-blocklist --use-angle=swiftshader --enable-unsafe-swiftshader \
            --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=200 \
            --screenshot=.modern3d-m08/m08-proof-walk.png \
            'http://127.0.0.1:8140/index.html?m08proof=1'
          python3 - <<'PY'
          from pathlib import Path
          import struct
          expected={
            '.modern3d-m08/m08-390x844.png':(390,844),
            '.modern3d-m08/m08-864x1536.png':(864,1536),
            '.modern3d-m08/m08-proof-walk.png':(390,844),
          }
          for path,size in expected.items():
              data=Path(path).read_bytes()
              assert len(data)>15000 and data[:8]==b'\x89PNG\r\n\x1a\n'
              assert struct.unpack('>II',data[16:24])==size
              print(path,len(data))
          PY
      - name: Upload M08 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-3d-m08-motion-${{ github.sha }}
          path: |
            .modern3d-m08/dom.html
            .modern3d-m08/walk-proof.html
            .modern3d-m08/walk-position-proof.txt
            .modern3d-m08/chrome-stderr.log
            .modern3d-m08/m08-390x844.png
            .modern3d-m08/m08-864x1536.png
            .modern3d-m08/m08-proof-walk.png
            /tmp/m08-http.log
            prototypes/modern-3d/index.html
            prototypes/modern-3d/assets.js
          if-no-files-found: warn
          retention-days: 14
