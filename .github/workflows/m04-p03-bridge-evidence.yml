name: M04-P03 Bridge Evidence

on:
  push:
    branches: ["prototype/modern-3d"]
    paths:
      - ".github/workflows/m04-p03-bridge-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start exact-trigger-head runtime
        run: |
          python3 -m http.server 8140 --directory prototypes/modern-3d >/tmp/m04-p03-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8140/m04-bridge-inspection.html >/dev/null
          curl -fsS http://127.0.0.1:8140/index.html >/dev/null
      - name: Capture bridge family and integrated evidence
        run: |
          mkdir -p .m04-p03
          cat > bridge-evidence.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
            const rows=[`evidence_source_head=${process.env.GITHUB_SHA||'UNKNOWN'}`];
            try{
              const inspect=await browser.newPage({viewport:{width:1280,height:760},deviceScaleFactor:1});
              const ie=[];inspect.on('pageerror',e=>ie.push(String(e)));
              await inspect.goto('http://127.0.0.1:8140/m04-bridge-inspection.html',{waitUntil:'domcontentloaded',timeout:150000});
              await inspect.waitForFunction(()=>document.documentElement.dataset.m04BridgeInspection==='ready'&&document.documentElement.dataset.bridgeAsset==='bridge_principal_v1@1.2.0'&&document.documentElement.dataset.bankAsset==='bank_target_v4@4.9.0'&&document.documentElement.dataset.rockAsset==='rock_cluster_v1@1.2.0',{timeout:150000});
              await inspect.waitForTimeout(1400);
              const im=await inspect.evaluate(()=>({ready:document.documentElement.dataset.m04BridgeInspection,bridge:document.documentElement.dataset.bridgeAsset,vegetation:document.documentElement.dataset.vegetationAsset,bank:document.documentElement.dataset.bankAsset,rock:document.documentElement.dataset.rockAsset}));
              if(ie.length)throw new Error(`inspection errors=${JSON.stringify(ie)}`);
              await inspect.screenshot({path:'.m04-p03/common-light-bridge-family.png',fullPage:true,timeout:150000});
              rows.push(`inspection=${JSON.stringify(im)}`);
              await inspect.close();

              async function capture(query,path){
                const scene=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
                const se=[];scene.on('pageerror',e=>se.push(String(e)));
                await scene.goto(`http://127.0.0.1:8140/index.html${query}`,{waitUntil:'domcontentloaded',timeout:150000});
                await scene.waitForFunction(()=>document.documentElement.dataset.lqModern3d==='m05-ready'&&document.documentElement.dataset.m09OwnerHud==='pass'&&document.documentElement.dataset.m04PathMaterial==='m04-path-material-v2',{timeout:150000});
                await scene.waitForTimeout(1400);
                const sm=await scene.evaluate(()=>({scene:document.documentElement.dataset.lqModern3d,player:document.documentElement.dataset.m08Player,camera:document.documentElement.dataset.m03CameraProfile||'UNKNOWN',pathMaterial:document.documentElement.dataset.m04PathMaterial||'UNKNOWN'}));
                if(se.length)throw new Error(`scene errors=${JSON.stringify(se)}`);
                await scene.screenshot({path,fullPage:true,timeout:150000});
                await scene.close();return sm;
              }
              rows.push(`hq=${JSON.stringify(await capture('?quality=high','.m04-p03/integrated-canonical-hq.png'))}`);
              rows.push(`practical=${JSON.stringify(await capture('','.m04-p03/integrated-canonical-practical.png'))}`);

              const manifest=JSON.parse(fs.readFileSync('prototypes/modern-3d/ASSET_MANIFEST.json','utf8'));
              const bridge=manifest.assets.find(x=>x.id==='bridge_principal_v1');
              const bank=manifest.assets.find(x=>x.id==='bank_target_v4');
              const rock=manifest.assets.find(x=>x.id==='rock_cluster_v1');
              if(manifest.active_target_set.bridge!=='bridge_principal_v1@1.2.0'||!bridge||bridge.version!=='1.2.0')throw new Error('bridge authority mismatch');
              if(manifest.active_target_set.bank!=='bank_target_v4@4.9.0'||!bank||bank.version!=='4.9.0'||im.bank!==manifest.active_target_set.bank)throw new Error(`bank authority mismatch inspection=${im.bank} manifest=${manifest.active_target_set.bank}`);
              if(!rock||rock.version!=='1.2.0'||im.rock!=='rock_cluster_v1@1.2.0')throw new Error(`rock authority mismatch inspection=${im.rock} manifest=${rock&&rock.version}`);
              const required=['individual varied boards','deck thickness','side beams','cross-beams','trestle piers','diagonal structural braces','capped posts','dual rails','wood grain variation'];
              for(const f of required)if(!bridge.features.includes(f))throw new Error(`bridge manifest feature missing: ${f}`);
              rows.push(`manifest bridge=${manifest.active_target_set.bridge} bank=${manifest.active_target_set.bank} rock=${rock.id}@${rock.version} source=${bridge.source} bridgeFeatures=${bridge.features.length}`);
              rows.push('cross_asset_family=current conifer 3.8 + faceted bank 4.9 + faceted rock 1.2 + bridge 1.2');
              fs.writeFileSync('.m04-p03/bridge-audit.txt',rows.join('\n')+'\n');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node bridge-evidence.cjs
      - name: Add visual authorities
        if: always()
        run: |
          curl -L --fail --retry 3 -o .m04-p03/MINIMUM_QUALITY_LINE.png https://raw.githubusercontent.com/nisiyasu/-luke-quest/eb6ec9fafc053b6dbabb6ee473932b7c7851ebc6/assets/reference/owner_2026-09-11_ps1_visual_target/MINIMUM_QUALITY_LINE.png
          curl -L --fail --retry 3 -o .m04-p03/TARGET_PS1_FINAL.png https://raw.githubusercontent.com/nisiyasu/-luke-quest/eb6ec9fafc053b6dbabb6ee473932b7c7851ebc6/assets/reference/owner_2026-09-11_ps1_visual_target/TARGET_PS1_FINAL.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m04-p03-bridge-evidence
          path: .m04-p03
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
