name: M04 Hybrid Forest Quality Performance v64

on:
  push:
    branches: ["prototype/modern-3d"]
    paths:
      - ".github/workflows/m04-v64-hybrid-forest.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 0
      - name: Restore lightweight background forest while keeping target foreground
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('prototypes/modern-3d/index.html')
          s=p.read_text()
          s=s.replace("const targetTreeIndices=new Set([0,1,3,4,6,7,9,10,12,14,15,17,18,20,21,24]);","const backgroundNaturalIndices=new Set([2,5,11,13,19,22,23,25]);")
          new_loop="for(let i=0;i<trees.length;i++){const [x,z,s,seed]=trees[i];const scaleJitter=.86+(seed%7)*.026;const px=x+((seed%7)-3)*.10,pz=z+((seed%11)-5)*.065;const background=backgroundNaturalIndices.has(i);const t=background?createNaturalConifer({seed,scale:s*(.91+(seed%4)*.025)}):createTargetConiferV31({seed,scale:s*scaleJitter});t.position.set(px,terrainY(px,pz),pz);scene.add(t);if(!background&&i%2===0){const f=createTargetFernPatch({seed:9000+seed,scale:.78+(seed%4)*.045,count:18+(seed%4)*3});f.position.set(px+((seed%5)-2)*.22,terrainY(px,pz)+.03,pz+.42+((seed%3)-1)*.18);scene.add(f)}}"
          s,n=re.subn(r"for\(let i=0;i<trees\.length;i\+\+\)\{const \[x,z,s,seed\]=trees\[i\];const scaleJitter=.*?\}\}",new_loop,s,count=1)
          if n!=1: raise SystemExit('v63 forest loop replacement failed')
          s=s.replace("targetConifers:trees.length+destinationTrees.length+southRightFrameTrees.length","targetConifers:trees.length-backgroundNaturalIndices.size+destinationTrees.length+southRightFrameTrees.length+3")
          p.write_text(s)
          PY
          git diff --check
          grep -q 'backgroundNaturalIndices' prototypes/modern-3d/index.html
          grep -q 'createNaturalConifer' prototypes/modern-3d/index.html
      - name: Commit v64 repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototypes/modern-3d/index.html
          git commit -m "fix(m04): hybridize distant forest after v63 capture regression [m04-v64]"
          git push origin HEAD:prototype/modern-3d
