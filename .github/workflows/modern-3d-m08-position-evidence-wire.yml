name: Modern 3D M08 Position Evidence Wire

on:
  push:
    branches: [prototype/modern-3d]
    paths:
      - '.github/workflows/modern-3d-m08-position-evidence-wire.yml'

permissions:
  contents: write

jobs:
  wire-position-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 1
      - name: Expose live player position for evidence only
        shell: python
        run: |
          from pathlib import Path
          p=Path('prototypes/modern-3d/index.html')
          s=p.read_text()
          old="function syncState(){window.LQ_MODERN_3D_M05.player=[+player.position.x.toFixed(3),+player.position.z.toFixed(3)];window.LQ_MODERN_3D_M05.activeInputs=activeDirs().length;window.LQ_MODERN_3D_M05.blockedWater=blockedWater;window.LQ_MODERN_3D_M05.blockedBounds=blockedBounds}"
          new="function syncState(){window.LQ_MODERN_3D_M05.player=[+player.position.x.toFixed(3),+player.position.z.toFixed(3)];document.documentElement.dataset.m08Player=`${player.position.x.toFixed(3)},${player.position.y.toFixed(3)},${player.position.z.toFixed(3)}`;window.LQ_MODERN_3D_M05.activeInputs=activeDirs().length;window.LQ_MODERN_3D_M05.blockedWater=blockedWater;window.LQ_MODERN_3D_M05.blockedBounds=blockedBounds}"
          count=s.count(old)
          if count!=1: raise SystemExit(f'expected one syncState, found {count}')
          p.write_text(s.replace(old,new))
      - name: Verify position evidence boundary
        run: |
          git diff --check
          grep -F 'dataset.m08Player=' prototypes/modern-3d/index.html
          git diff -- prototypes/modern-3d/index.html
      - name: Commit position evidence surface
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototypes/modern-3d/index.html
          git diff --cached --quiet && exit 1
          git commit -m 'test(modern-3d): expose live M08 player position evidence'
          git push origin HEAD:prototype/modern-3d
