name: REQ-127 Resume Regression Patch

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/req127-resume-regression-patch.yml"

permissions:
  contents: write

concurrency:
  group: req127-resume-regression-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Page Lifecycle resume recovery proof and self-clean
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('addons/zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz-req127-render-smoke.js')
          s=p.read_text()
          old="if(heal.presentationOnly!==true||heal.gameplayStateMutation!==false||heal.saveSchemaChange!==false||heal.frozenArrivalCleanup!==true||heal.focusRecovery!==true||heal.lateDomRetryRecovery!==true){"
          new="if(heal.presentationOnly!==true||heal.gameplayStateMutation!==false||heal.saveSchemaChange!==false||heal.frozenArrivalCleanup!==true||heal.focusRecovery!==true||heal.pageLifecycleResumeRecovery!==true||heal.lateDomRetryRecovery!==true){"
          if s.count(old)!=1: raise SystemExit(f'contract anchor count={s.count(old)}')
          s=s.replace(old,new,1)
          anchor="      // Diagnostic contract: detect a genuinely full-screen near-black occluder without\n"
          if s.count(anchor)!=1: raise SystemExit(f'diagnostic anchor count={s.count(anchor)}')
          block="""      poisonPresentation(shell,world);\n      const countBeforeResume=heal.healCount;\n      window.dispatchEvent(new Event('resume'));\n      await waitFrames(4);\n\n      shell=document.querySelector('.gameShell');\n      world=shell?.querySelector('.world')||document.querySelector('.world');\n      player=world?.querySelector('.player')||document.querySelector('.player');\n      tiles=world?.querySelectorAll('.tile')||[];\n      healMarker=document.getElementById('lqReq127ResumeWorldHealMarker');\n      const resumeSizeReasserted=Math.abs((world?.offsetWidth||0)-expectedWidth)<1&&Math.abs((world?.offsetHeight||0)-expectedHeight)<1;\n      const resumeRecovered=heal.healCount>countBeforeResume&&visible(shell)&&visible(world)&&visible(player)&&tiles.length>0&&resumeSizeReasserted&&!document.getElementById('lq-map-transition-fade')&&!shell?.classList.contains('lqMapArrive');\n      const resumeReason=String(heal.lastReason||'');\n      const resumeMarkerReason=String(healMarker?.dataset.reason||'');\n      const resumeMarkerConfirmed=!!healMarker&&healMarker.dataset.status==='PASS'&&resumeMarkerReason.startsWith('page-lifecycle-resume')&&healMarker.dataset.fadeCleared==='true'&&healMarker.dataset.arrivalCleared==='true'&&healMarker.dataset.shellVisible==='true';\n      const resumeLogicalStateUnchanged=before.screen===s.screen&&before.map===s.map&&before.x===s.x&&before.y===s.y&&before.dir===s.dir;\n      if(!resumeRecovered)throw new Error(`REQ-127 Page Lifecycle resume recovery failed: count ${countBeforeResume}->${heal.healCount}, reason=${resumeReason}, marker=${resumeMarkerReason}`);\n      if(!resumeReason.startsWith('page-lifecycle-resume'))throw new Error(`REQ-127 resume listener did not own recovery: ${resumeReason}`);\n      if(!resumeMarkerConfirmed)throw new Error(`REQ-127 resume marker did not confirm recovery: ${resumeMarkerReason}`);\n      if(!resumeLogicalStateUnchanged)throw new Error('REQ-127 Page Lifecycle resume recovery mutated logical gameplay state');\n\n"""
          s=s.replace(anchor,block+anchor,1)
          old_marker="      el.dataset.lateDomRetryRecovery=String(lateDomRecovered&&lateDomMarkerConfirmed&&lateDomLogicalStateUnchanged);\n"
          new_marker=old_marker+"      el.dataset.pageLifecycleResumeRecovery=String(resumeRecovered&&resumeMarkerConfirmed&&resumeLogicalStateUnchanged);\n"
          if s.count(old_marker)!=1: raise SystemExit(f'marker anchor count={s.count(old_marker)}')
          s=s.replace(old_marker,new_marker,1)
          p.write_text(s)
          PY
          rm -f .github/workflows/req127-resume-regression-patch.yml
          git config user.name "LUKE QUEST autonomous repair"
          git config user.email "actions@users.noreply.github.com"
          git add addons/zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz-req127-render-smoke.js .github/workflows/req127-resume-regression-patch.yml
          git commit -m "test: prove REQ-127 Page Lifecycle resume recovery"
          git push origin HEAD:main
