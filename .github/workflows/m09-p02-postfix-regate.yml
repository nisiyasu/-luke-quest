name: M09-P02 Postfix Regate
# re-entry exact-head gate after M09-P01 landscape repair
# adversarially hardened after prior panel-bounds check missed clipped objective text

on:
  push:
    branches: ["prototype/modern-3d"]
    paths:
      - ".github/workflows/m09-p02-postfix-regate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 8140 --directory prototypes/modern-3d >/tmp/m09-p02-post.log 2>&1 &
          sleep 2
      - name: Verify rendered HUD on portrait and landscape
        run: |
          mkdir -p .m09-p02-post
          cat > verify.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const inside=(b,w,h)=>b&&b.x>=-1&&b.y>=-1&&b.x+b.width<=w+1&&b.y+b.height<=h+1;
          const insideBox=(child,parent)=>child&&parent&&child.x>=parent.x-1&&child.y>=parent.y-1&&child.x+child.width<=parent.x+parent.width+1&&child.y+child.height<=parent.y+parent.height+1;
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
            const out=[];
            try{
              for(const s of [{n:'portrait',w:390,h:844},{n:'landscape',w:844,h:390}]){
                const p=await browser.newPage({viewport:{width:s.w,height:s.h},deviceScaleFactor:1,hasTouch:true,isMobile:true});
                const errs=[];p.on('pageerror',e=>errs.push(String(e)));
                await p.goto('http://127.0.0.1:8140/index.html?quality=high',{waitUntil:'domcontentloaded',timeout:150000});
                await p.waitForFunction(()=>document.documentElement.dataset.lqModern3d==='m05-ready'&&document.documentElement.dataset.m09OwnerHud==='pass',{timeout:150000});
                await p.waitForTimeout(1000);
                if(errs.length)throw new Error(`${s.n} page errors ${JSON.stringify(errs)}`);
                const d=await p.evaluate(()=>{
                  const b=q=>{const e=document.querySelector(q);if(!e)return null;const r=e.getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height,text:(e.innerText||'').trim(),scrollWidth:e.scrollWidth,clientWidth:e.clientWidth,scrollHeight:e.scrollHeight,clientHeight:e.clientHeight}};
                  return{body:(document.body.innerText||'').trim(),status:b('#status'),objective:b('.objective'),objectiveText:b('.objective b'),objectiveSmall:b('.objective small'),dpad:b('.dpad'),hint:b('#hint'),statusHtml:document.querySelector('#status')?.outerHTML||'',camera:document.documentElement.dataset.m03CameraProfile||'UNKNOWN'};
                });
                const lines=d.body.toUpperCase().split(/\n+/).map(x=>x.trim()).filter(Boolean);
                if(lines.includes('HP')||d.statusHtml.includes('hud-hp-row')||d.statusHtml.includes('hud-hp-track'))throw new Error(`${s.n} fake HP remains ${d.statusHtml}`);
                if(['DISPLAY SAMPLE','DEMO HUD','3D PROTOTYPE'].some(x=>d.body.toUpperCase().includes(x)))throw new Error(`${s.n} prototype residue remains`);
                for(const [k,b] of [['status',d.status],['objective',d.objective],['dpad',d.dpad],['hint',d.hint]])if(!inside(b,s.w,s.h))throw new Error(`${s.n} ${k} clipped ${JSON.stringify(b)}`);
                if(!insideBox(d.objectiveText,d.objective)||!insideBox(d.objectiveSmall,d.objective))throw new Error(`${s.n} objective text escapes panel ${JSON.stringify({objective:d.objective,objectiveText:d.objectiveText,objectiveSmall:d.objectiveSmall})}`);
                if(d.objective.scrollWidth>d.objective.clientWidth+1||d.objective.scrollHeight>d.objective.clientHeight+1)throw new Error(`${s.n} objective content overflow ${JSON.stringify(d.objective)}`);
                await p.screenshot({path:`.m09-p02-post/${s.n}.png`,timeout:150000});
                out.push(`${s.n} fake_hp=NONE clipping=NONE text_overflow=NONE camera=${d.camera} body=${JSON.stringify(d.body)}`);
                await p.close();
              }
              out.push(`head=${process.env.GITHUB_SHA||'UNKNOWN'} RESULT=PASS`);fs.writeFileSync('.m09-p02-post/audit.txt',out.join('\n')+'\n');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node verify.cjs
      - name: Add references
        if: always()
        run: |
          curl -L --fail --retry 3 -o .m09-p02-post/MINIMUM_QUALITY_LINE.png https://raw.githubusercontent.com/nisiyasu/-luke-quest/eb6ec9fafc053b6dbabb6ee473932b7c7851ebc6/assets/reference/owner_2026-09-11_ps1_visual_target/MINIMUM_QUALITY_LINE.png
          curl -L --fail --retry 3 -o .m09-p02-post/TARGET_PS1_FINAL.png https://raw.githubusercontent.com/nisiyasu/-luke-quest/eb6ec9fafc053b6dbabb6ee473932b7c7851ebc6/assets/reference/owner_2026-09-11_ps1_visual_target/TARGET_PS1_FINAL.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m09-p02-postfix-regate
          path: .m09-p02-post
          include-hidden-files: true
          retention-days: 14