name: M06-P01 One Shot Terrain Bridge Clearance Repair

on:
  push:
    branches:
      - prototype/modern-3d
    paths:
      - .ci/m06-p01-clearance-repair-trigger.txt

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering branch
        uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 0

      - name: Apply exact M06-P01 secondary bridge clearance repair
        shell: python
        run: |
          from pathlib import Path

          path = Path('prototypes/modern-3d/index.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "const bridgeRight=bridgeAt(3.25,-7.0,Math.PI/2-.16,false);bridgeRight.position.y=.72;bank(880,2.5,2.7,.35,1.02,-7.0,1,.05);bank(887,2.8,2.9,6.20,1.48,-7.1,1,-.04);",
                  "const bridgeRight=bridgeAt(3.25,-7.0,Math.PI/2-.16,false);bridgeRight.position.y=.72;\n// M06-P01 secondary-bridge-clearance-v1: terrain banks receive the bridge outside the timber span instead of occupying its deck.\nbank(880,2.35,2.35,-1.42,1.02,-7.29,1,.05);bank(887,2.45,2.40,7.98,1.12,-6.82,1,-.04);"
              ),
              (
                  "const destinationTrees=[[-7.1,-8.3,.88,1701],[-6.0,-5.9,.82,1703],[-5.4,-9.5,.86,1709],[4.7,-7.5,.84,1721],[6.0,-9.5,.92,1723],[4.8,-11.0,.78,1733]];",
                  "const destinationTrees=[[-7.1,-8.3,.88,1701],[-6.0,-5.9,.82,1703],[-5.4,-9.5,.86,1709],[6.0,-9.5,.92,1723],[4.8,-11.0,.78,1733]];"
              ),
              (
                  "const corridorFerns=[[-5.2,-2.5,2601],[-4.8,-4.2,2603],[-3.9,-6.0,2609],[1.6,-5.4,2617],[2.6,-7.2,2621],[3.4,-9.8,2633]];",
                  "const corridorFerns=[[-5.2,-2.5,2601],[-4.8,-4.2,2603],[-3.9,-6.0,2609],[3.4,-9.8,2633]];"
              ),
              (
                  "const rocks=[[-8,-5,1.25,201],[-6,-9,1.05,203],[-9,2,1.3,211],[-7,8,1.12,223],[-5,12,1.0,227],[6,-8,1.18,229],[8,-4,1.32,233],[7,5,1.18,239],[8,10,1.3,241],[3,-5,1.0,251],[4,8,1.05,257],[-5.1,-2.7,.92,271],[-4.0,-4.6,.78,277],[2.2,-6.1,.84,281],[3.1,-8.4,.90,283],[-5.8,-1.3,.82,293],[-4.6,-.6,.66,307],[-3.7,-2.0,.72,311]];",
                  "const rocks=[[-8,-5,1.25,201],[-6,-9,1.05,203],[-9,2,1.3,211],[-7,8,1.12,223],[-5,12,1.0,227],[6,-8,1.18,229],[8,-4,1.32,233],[7,5,1.18,239],[8,10,1.3,241],[4,8,1.05,257],[-5.1,-2.7,.92,271],[-4.0,-4.6,.78,277],[-5.8,-1.3,.82,293],[-4.6,-.6,.66,307],[-3.7,-2.0,.72,311]];"
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'FAIL_CLOSED replacement count={count}: {old[:90]}')
              text = text.replace(old, new, 1)

          marker = "document.documentElement.dataset.m06SecondaryBridgeClearance='terrain-free-v1';"
          anchor = "const pathMat=new THREE.MeshStandardMaterial({color:0x8d7548,roughness:.98,metalness:0});"
          if marker not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('FAIL_CLOSED anchor mismatch for clearance marker')
              text = text.replace(anchor, marker + "\n" + anchor, 1)

          path.write_text(text, encoding='utf-8')

      - name: Validate deterministic edit
        run: |
          git diff --check
          grep -F "m06SecondaryBridgeClearance='terrain-free-v1'" prototypes/modern-3d/index.html
          grep -F "bank(880,2.35,2.35,-1.42,1.02,-7.29" prototypes/modern-3d/index.html
          if grep -F "[4.7,-7.5,.84,1721]" prototypes/modern-3d/index.html; then exit 1; fi
          if grep -F "[2.6,-7.2,2621]" prototypes/modern-3d/index.html; then exit 1; fi
          if grep -F "[2.2,-6.1,.84,281]" prototypes/modern-3d/index.html; then exit 1; fi

      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No repair diff produced"
            exit 1
          fi
          git config user.name "luke-quest-autonomous"
          git config user.email "actions@users.noreply.github.com"
          git add prototypes/modern-3d/index.html
          git commit -m "fix(m06-p01): clear terrain from secondary bridge deck"
          git push origin HEAD:prototype/modern-3d
