name: M06-P01 One Shot Terrain Bridge Clearance Repair

on:
  push:
    branches:
      - prototype/modern-3d
    paths:
      - .ci/m06-p01-clearance-repair-trigger.txt

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering branch
        uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 0

      - name: Apply exact M06-P01 secondary bridge clearance repair v3
        shell: python
        run: |
          from pathlib import Path

          path = Path('prototypes/modern-3d/index.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "bank(533,6.8,9.0,9.8,1.55,-11.4,1,-Math.PI/2);",
                  "// M06-P01 secondary-bridge-clearance-v3: keep the north-east terrain mass outside the full rotated bridge endpoint/abutment envelope.\nbank(533,5.8,7.0,10.8,1.55,-12.2,1,-Math.PI/2);"
              ),
              (
                  "const corridorFerns=[[-5.2,-2.5,2601],[-4.8,-4.2,2603],[-3.9,-6.0,2609],[3.4,-9.8,2633]];",
                  "const corridorFerns=[[-5.2,-2.5,2601],[-4.8,-4.2,2603],[-3.9,-6.0,2609]];"
              ),
              (
                  "document.documentElement.dataset.m06SecondaryBridgeClearance='terrain-free-v2';",
                  "document.documentElement.dataset.m06SecondaryBridgeClearance='terrain-free-v3';"
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'FAIL_CLOSED replacement count={count}: {old[:120]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Validate deterministic edit
        run: |
          git diff --check
          grep -F "m06SecondaryBridgeClearance='terrain-free-v3'" prototypes/modern-3d/index.html
          grep -F "bank(533,5.8,7.0,10.8,1.55,-12.2" prototypes/modern-3d/index.html
          if grep -F "[3.4,-9.8,2633]" prototypes/modern-3d/index.html; then exit 1; fi
          if grep -F "[6,-8,1.18,229]" prototypes/modern-3d/index.html; then exit 1; fi

      - name: Package exact patched index
        run: |
          mkdir -p .m06-p01-v3
          cp prototypes/modern-3d/index.html .m06-p01-v3/index.html
          git diff -- prototypes/modern-3d/index.html > .m06-p01-v3/index.patch
          sha256sum .m06-p01-v3/index.html > .m06-p01-v3/index.sha256
          wc -c .m06-p01-v3/index.html > .m06-p01-v3/index.bytes

      - uses: actions/upload-artifact@v4
        with:
          name: m06-p01-secondary-clearance-v3-patched-index
          path: .m06-p01-v3
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
