name: M06-P01 One Shot Terrain Bridge Clearance Repair

on:
  push:
    branches:
      - prototype/modern-3d
    paths:
      - .ci/m06-p01-clearance-repair-trigger.txt

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering branch
        uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 0

      - name: Apply exact M06-P01 secondary bridge clearance repair v2
        shell: python
        run: |
          from pathlib import Path

          path = Path('prototypes/modern-3d/index.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "// M06-P01 secondary-bridge-clearance-v1: terrain banks receive the bridge outside the timber span instead of occupying its deck.\nbank(880,2.35,2.35,-1.42,1.02,-7.29,1,.05);bank(887,2.45,2.40,7.98,1.12,-6.82,1,-.04);\ndocument.documentElement.dataset.m06SecondaryBridgeClearance='terrain-free-v1';",
                  "// M06-P01 secondary-bridge-clearance-v2: pull receiving terrain fully outside the rotated production bridge deck/abutment envelope.\nbank(880,1.80,1.85,-2.30,.92,-7.34,1,.05);bank(887,1.90,1.90,8.82,1.00,-6.76,1,-.04);\ndocument.documentElement.dataset.m06SecondaryBridgeClearance='terrain-free-v2';"
              ),
              (
                  "const rocks=[[-8,-5,1.25,201],[-6,-9,1.05,203],[-9,2,1.3,211],[-7,8,1.12,223],[-5,12,1.0,227],[6,-8,1.18,229],[8,-4,1.32,233],[7,5,1.18,239],[8,10,1.3,241],[4,8,1.05,257],[-5.1,-2.7,.92,271],[-4.0,-4.6,.78,277],[-5.8,-1.3,.82,293],[-4.6,-.6,.66,307],[-3.7,-2.0,.72,311]];",
                  "const rocks=[[-8,-5,1.25,201],[-6,-9,1.05,203],[-9,2,1.3,211],[-7,8,1.12,223],[-5,12,1.0,227],[8,-4,1.32,233],[7,5,1.18,239],[8,10,1.3,241],[4,8,1.05,257],[-5.1,-2.7,.92,271],[-4.0,-4.6,.78,277],[-5.8,-1.3,.82,293],[-4.6,-.6,.66,307],[-3.7,-2.0,.72,311]];"
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'FAIL_CLOSED replacement count={count}: {old[:110]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Validate deterministic edit
        run: |
          git diff --check
          grep -F "m06SecondaryBridgeClearance='terrain-free-v2'" prototypes/modern-3d/index.html
          grep -F "bank(880,1.80,1.85,-2.30,.92,-7.34" prototypes/modern-3d/index.html
          grep -F "bank(887,1.90,1.90,8.82,1.00,-6.76" prototypes/modern-3d/index.html
          if grep -F "[6,-8,1.18,229]" prototypes/modern-3d/index.html; then exit 1; fi

      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No repair diff produced"
            exit 1
          fi
          git config user.name "luke-quest-autonomous"
          git config user.email "actions@users.noreply.github.com"
          git add prototypes/modern-3d/index.html
          git commit -m "fix(m06-p01): clear remaining secondary bridge terrain"
          git push origin HEAD:prototype/modern-3d
