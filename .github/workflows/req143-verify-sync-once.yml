name: REQ-143 Verify Sync Once

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/req143-verify-sync-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync REQ-143 queue and CURRENT to verified reality
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          req = Path('requirements/REQ-143_GAME_QUALITY_SYSTEM_AND_LEON_GOLD_STANDARD.md')
          q = Path('WORK_QUEUE.md')
          cur = Path('CURRENT.md')

          rt = req.read_text()
          old = '- STATUS: `IN_PROGRESS`'
          if rt.count(old) != 1:
              raise SystemExit(f'REQ-143 status mismatch: {rt.count(old)}')
          rt = rt.replace(old, '- STATUS: `VERIFY`', 1)
          req.write_text(rt)

          qt = q.read_text()
          pat = re.compile(r'^\| 125 \| REQ-143 \| P0 \| IN_PROGRESS \| Game Quality System / Leon Gold Standard Scene Rebuild \| `requirements/REQ-143_GAME_QUALITY_SYSTEM_AND_LEON_GOLD_STANDARD\.md` \|.*\|$', re.M)
          repl = '| 125 | REQ-143 | P0 | VERIFY | Game Quality System / Leon Gold Standard Scene Rebuild | `requirements/REQ-143_GAME_QUALITY_SYSTEM_AND_LEON_GOLD_STANDARD.md` | Quality System v1 + Leon Q5 candidate machine/public verification complete. Gold Standard gate contract aligned with intentional production metadata removal; exact-head `6af1192...`: REQ-143 Quality 34257265355 SUCCESS, P0 Touch 34257265527 SUCCESS, Pages 34257265365 SUCCESS, Render Liveness 34257265711 SUCCESS. OWNER_EXPERIENCE_PASS=PENDING; IOS_PHYSICAL_VERIFICATION=PENDING. |'
          qt2, n = pat.subn(repl, qt)
          if n != 1:
              raise SystemExit(f'WORK_QUEUE REQ-143 row mismatch: {n}')
          q.write_text(qt2)

          ct = cur.read_text()
          replacements = {
            r'^- UPDATED_AT: `[^`]+`$': '- UPDATED_AT: `2026-09-09 02:31 JST`',
            r'^- LATEST_IMPLEMENTATION_COMMIT_SHA: `[^`]+`$': '- LATEST_IMPLEMENTATION_COMMIT_SHA: `6af1192ef4531e6bf903761b22fba1067eac2b16`',
            r'^- LATEST_VERIFIED_RUNTIME_HEAD_SHA: `[^`]+`$': '- LATEST_VERIFIED_RUNTIME_HEAD_SHA: `6af1192ef4531e6bf903761b22fba1067eac2b16`',
            r'^- CURRENT_BUILD_STATUS: `[^`]+`$': '- CURRENT_BUILD_STATUS: `REQ-143 VERIFY candidate. Root red-gate cause was a CI contract contradiction: production-polish intentionally removes internal quality metadata while the old Gold Standard gate required it in DOM. Gate repaired to verify production DOM cleanup + canonical diagnostic API. Exact-head 6af1192: REQ-143 Quality 34257265355 SUCCESS; P0 Touch 34257265527 SUCCESS; Pages 34257265365 SUCCESS; Render Liveness 34257265711 SUCCESS. OWNER_EXPERIENCE_PASS=PENDING; IOS_PHYSICAL_VERIFICATION=PENDING.`',
            r'^- ACTIVE_REQUIREMENT_ID: `REQ-143`$': '- ACTIVE_REQUIREMENT_ID: `NONE`',
            r'^- ACTIVE_REQUIREMENT_PATH: `requirements/REQ-143_GAME_QUALITY_SYSTEM_AND_LEON_GOLD_STANDARD\.md`$': '- ACTIVE_REQUIREMENT_PATH: `NONE`',
            r'^- BLOCKERS: `[^`]+`$': '- BLOCKERS: `No machine/public hard blocker. REQ-143 subjective Owner experience and physical iPhone confirmation remain PENDING. Queue has no READY requirement after REQ-143 VERIFY; remaining formal-art BACKLOG items require Owner-only asset/design decisions, so autonomous work must select only a newly evidenced safe player-visible gap.`',
            r'^- NEXT_ACTION: `[^`]+`$': '- NEXT_ACTION: `Fresh-audit the current public Chapter 1 experience for the highest-value evidenced player-visible quality gap. If a concrete gap exists, register one directive-authorized requirement under WIP=1 and execute it without changing protected canon/input/save authority.`',
            r'^- NEXT_ACTION_COMPLETION_CONDITION: `[^`]+`$': '- NEXT_ACTION_COMPLETION_CONDITION: `A concrete current player-visible defect/gap is evidenced from fresh HEAD/public behavior, formally queued with acceptance criteria, and implementation begins; do not manufacture a requirement solely to keep numbering moving.`'
          }
          for patn, repln in replacements.items():
              ct2, n = re.subn(patn, repln, ct, count=1, flags=re.M)
              if n != 1:
                  raise SystemExit(f'CURRENT top-level mismatch for {patn}: {n}')
              ct = ct2

          section_pat = re.compile(r'(## REQ-143 GAME QUALITY SYSTEM / LEON GOLD STANDARD\n\n)(.*?)(\n## P0 INPUT / FULLSCREEN PROTECTION)', re.S)
          m = section_pat.search(ct)
          if not m:
              raise SystemExit('CURRENT REQ-143 section missing')
          sec = m.group(2)
          sec = re.sub(r'^- STATUS: `IN_PROGRESS`$', '- STATUS: `VERIFY`', sec, count=1, flags=re.M)
          sec = re.sub(r'^- CURRENT_GAP: `[^`]+`$', '- CURRENT_GAP: `Machine/public gate contradiction repaired. Production DOM intentionally contains no developer quality metadata; internal beat contract remains testable through LQ_REQ143_TEST. Subjective Owner experience remains unverified.`', sec, count=1, flags=re.M)
          sec = re.sub(r'^- NEXT: `[^`]+`$', '- NEXT: `Owner experience / physical iPhone review remains PENDING. Autonomous loop continues independently on the next evidenced safe player-visible gap.`', sec, count=1, flags=re.M)
          ct = ct[:m.start(2)] + sec + ct[m.end(2):]
          cur.write_text(ct)
          PY

      - name: Commit synced state and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'LUKE QUEST Autonomous Sync'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/req143-verify-sync-once.yml
          git add requirements/REQ-143_GAME_QUALITY_SYSTEM_AND_LEON_GOLD_STANDARD.md WORK_QUEUE.md CURRENT.md .github/workflows/req143-verify-sync-once.yml
          git diff --cached --check
          git commit -m 'REQ-143: sync VERIFY checkpoint'
          git push origin HEAD:main
