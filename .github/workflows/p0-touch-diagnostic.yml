name: P0 Touch Diagnostic

on:
  push:
    paths:
      - '.github/workflows/p0-touch-diagnostic.yml'
      - 'addons/floating-touch-controller.js'
      - 'addons/zzz-floating-touch-smoke.js'
      - 'addons/zzzz-visibility-touch-regression.js'
      - 'addons/zzzzzz-req021-long-press-smoke.js'
      - 'addons/zzzzzzz-req001-multitouch-smoke.js'
      - 'addons/zzzzzzzz-p0-touch-sequence-guard.js'
      - 'addons/zzzzzzzzzz-req001-visual-viewport-offset-smoke.js'
      - 'addons/zzzz-iphone-fullscreen-world-ui.js'
      - 'addons/zzzzzzzzzzzzzz-req139-world-dialogue-tap-hint.js'
      - 'addons/zzzzzzzzzzzzzzz-req139-world-dialogue-tap-hint-smoke.js'
      - 'addons/zzzzzzzzzzzzzzzzzzzz-req140-iphone-compositor-budget.js'
      - 'addons/zzzzzzzzzzzzzzzzzzzz-req140-pwa-save-rescue.js'
      - 'requirements/REQ-140_IPHONE_COMPOSITOR_BLACK_SCREEN_RECOVERY.md'
      - 'addons/zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz-req142-adventure-memo-controls.js'
      - 'requirements/REQ-142_ADVENTURE_MEMO_MODERN_CONTROLS_HINT.md'
      - 'addons/zzzzzzzzzzzzzzzzzzzzzzzz-req143-leon-gold-standard.js'
      - 'addons/zzzzzzzzzzzzzzzzzzzzzzzzzz-req143-production-cleanup.js'
      - 'addons/zzzzzzzzzzzzzzzzzzzzzzzzzz-req143-production-polish.js'
      - 'addons/zzzzzzzzzzzzzzzzzzzzzzzzzzz-req143-original-stage-art.js'
      - 'assets/req143/leon-stage.svg'
      - 'assets/req143/leon-sister-stage.svg'
      - 'requirements/REQ-143_GAME_QUALITY_SYSTEM_AND_LEON_GOLD_STANDARD.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble public injection order
        run: |
          echo 'P0 re-audit checkpoint'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          html=p.read_text()
          marker='<div id="app"></div><script>'
          guard='<div id="app"></div><script src="prelude/autosave-bootstrap-guard.js"></script><script>'
          if html.count(marker)!=1: raise SystemExit('base marker mismatch')
          p.write_text(html.replace(marker,guard,1))
          PY
          mapfile -t patches < <(printf '%s\n' ux-v*.js | sort -V)
          for f in "${patches[@]}"; do sed -i "s#</body>#<script src=\"$f\"></script></body>#" index.html; done
          if compgen -G 'addons/*.js' > /dev/null; then
            for f in addons/*.js; do sed -i "s#</body>#<script src=\"$f\"></script></body>#" index.html; done
          fi
          cp index.html /tmp/lq-touch-index-full.html

      - name: Run serialized core browser probe
        run: |
          cp /tmp/lq-touch-index-full.html index.html
          sed -i 's#<script src="addons/zzzzzzzzzz-req001-visual-viewport-offset-smoke.js"></script>##g' index.html
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$BROWSER"
          python3 -m http.server 8124 >/tmp/lq-touch-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          timeout 30 "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --disable-extensions --disable-sync --no-first-run --window-size=390,844 --virtual-time-budget=5200 --dump-dom 'http://127.0.0.1:8124/?lqTouchSmoke=1' >/tmp/lq-touch-dom.html 2>/tmp/lq-touch-chrome.log || true
          grep -o '<i id="lqFloatingTouchRuntimeSmokeMarker"[^>]*>' /tmp/lq-touch-dom.html || true
          grep -o '<i id="lqVisibilityTouchSmokeMarker"[^>]*>' /tmp/lq-touch-dom.html || true
          grep -o '<i id="lqReq021LongPressSmokeMarker"[^>]*>' /tmp/lq-touch-dom.html || true
          grep -o '<i id="lqReq001MultitouchSmokeMarker"[^>]*>' /tmp/lq-touch-dom.html || true
          grep -o '<i id="lqP0TouchSequenceGuardMarker"[^>]*>' /tmp/lq-touch-dom.html || true
          grep -o '<i id="lqFloatingTouchSmokeFailure"[^>]*>' /tmp/lq-touch-dom.html || true

      - name: Gate REQ-021 tap and canonical action
        if: always()
        run: |
          grep -q 'data-tap-action="true"' /tmp/lq-touch-dom.html
          grep -q 'data-dialog-close="true"' /tmp/lq-touch-dom.html
          grep -q 'data-single-fire="true"' /tmp/lq-touch-dom.html
          grep -q 'data-ui-excluded="true"' /tmp/lq-touch-dom.html

      - name: Gate tap versus drag arbitration
        if: always()
        run: |
          grep -q 'data-dialog-drag-no-action="true"' /tmp/lq-touch-dom.html
          grep -q 'data-drag-no-action="true"' /tmp/lq-touch-dom.html
          grep -q 'data-cancel-no-action="true"' /tmp/lq-touch-dom.html
          grep -q 'data-dialogue-start-no-action="true"' /tmp/lq-touch-dom.html

      - name: Gate movement transition stops
        if: always()
        run: |
          grep -q 'data-map-transition-stops="true"' /tmp/lq-touch-dom.html
          grep -q 'data-battle-transition-stops="true"' /tmp/lq-touch-dom.html

      - name: Gate long press safety
        if: always()
        run: |
          grep -q 'data-no-action="true"' /tmp/lq-touch-dom.html
          grep -q 'data-no-move="true"' /tmp/lq-touch-dom.html

      - name: Gate multitouch ownership
        if: always()
        run: |
          grep -q 'data-secondary-ignored="true"' /tmp/lq-touch-dom.html
          grep -q 'data-primary-owns="true"' /tmp/lq-touch-dom.html
          grep -q 'data-cleaned="true"' /tmp/lq-touch-dom.html

      - name: Gate serialized safety chain
        if: always()
        run: |
          grep -q 'id="lqVisibilityTouchSmokeMarker"' /tmp/lq-touch-dom.html
          grep -q 'id="lqReq021LongPressSmokeMarker"' /tmp/lq-touch-dom.html
          grep -q 'id="lqReq001MultitouchSmokeMarker"' /tmp/lq-touch-dom.html
          grep -q 'id="lqP0TouchSequenceGuardMarker"[^>]*data-pass="true"' /tmp/lq-touch-dom.html

      - name: Reject core smoke failure marker
        if: always()
        run: |
          if grep -q 'lqFloatingTouchSmokeFailure' /tmp/lq-touch-dom.html; then exit 1; fi

      - name: Run isolated extended browser probe
        if: always()
        run: |
          cp /tmp/lq-touch-index-full.html index.html
          sed -i 's#<script src="addons/zzzz-visibility-touch-regression.js"></script>##g;s#<script src="addons/zzzzzz-req021-long-press-smoke.js"></script>##g;s#<script src="addons/zzzzzzz-req001-multitouch-smoke.js"></script>##g;s#<script src="addons/zzzzzzzz-p0-touch-sequence-guard.js"></script>##g' index.html
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$BROWSER"
          python3 -m http.server 8125 >/tmp/lq-touch-ext-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          timeout 30 "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --disable-extensions --disable-sync --no-first-run --window-size=390,844 --virtual-time-budget=4200 --dump-dom 'http://127.0.0.1:8125/?lqTouchSmoke=1' >/tmp/lq-touch-ext-dom.html 2>/tmp/lq-touch-chrome.log || true
          grep -o '<i id="lqReq001VisualViewportOffsetSmokeMarker"[^>]*>' /tmp/lq-touch-ext-dom.html || true
          grep -o '<i id="lqFloatingTouchSmokeFailure"[^>]*>' /tmp/lq-touch-ext-dom.html || true

      - name: Gate isolated extended viewport safety
        if: always()
        run: |
          grep -q 'id="lqReq001VisualViewportOffsetSmokeMarker"[^>]*data-pass="true"' /tmp/lq-touch-ext-dom.html
          if grep -q 'lqFloatingTouchSmokeFailure' /tmp/lq-touch-ext-dom.html; then exit 1; fi
