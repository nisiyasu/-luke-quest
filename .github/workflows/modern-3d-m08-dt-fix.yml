name: Modern 3D M08 Delta Time Fix

on:
  push:
    branches: [prototype/modern-3d]
    paths:
      - '.github/workflows/modern-3d-m08-dt-fix.yml'

permissions:
  contents: write

jobs:
  patch-m08-dt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 1
      - name: Clamp render delta to non-negative range
        shell: python
        run: |
          from pathlib import Path
          p=Path('prototypes/modern-3d/index.html')
          s=p.read_text()
          old="const dt=Math.min((now-last)/1000,.05);last=now;"
          new="const dt=Math.max(0,Math.min((now-last)/1000,.05));last=now;"
          count=s.count(old)
          if count!=1: raise SystemExit(f'expected one dt expression, found {count}')
          p.write_text(s.replace(old,new))
      - name: Verify exact delta patch
        run: |
          git diff --check
          grep -F 'const dt=Math.max(0,Math.min((now-last)/1000,.05));last=now;' prototypes/modern-3d/index.html
          if grep -F 'const dt=Math.min((now-last)/1000,.05);last=now;' prototypes/modern-3d/index.html; then exit 1; fi
          git diff -- prototypes/modern-3d/index.html
      - name: Commit M08 delta-time fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototypes/modern-3d/index.html
          git diff --cached --quiet && exit 1
          git commit -m 'fix(modern-3d): clamp M08 frame delta before movement'
          git push origin HEAD:prototype/modern-3d
