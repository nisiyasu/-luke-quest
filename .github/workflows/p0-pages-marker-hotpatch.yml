name: P0 Pages marker hotpatch

on:
  push:
    paths:
      - '.github/workflows/p0-pages-marker-hotpatch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require new P0 regression markers in Pages gate
        run: |
          echo 'Applying P0 marker enforcement to authoritative Pages gate.'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/pages.yml')
          t=p.read_text()
          old="""            'data-fallback-cleared=\"true\"' \\
            'lqFullscreenWorldRuntimeSmokeMarker' \\
"""
          new="""            'data-fallback-cleared=\"true\"' \\
            'lqReq021LongPressSmokeMarker' \\
            'data-no-action=\"true\"' \\
            'data-no-move=\"true\"' \\
            'lqReq001MultitouchSmokeMarker' \\
            'data-secondary-ignored=\"true\"' \\
            'data-primary-owns=\"true\"' \\
            'data-cleaned=\"true\"' \\
            'lqFullscreenWorldRuntimeSmokeMarker' \\
"""
          if new in t:
              print('already hardened')
          elif old in t:
              p.write_text(t.replace(old,new,1))
          else:
              raise SystemExit('touch smoke insertion marker missing')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/pages.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ci: require P0 long-press and multitouch markers in Pages gate'
          git push origin HEAD:main
