name: M04-P02 Terrain Authority Sync

on:
  push:
    branches: ["prototype/modern-3d"]
    paths:
      - ".github/workflows/m04-p02-terrain-authority-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 1
      - name: Sync bank and rock manifest authority to faceted v4.9 source
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          mp=Path('prototypes/modern-3d/ASSET_MANIFEST.json')
          data=json.loads(mp.read_text())
          data['active_target_set']['bank']='bank_target_v4@4.9.0'
          for a in data['assets']:
            if a.get('id')=='bank_target_v4':
              a['version']='4.9.0'
              a['features']=[
                'continuous irregular four-edge organic top silhouette',
                'multi-row macro-relief grass heightfield',
                '512px multi-scale forest-floor grass/soil/leaf color breakup',
                'dense instanced bank-top grass tufts with controlled variation',
                'clustered exposed-soil top patches and flower/leaf islands',
                'five staggered overlapping fractured rock terrace bands',
                'three low-poly faceted silhouette families: slab, fractured wedge, block-spire',
                'embedded cliff and shoreline toe contact',
                'broken strata ledges between rock rows',
                'fern lip, angular top stones and pebble breakup',
                'moss shelves and exposed roots'
              ]
              a['note']='v4.9 active M04-P02 source replaces the rounded-boulder family with three visibly faceted fractured silhouette families while preserving accepted M03 macro placement and collision-neutral integration.'
            if a.get('id')=='rock_cluster_v1':
              a['version']='1.2.0'
              a['features']=[
                'three visibly distinct fractured silhouette families: low slab, wedge, block-spire',
                'flat-shaded nonmetallic rock faces',
                'embedded terrain contact instead of perched rounded boulders',
                'sparse lichen caps and moss footprint',
                'angular faceted pebble breakup'
              ]
              a['note']='M04-P02 v1.2 replaces the rounded higher-subdivision cluster language with deliberately faceted production silhouettes and grounded contact.'
          mp.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')

          p=Path('prototypes/modern-3d/m04-bank-inspection.html')
          s=p.read_text()
          import re
          s=re.sub(r"document\.documentElement\.dataset\.candidateAsset='bank_target_v4@[0-9.]+'","document.documentElement.dataset.candidateAsset='bank_target_v4@4.9.0'",s)
          s=re.sub(r'bank_target_v4\.[0-9]+[^<\n]*','bank_target_v4.9 faceted slab + wedge + block-spire cliff family',s)
          p.write_text(s)
          PY
          git diff --check
          git diff -- prototypes/modern-3d/ASSET_MANIFEST.json prototypes/modern-3d/m04-bank-inspection.html
      - name: Commit authority sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototypes/modern-3d/ASSET_MANIFEST.json prototypes/modern-3d/m04-bank-inspection.html
          git diff --cached --quiet && exit 0
          git commit -m "chore(m04-p02): sync faceted terrain authority"
          git push origin HEAD:prototype/modern-3d
