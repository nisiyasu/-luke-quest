name: M03 Bridge World Continuity v54

on:
  push:
    branches: ["prototype/modern-3d"]
    paths:
      - ".github/workflows/m03-bridge-world-v54.yml"

permissions:
  contents: write

jobs:
  repair-and-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 0

      - name: Repair bridge-to-world continuity and landing massing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prototypes/modern-3d/index.html')
          s=p.read_text()
          anchor="bridgeBankSill(-4.03,1.03,7601);bridgeBankSill(6.10,-.26,7641);"
          if anchor not in s:
              raise SystemExit('bridge sill anchor missing')
          insert=r'''bridgeBankSill(-4.03,1.03,7601);bridgeBankSill(6.10,-.26,7641);
// v54 quality-regate: terrain shoulders physically/visually receive both bridge landings.
// Keep the traversal corridor open; massing lives beside and behind the deck rather than under it.
bank(771,5.3,4.8,-4.55,1.05,-4.65,1,.10);
bank(779,4.8,4.5,1.88,1.00,-4.55,1,-.10);
bank(787,5.5,4.6,-4.65,-.22,6.70,-1,.08);
bank(797,5.0,4.3,1.95,-.24,6.62,-1,-.09);
const landingFernN1=createTargetFernPatch({seed:801,count:26,radius:1.55});landingFernN1.position.set(-4.15,1.10,-4.15);scene.add(landingFernN1);
const landingFernN2=createTargetFernPatch({seed:809,count:24,radius:1.45});landingFernN2.position.set(1.45,1.08,-4.12);scene.add(landingFernN2);
const landingFernS1=createTargetFernPatch({seed:821,count:24,radius:1.50});landingFernS1.position.set(-4.10,-.14,6.30);scene.add(landingFernS1);
const landingFernS2=createTargetFernPatch({seed:827,count:22,radius:1.42});landingFernS2.position.set(1.40,-.14,6.24);scene.add(landingFernS2);
for(const [i,x,z,y,sc] of [[0,-3.82,-3.92,1.05,.48],[1,1.12,-3.94,1.03,.46],[2,-3.86,6.12,-.20,.50],[3,1.16,6.08,-.20,.47]]){const r=createRockCluster({seed:8300+i*23,scale:sc});r.position.set(x,y,z);scene.add(r);}'''
          s=s.replace(anchor,insert,1)
          # Make the bridge approach read as one authored route instead of overlapping duplicate ribbons.
          dup="pathRibbon([[-1.35,-2.0],[-2.0,-3.6],[-3.4,-5.1],[-2.7,-6.8],[-1.4,-8.5],[-2.2,-10.4]],.72,1.13);pathRibbon([[-2.2,-10.35],[-1.0,-11.2],[.2,-12.1],[1.0,-13.0]],.64,2.28);pathRibbon([[-1.35,6.0],[-.75,7.8],[-1.8,9.8],[-.55,12.0],[-1.35,15.4]],1.08,-.20);"
          if dup in s:
              s=s.replace(dup,"pathRibbon([[-2.2,-10.35],[-1.0,-11.2],[.2,-12.1],[1.0,-13.0]],.64,2.28);",1)
          s=s.replace('M03 Composition Rebuild v49','M03 Composition Rebuild v54',1)
          s=s.replace("document.documentElement.dataset.m05Variant='m03-composition-v42-wide-massing'","document.documentElement.dataset.m05Variant='m03-quality-regate-v54-bridge-world'",1)
          p.write_text(s)
          PY

      - name: Install browser evidence tooling
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Capture fresh 390x844 runtime evidence
        shell: bash
        run: |
          python3 -m http.server 8140 --directory prototypes/modern-3d > /tmp/lq-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 2
          mkdir -p prototypes/modern-3d/evidence
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8140/?quality=high',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>document.documentElement.dataset.lqModern3d==='m05-ready',{timeout:30000});
            await page.waitForTimeout(1400);
            const meta=await page.evaluate(()=>({scene:document.documentElement.dataset.lqModern3d,variant:document.documentElement.dataset.m05Variant,player:document.documentElement.dataset.m08Player}));
            if(errors.length) throw new Error(errors.join('\n'));
            await page.screenshot({path:'prototypes/modern-3d/evidence/m03-v54-390x844.png',fullPage:true});
            require('fs').writeFileSync('prototypes/modern-3d/evidence/m03-v54-runtime.json',JSON.stringify(meta,null,2));
            await browser.close();
          })();
          NODE

      - name: Commit repair and fresh evidence
        shell: bash
        run: |
          git add prototypes/modern-3d/index.html prototypes/modern-3d/evidence/m03-v54-390x844.png prototypes/modern-3d/evidence/m03-v54-runtime.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(m03): integrate bridge landings into world massing [m03-v54]"
          git push origin HEAD:prototype/modern-3d
