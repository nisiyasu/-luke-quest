name: Queue Reconcile REQ-138

on:
  push:
    paths:
      - '.github/workflows/queue-reconcile-req138.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch authoritative queue narrowly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('WORK_QUEUE.md')
          text=p.read_text()
          row="| 120 | REQ-138 | P1 | VERIFY | Battle Level-Up Summary | `requirements/REQ-138_BATTLE_LEVEL_UP_SUMMARY.md` | Canonical win() progression stays authoritative; post-victory dialogue now surfaces actual LV before→after exactly once while preserving REQ-137 reward summary. Dedicated run 34210780072 SUCCESS and exact-head Pages 34210779801 SUCCESS on `5d8fce09...`. IOS_PHYSICAL_VERIFICATION=PENDING. |"
          if '| REQ-138 |' not in text:
              marker='## STATUS DEFINITIONS'
              if text.count(marker)!=1:
                  raise SystemExit('queue status marker mismatch')
              text=text.replace(marker,row+'\n\n'+marker,1)
          elif row not in text:
              raise SystemExit('REQ-138 already exists in unexpected state; fail closed')
          if text.count('| REQ-138 |')!=1:
              raise SystemExit('REQ-138 queue cardinality violation')
          if text.count('| IN_PROGRESS |')!=0:
              raise SystemExit(f'WIP invariant unexpected after VERIFY: {text.count("| IN_PROGRESS |")}')
          p.write_text(text)
          PY
          git diff --check
          git diff -- WORK_QUEUE.md
      - name: Commit reconciled queue
        run: |
          if git diff --quiet -- WORK_QUEUE.md; then
            echo 'Queue already reconciled.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WORK_QUEUE.md
          git commit -m 'chore: register REQ-138 verify in queue'
          git push origin HEAD:main
