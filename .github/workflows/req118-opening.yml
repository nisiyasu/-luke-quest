name: REQ-118 Opening Gate

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "req118-opening"
  cancel-in-progress: true

jobs:
  checkpoint-ab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and addon contract
        run: |
          node --check addons/zzzzzzzzzzzz-req118-opening-ab.js
          node --check addons/new-game-save-overwrite-guard.js
          node --check addons/title-continue-validity.js
          node tools/lq-addon-contract.mjs
      - name: Assemble exact public script order and adversarial fixtures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          html=p.read_text()
          marker='<div id="app"></div><script>'
          guard='<div id="app"></div><script src="prelude/autosave-bootstrap-guard.js"></script><script>'
          if html.count(marker)!=1: raise SystemExit('base marker mismatch')
          html=html.replace(marker,guard,1)
          p.write_text(html)
          PY
          mapfile -t patches < <(printf '%s\n' ux-v*.js | sort -V)
          for f in "${patches[@]}"; do sed -i "s#</body>#<script src=\"$f\"></script></body>#" index.html; done
          for f in addons/*.js; do sed -i "s#</body>#<script src=\"$f\"></script></body>#" index.html; done
          cp index.html req118-guard.html
          cp index.html req118-legacy.html
          python3 - <<'PY'
          from pathlib import Path
          guard=Path('req118-guard.html')
          h=guard.read_text()
          script=r'''<script>
          setTimeout(()=>{
            const marker=document.createElement('i');marker.id='lqReq118GuardMarker';marker.hidden=true;
            try{
              const existing=structuredClone(DEFAULT);existing.screen='world';existing.map='forest';existing.x=7;existing.y=9;existing.flags={...existing.flags,leonMet:true};
              localStorage.setItem('lukeQuestV2',JSON.stringify(existing));
              Object.keys(s).forEach(k=>delete s[k]);Object.assign(s,structuredClone(existing));render();
              const rawBefore=localStorage.getItem('lukeQuestV2');const semanticBefore=JSON.stringify(s);
              const first=newGame();
              if(first!==false)throw new Error('REQ-069 first click did not block');
              if(localStorage.getItem('lukeQuestV2')!==rawBefore)throw new Error('first click changed raw save');
              if(JSON.stringify(s)!==semanticBefore)throw new Error('first click changed runtime state');
              if(document.querySelector('[data-req118-phase="cold_open"]'))throw new Error('opening leaked on first guarded click');
              newGame();
              if(s.screen!=='intro')throw new Error('confirmed new game did not reset to intro');
              if(s.flags?.req118OpeningPhase!=='cold_open')throw new Error('confirmed new game did not enter cold open');
              if(!document.querySelector('[data-req118-phase="cold_open"]'))throw new Error('cold open DOM missing after confirmation');
              marker.dataset.status='PASS';marker.dataset.firstClickPreserved='true';marker.dataset.rawSavePreserved='true';marker.dataset.confirmedColdOpen='true';
            }catch(e){marker.dataset.status='FAIL';marker.dataset.error=e?.message||String(e);console.error(e)}
            document.body.appendChild(marker);
          },5200);
          </script>'''
          h=h.replace('</body>',script+'</body>',1);guard.write_text(h)

          legacy=Path('req118-legacy.html');h=legacy.read_text()
          preload=r'''<script>
          localStorage.setItem('lukeQuestV2',JSON.stringify({screen:'world',map:'forest',x:7,y:9,dir:'up',level:3,hp:24,maxHp:30,mp:8,maxMp:10,exp:20,gold:77,herbs:2,smoke:1,atk:9,def:5,flags:{forestGate:true,leonMet:true,leonFound:false,glennMet:false,withdrew:false,returned:false},wins:{}}));
          </script>'''
          h=h.replace('<div id="app"></div>',preload+'<div id="app"></div>',1)
          probe=r'''<script>
          setTimeout(()=>{
            const marker=document.createElement('i');marker.id='lqReq118LegacyMarker';marker.hidden=true;
            try{
              if(s.screen!=='world'||s.map!=='forest'||!s.flags?.leonMet)throw new Error('advanced save did not resume in place');
              if(s.flags?.req118OpeningComplete!==true||s.flags?.req118OpeningPhase!=='legacy_bypass')throw new Error('advanced save not marked bypass');
              if(document.querySelector('[data-req118-phase="cold_open"]'))throw new Error('advanced save rewound into opening');
              if(!window.LQ_TITLE_CONTINUE_STATUS?.hasResumableStoredSave?.())throw new Error('Continue validity authority lost');
              marker.dataset.status='PASS';marker.dataset.worldPreserved='true';marker.dataset.legacyBypass='true';marker.dataset.continueValid='true';
            }catch(e){marker.dataset.status='FAIL';marker.dataset.error=e?.message||String(e);console.error(e)}
            document.body.appendChild(marker);
          },5200);
          </script>'''
          h=h.replace('</body>',probe+'</body>',1);legacy.write_text(h)
          PY
      - name: Run 390x844 A+B playable opening smoke
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"; test -n "$BROWSER"
          python3 -m http.server 8151 >/tmp/req118-http.log 2>&1 & pid=$!; trap 'kill "$pid" 2>/dev/null || true' EXIT; sleep 1
          set +e
          timeout 40 "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --disable-background-networking --disable-extensions --disable-sync --no-first-run --window-size=390,844 --virtual-time-budget=10500 --dump-dom 'http://127.0.0.1:8151/?lqReq118ABSmoke=1' >/tmp/req118-ab-dom.html 2>/tmp/req118-ab-browser.log
          status=$?;set -e;test -s /tmp/req118-ab-dom.html
          for needle in 'id="lqReq118ABMarker"' 'data-status="PASS"' 'data-cold-open="true"' 'data-playable="true"' 'data-guardian="true"' 'data-canonical-action="true"' 'data-advanced-bypass="true"' 'data-tap-authority="true"' 'data-fullscreen-authority="true"'; do grep -q "$needle" /tmp/req118-ab-dom.html || { echo "REQ-118 AB missing: $needle"; cat /tmp/req118-ab-browser.log || true; exit 1; }; done
          if grep -q 'data-status="FAIL"' /tmp/req118-ab-dom.html || grep -E 'Uncaught (ReferenceError|TypeError|SyntaxError)|ReferenceError:|SyntaxError:' /tmp/req118-ab-browser.log; then echo 'REQ-118 AB runtime failure';cat /tmp/req118-ab-browser.log;exit 1;fi
          echo "REQ-118 A+B playable smoke PASS (browser status $status)"
      - name: Run REQ-069 composition adversarial smoke
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"; test -n "$BROWSER"
          set +e
          timeout 40 "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --disable-background-networking --disable-extensions --disable-sync --no-first-run --window-size=390,844 --virtual-time-budget=10500 --dump-dom 'http://127.0.0.1:8151/req118-guard.html' >/tmp/req118-guard-dom.html 2>/tmp/req118-guard-browser.log
          status=$?;set -e;test -s /tmp/req118-guard-dom.html
          for needle in 'id="lqReq118GuardMarker"' 'data-status="PASS"' 'data-first-click-preserved="true"' 'data-raw-save-preserved="true"' 'data-confirmed-cold-open="true"'; do grep -q "$needle" /tmp/req118-guard-dom.html || { echo "REQ-118 guard missing: $needle"; grep -o 'lqReq118GuardMarker[^<]*\|data-[a-z-]*="[^"]*"' /tmp/req118-guard-dom.html | tail -80 || true;cat /tmp/req118-guard-browser.log||true;exit 1;};done
          echo "REQ-118 + REQ-069 composition PASS (browser status $status)"
      - name: Run advanced-save Continue bypass smoke
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"; test -n "$BROWSER"
          set +e
          timeout 40 "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --disable-background-networking --disable-extensions --disable-sync --no-first-run --window-size=390,844 --virtual-time-budget=10500 --dump-dom 'http://127.0.0.1:8151/req118-legacy.html' >/tmp/req118-legacy-dom.html 2>/tmp/req118-legacy-browser.log
          status=$?;set -e;test -s /tmp/req118-legacy-dom.html
          for needle in 'id="lqReq118LegacyMarker"' 'data-status="PASS"' 'data-world-preserved="true"' 'data-legacy-bypass="true"' 'data-continue-valid="true"'; do grep -q "$needle" /tmp/req118-legacy-dom.html || { echo "REQ-118 legacy missing: $needle"; grep -o 'lqReq118LegacyMarker[^<]*\|data-[a-z-]*="[^"]*"' /tmp/req118-legacy-dom.html | tail -80 || true;cat /tmp/req118-legacy-browser.log||true;exit 1;};done
          echo "REQ-118 advanced-save bypass PASS (browser status $status)"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: req118-ab-${{ github.sha }}
          path: |
            /tmp/req118-*.html
            /tmp/req118-*.log
          retention-days: 7
          if-no-files-found: warn
