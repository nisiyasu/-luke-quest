name: M07 v67 Light Runtime Audit

on:
  push:
    branches: ["prototype/modern-3d"]
    paths:
      - ".github/workflows/m07-v67-runtime-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start runtime
        run: |
          python3 -m http.server 8140 --directory prototypes/modern-3d >/tmp/m07-v67-http.log 2>&1 &
          sleep 2
      - name: Capture actual views
        run: |
          mkdir -p .m07-v67
          cat > capture-m07-v67.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const cases=[['portrait-near',390,844,8],['portrait-far',390,844,48],['landscape-near',844,390,8],['landscape-far',844,390,48]];
            const rows=[];
            for(const [name,w,h,steps] of cases){
              const page=await browser.newPage({viewport:{width:w,height:h},deviceScaleFactor:1});
              page.setDefaultTimeout(60000); const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
              await page.goto(`http://127.0.0.1:8140/index.html?quality=high&m08walk=1&m08steps=${steps}`,{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForFunction(()=>document.documentElement.dataset.lqModern3d==='m05-ready' && document.documentElement.dataset.m09OwnerHud==='pass',{timeout:60000});
              await page.waitForTimeout(1400); if(errors.length)throw new Error(`${name}: ${errors.join(' | ')}`);
              await page.screenshot({path:`.m07-v67/${name}.png`,fullPage:true,timeout:60000}); rows.push(`${name} ${w}x${h} PASS`); await page.close();
            }
            fs.writeFileSync('.m07-v67/runtime-audit.txt',rows.join('\n')+'\n'); await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node capture-m07-v67.cjs
      - name: Add canonical references
        run: |
          curl -L --fail --retry 3 -o .m07-v67/MINIMUM_QUALITY_LINE.png https://raw.githubusercontent.com/nisiyasu/-luke-quest/eb6ec9fafc053b6dbabb6ee473932b7c7851ebc6/assets/reference/owner_2026-09-11_ps1_visual_target/MINIMUM_QUALITY_LINE.png
          curl -L --fail --retry 3 -o .m07-v67/TARGET_PS1_FINAL.png https://raw.githubusercontent.com/nisiyasu/-luke-quest/eb6ec9fafc053b6dbabb6ee473932b7c7851ebc6/assets/reference/owner_2026-09-11_ps1_visual_target/TARGET_PS1_FINAL.png
      - uses: actions/upload-artifact@v4
        with:
          name: m07-v67-light-runtime-audit
          path: .m07-v67
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
