name: M09-P01 South Fringe Repair

on:
  push:
    branches: ["prototype/modern-3d"]
    paths:
      - ".github/workflows/m09-p01-south-fringe-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 1
      - name: Add organic south receiving banks outside playable route
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prototypes/modern-3d/index.html')
          s=p.read_text()
          anchor="bank(905,8.8,13.8,3.45,-.22,14.4,-1,-.05);"
          lines=[
            anchor,
            "// v66 M09-P01: mask the finite downstream-water side edges in the south follow-camera fringe with authored receiving terrain. These masses stay outside the playable bridge lane and keep a narrow organic river opening instead of exposing a rectangular blue plane.",
            "nearFieldMass(-6.05,17.2,4.55,1.02,.19);nearFieldMass(4.75,17.5,4.10,1.00,-.16);",
            "const southFringeFernL=createTargetFernPatch({seed:9661,count:26,radius:2.35});southFringeFernL.position.set(-4.85,-.02,16.7);scene.add(southFringeFernL);",
            "const southFringeFernR=createTargetFernPatch({seed:9667,count:24,radius:2.20});southFringeFernR.position.set(3.95,-.02,17.0);scene.add(southFringeFernR);"
          ]
          insertion='\n'.join(lines)
          if 'v66 M09-P01' in s:
              print('repair already present')
          else:
              if s.count(anchor)!=1:
                  raise SystemExit(f'FAIL_CLOSED anchor count={s.count(anchor)}')
              s=s.replace(anchor,insertion,1)
              p.write_text(s)
          PY
          git diff --check
          if git diff --quiet -- prototypes/modern-3d/index.html; then
            echo 'No product change needed.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototypes/modern-3d/index.html
          git commit -m "fix(m09-p01): mask south fringe water-plane edge"
          git push origin HEAD:prototype/modern-3d
