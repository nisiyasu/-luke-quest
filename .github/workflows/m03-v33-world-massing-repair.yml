name: M03 v33 World Massing Repair

on:
  push:
    branches: [prototype/modern-3d]
    paths:
      - .github/workflows/m03-v33-world-massing-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 0
      - name: Ground south bridge landing and strengthen right framing mass
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prototypes/modern-3d/index.html')
          s=p.read_text()
          s=s.replace('M03 Composition Rebuild v32','M03 Composition Rebuild v33')
          anchor="bank(557,8,8,4.8,2.45,14.0,-1,-.12);\n"
          insert="""bank(557,8,8,4.8,2.45,14.0,-1,-.12);
          // M03 v33: make the hero bridge visibly terminate into a real southern bank, not a thin isolated landing slab.
          // The bank is intentionally broad enough to read as world terrain at portrait distance while preserving the river below/right.
          bank(631,7.0,5.4,-1.35,.18,7.35,-1,.02);
          """
          if anchor not in s: raise SystemExit('bank anchor missing')
          s=s.replace(anchor,insert,1)
          anchor2="for(const [x,z,s,seed] of destinationTrees){const t=createTargetConiferV31({seed,scale:s});t.position.set(x,terrainY(x,z)+.18,z);scene.add(t);const f=createTargetFernPatch({seed:seed+5000,scale:.82,count:22});f.position.set(x"
          # Insert right-lower framing cluster before destinationTrees loop without changing existing family.
          marker="const destinationTrees=[[-7.1,-8.3,.88,1701],[-6.0,-5.9,.82,1703],[-5.4,-9.5,.86,1709],[4.7,-7.5,.84,1721],[6.0,-9.5,.92,1723],[4.8,-11.0,.78,1733]];\n"
          add="""const destinationTrees=[[-7.1,-8.3,.88,1701],[-6.0,-5.9,.82,1703],[-5.4,-9.5,.86,1709],[4.7,-7.5,.84,1721],[6.0,-9.5,.92,1723],[4.8,-11.0,.78,1733]];
          const southRightFrameTrees=[[4.2,7.4,.94,1811],[5.1,9.7,1.08,1817],[4.4,12.0,1.02,1823],[6.1,13.3,1.12,1831]];
          for(const [x,z,sc,seed] of southRightFrameTrees){const t=createTargetConiferV31({seed,scale:sc});t.position.set(x,terrainY(x,z)+.24,z);scene.add(t);const f=createTargetFernPatch({seed:seed+6000,scale:.88,count:24});f.position.set(x-.25,terrainY(x,z)+.05,z+.45);scene.add(f)}
          """
          if marker not in s: raise SystemExit('destination tree anchor missing')
          s=s.replace(marker,add,1)
          s=s.replace("m03-composition-v32-hero-frame","m03-composition-v33-grounded-world-massing")
          if 'bank(631,7.0,5.4' not in s or 'southRightFrameTrees' not in s or 'm03-composition-v33-grounded-world-massing' not in s:
              raise SystemExit('v33 patch verification failed')
          p.write_text(s)
          PY
          rm .github/workflows/m03-v33-world-massing-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototypes/modern-3d/index.html .github/workflows/m03-v33-world-massing-repair.yml
          git commit -m "fix(modern-3d): ground bridge landing and right frame"
          git push origin HEAD:prototype/modern-3d
