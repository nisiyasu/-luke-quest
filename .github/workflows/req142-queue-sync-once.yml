name: REQ-142 Queue Sync Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/req142-queue-sync-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert REQ-142 queue row and self-remove
        shell: python
        run: |
          from pathlib import Path
          p=Path('WORK_QUEUE.md')
          text=p.read_text()
          row="| 124 | REQ-142 | P1 | VERIFY | Adventure Memo Modern Controls Hint | `requirements/REQ-142_ADVENTURE_MEMO_MODERN_CONTROLS_HINT.md` | Stale fixed D-pad/A-only adventure memo guidance replaced with drag/tap + keyboard guidance. Zero new input handlers. Dedicated 34226908113 SUCCESS; Pages 34226908028 SUCCESS; P0 Touch 34227266577 SUCCESS. IOS_PHYSICAL_VERIFICATION=PENDING. |\n"
          if 'REQ-142 | P1 |' not in text:
              marker='\n## STATUS DEFINITIONS\n'
              if marker not in text: raise SystemExit('STATUS DEFINITIONS marker missing')
              text=text.replace(marker,'\n'+row+marker,1)
              p.write_text(text)
          Path('.github/workflows/req142-queue-sync-once.yml').unlink()
      - name: Commit queue sync
        run: |
          git config user.name "LUKE QUEST automation"
          git config user.email "actions@users.noreply.github.com"
          git add WORK_QUEUE.md .github/workflows/req142-queue-sync-once.yml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "REQ-142: sync VERIFY queue state"
            git push
          fi
