name: REQ-135 Battle Command Feedback

on:
  push:
    paths:
      - 'requirements/REQ-135_IPHONE_BATTLE_COMMAND_FEEDBACK.md'
      - 'addons/req135-battle-command-feedback.js'
      - 'addons/zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz-req135-battle-feedback-smoke.js'
      - '.github/workflows/req135-battle-command-feedback.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assembled-battle-feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check addons/req135-battle-command-feedback.js
          node --check addons/zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz-req135-battle-feedback-smoke.js
      - name: Assemble Pages-equivalent runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          html=p.read_text()
          marker='<div id="app"></div><script>'
          guard='<div id="app"></div><script src="prelude/autosave-bootstrap-guard.js"></script><script>'
          if html.count(marker)!=1: raise SystemExit('base marker mismatch')
          p.write_text(html.replace(marker,guard,1))
          PY
          mapfile -t patches < <(printf '%s\n' ux-v*.js | sort -V)
          for f in "${patches[@]}"; do sed -i "s#</body>#<script src=\"$f\"></script></body>#" index.html; done
          if compgen -G 'addons/*.js' > /dev/null; then
            for f in addons/*.js; do sed -i "s#</body>#<script src=\"$f\"></script></body>#" index.html; done
          fi
      - name: 390x844 assembled battle feedback acceptance
        id: acceptance
        continue-on-error: true
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$BROWSER"
          python3 -m http.server 8135 >/tmp/lq-req135-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          timeout 35 "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --disable-extensions --disable-sync --no-first-run --window-size=390,844 --virtual-time-budget=6500 --dump-dom 'http://127.0.0.1:8135/?lqReq135Smoke=1' >/tmp/lq-req135-dom.html 2>/tmp/lq-req135-chrome.log || true
          grep -o '<i id="lqReq135BattleFeedbackSmokeMarker"[^>]*>' /tmp/lq-req135-dom.html | tee /tmp/lq-req135-marker.txt || true
          grep -q 'id="lqReq135BattleFeedbackSmokeMarker"[^>]*data-pass="true"' /tmp/lq-req135-dom.html
          echo 'REQ-135 assembled battle command feedback acceptance PASS'
      - name: Upload REQ-135 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: req135-diagnostics
          path: |
            /tmp/lq-req135-marker.txt
            /tmp/lq-req135-dom.html
            /tmp/lq-req135-chrome.log
            /tmp/lq-req135-http.log
          if-no-files-found: warn
          retention-days: 1
      - name: Enforce REQ-135 acceptance
        if: steps.acceptance.outcome != 'success'
        run: exit 1
