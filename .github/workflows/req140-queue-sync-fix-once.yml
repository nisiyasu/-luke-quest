name: REQ-140 Queue Sync Fix Once

on:
  push:
    paths:
      - '.github/workflows/req140-queue-sync-fix-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Insert exact REQ-140 row and self-remove
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('WORK_QUEUE.md')
          text=p.read_text()
          needle='| 122 | REQ-140 |'
          if needle not in text:
              row='| 122 | REQ-140 | P0 | VERIFY | iPhone Compositor Black-Screen Recovery + Safe Save Rescue | `requirements/REQ-140_IPHONE_COMPOSITOR_BLACK_SCREEN_RECOVERY.md` | Compositor pressure reduction + stale intro cleanup + validated save export/import. P0 Touch 34220306982 SUCCESS; Pages 34220399635 SUCCESS; Render Liveness 34220399555 SUCCESS. IOS_PHYSICAL_VERIFICATION=PENDING. |\n\n'
              anchor='## STATUS DEFINITIONS'
              if anchor not in text:
                  raise SystemExit('queue status anchor missing')
              text=text.replace(anchor,row+anchor,1)
              p.write_text(text)
          Path('.github/workflows/req140-queue-sync-fix-once.yml').unlink(missing_ok=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WORK_QUEUE.md .github/workflows/req140-queue-sync-fix-once.yml
          git commit -m 'REQ-140: register VERIFY in WORK_QUEUE'
          git push origin HEAD:main
