name: M06-P01 Upstream Void Regate V4
on:
  push:
    branches: ["prototype/modern-3d"]
    paths: [".github/workflows/m06-p01-upstream-void-regate-v3.yml"]
permissions:
  contents: write
jobs:
  terrain-regate:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Repair remaining upstream shore envelope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prototypes/modern-3d/index.html')
          s=p.read_text()
          needle="bank(9757,4.8,7.2,6.95,.10,-13.0,1,-.18);\nconst upstreamSeamFern=createTargetFernPatch({seed:9751,count:24,radius:2.05});"
          repl="bank(9757,4.8,7.2,6.95,.10,-13.0,1,-.18);\n// M06-P01 upstream-envelope-repair-v2: close the remaining east-bank coverage gap exposed by canonical + north/south follow-camera evidence while preserving the river channel.\nbank(9763,4.2,5.8,4.55,.08,-10.85,1,-.10);\nconst upstreamSeamFern=createTargetFernPatch({seed:9751,count:24,radius:2.05});"
          if needle not in s:
              raise SystemExit('expected upstream repair anchor missing')
          p.write_text(s.replace(needle,repl,1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prototypes/modern-3d/index.html
          git commit -m "fix(m06-p01): close remaining upstream shore coverage gap"
          git push origin HEAD:prototype/modern-3d
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: |
          python3 -m http.server 8140 --directory prototypes/modern-3d >/tmp/http.log 2>&1 &
          sleep 2
      - name: Capture exact-repair terrain continuity
        run: |
          mkdir -p .evidence
          cat > regate.cjs <<'JS'
          const {chromium}=require('playwright'); const fs=require('fs'); const cp=require('child_process');
          (async()=>{const b=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
          async function open(){const p=await b.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});p.setDefaultTimeout(150000);const e=[];p.on('pageerror',x=>e.push(String(x)));await p.goto('http://127.0.0.1:8140/index.html?quality=high',{waitUntil:'domcontentloaded',timeout:150000});await p.waitForFunction(()=>document.documentElement.dataset.lqModern3d==='m05-ready',{timeout:150000});await p.waitForTimeout(1200);if(e.length)throw Error(e.join('\n'));return p}
          async function shot(p,path){await p.screenshot({path,timeout:150000,animations:'disabled'});}
          let p=await open();await shot(p,'.evidence/canonical.png');await p.keyboard.down('ArrowUp');await p.waitForTimeout(1300);await p.keyboard.up('ArrowUp');await p.waitForTimeout(650);let n=await p.evaluate(()=>document.documentElement.dataset.m08Player||'UNKNOWN');await shot(p,'.evidence/moved-north-1300ms.png');await p.close();p=await open();await p.keyboard.down('ArrowDown');await p.waitForTimeout(2200);await p.keyboard.up('ArrowDown');await p.waitForTimeout(650);let s=await p.evaluate(()=>document.documentElement.dataset.m08Player||'UNKNOWN');await shot(p,'.evidence/moved-south-2200ms.png');await p.close();const head=cp.execSync('git rev-parse HEAD').toString().trim();fs.writeFileSync('.evidence/audit.txt',`head=${head}\nnorth=${n}\nsouth=${s}\npage_errors=0\nrepair=upstream-envelope-repair-v2\n`);await b.close()})().catch(e=>{console.error(e);process.exit(1)})
          JS
          node regate.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m06-p01-upstream-void-regate-v4
          path: .evidence
          include-hidden-files: true
          retention-days: 14
