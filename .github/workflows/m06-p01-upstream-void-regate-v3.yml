name: M06-P01 Upstream Void Regate V3
on:
  push:
    branches: ["prototype/modern-3d"]
    paths: [".github/workflows/m06-p01-upstream-void-regate-v3.yml"]
permissions:
  contents: read
jobs:
  terrain-regate:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: |
          python3 -m http.server 8140 --directory prototypes/modern-3d >/tmp/http.log 2>&1 &
          sleep 2
      - name: Capture exact-head terrain continuity
        run: |
          mkdir -p .evidence
          cat > regate.cjs <<'JS'
          const {chromium}=require('playwright'); const fs=require('fs');
          (async()=>{const b=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
          async function open(){const p=await b.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});const e=[];p.on('pageerror',x=>e.push(String(x)));await p.goto('http://127.0.0.1:8140/index.html?quality=high',{waitUntil:'domcontentloaded',timeout:150000});await p.waitForFunction(()=>document.documentElement.dataset.lqModern3d==='m05-ready',{timeout:150000});await p.waitForTimeout(900);if(e.length)throw Error(e.join('\n'));return p}
          let p=await open();await p.screenshot({path:'.evidence/canonical.png'});await p.keyboard.down('ArrowUp');await p.waitForTimeout(1300);await p.keyboard.up('ArrowUp');await p.waitForTimeout(650);let n=await p.evaluate(()=>document.documentElement.dataset.m08Player||'UNKNOWN');await p.screenshot({path:'.evidence/moved-north-1300ms.png'});await p.close();p=await open();await p.keyboard.down('ArrowDown');await p.waitForTimeout(2200);await p.keyboard.up('ArrowDown');await p.waitForTimeout(650);let s=await p.evaluate(()=>document.documentElement.dataset.m08Player||'UNKNOWN');await p.screenshot({path:'.evidence/moved-south-2200ms.png'});await p.close();fs.writeFileSync('.evidence/audit.txt',`head=${process.env.GITHUB_SHA}\nnorth=${n}\nsouth=${s}\npage_errors=0\n`);await b.close()})().catch(e=>{console.error(e);process.exit(1)})
          JS
          node regate.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: m06-p01-upstream-void-regate-v3
          path: .evidence
          retention-days: 14
