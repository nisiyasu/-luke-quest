name: REQ-136 Battle Log Latest Follow

on:
  push:
    paths:
      - 'requirements/REQ-136_BATTLE_LOG_LATEST_MESSAGE_FOLLOW.md'
      - 'addons/req136-battle-log-latest-follow.js'
      - 'addons/zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz-req136-battle-log-follow-smoke.js'
      - '.github/workflows/req136-battle-log-follow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assembled-battle-log-follow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check addons/req136-battle-log-latest-follow.js
          node --check addons/zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz-req136-battle-log-follow-smoke.js
          node --check addons/req135-battle-command-feedback.js
          node --check addons/req134-iphone-battle-touch-ui.js
      - name: Assemble Pages-equivalent runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          html=p.read_text()
          marker='<div id="app"></div><script>'
          guard='<div id="app"></div><script src="prelude/autosave-bootstrap-guard.js"></script><script>'
          if html.count(marker)!=1: raise SystemExit('base marker mismatch')
          p.write_text(html.replace(marker,guard,1))
          PY
          mapfile -t patches < <(printf '%s\n' ux-v*.js | sort -V)
          for f in "${patches[@]}"; do sed -i "s#</body>#<script src=\"$f\"></script></body>#" index.html; done
          if compgen -G 'addons/*.js' > /dev/null; then
            for f in addons/*.js; do sed -i "s#</body>#<script src=\"$f\"></script></body>#" index.html; done
          fi
      - name: 390x844 assembled battle log follow acceptance
        id: acceptance
        continue-on-error: true
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$BROWSER"
          python3 -m http.server 8137 >/tmp/lq-req136-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          timeout 35 "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --disable-extensions --disable-sync --no-first-run --window-size=390,844 --virtual-time-budget=7000 --dump-dom 'http://127.0.0.1:8137/?lqReq136Smoke=1' >/tmp/lq-req136-dom.html 2>/tmp/lq-req136-chrome.log || true
          grep -o '<i id="lqReq136BattleLogFollowSmokeMarker"[^>]*>' /tmp/lq-req136-dom.html | tee /tmp/lq-req136-marker.txt || true
          grep -q 'id="lqReq136BattleLogFollowSmokeMarker"[^>]*data-pass="true"' /tmp/lq-req136-dom.html
          echo 'REQ-136 assembled battle log latest-follow acceptance PASS'
      - name: REQ-135 feedback regression
        id: req135
        continue-on-error: true
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          python3 -m http.server 8138 >/tmp/lq-req135-under-136-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          timeout 35 "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --disable-extensions --disable-sync --no-first-run --window-size=390,844 --virtual-time-budget=6500 --dump-dom 'http://127.0.0.1:8138/?lqReq135Smoke=1' >/tmp/lq-req135-under-136-dom.html 2>/tmp/lq-req135-under-136-chrome.log || true
          grep -q 'id="lqReq135BattleFeedbackSmokeMarker"[^>]*data-pass="true"' /tmp/lq-req135-under-136-dom.html
          echo 'REQ-135 regression under REQ-136 PASS'
      - name: REQ-134 touch regression
        id: req134
        continue-on-error: true
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          python3 -m http.server 8139 >/tmp/lq-req134-under-136-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          timeout 35 "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --disable-extensions --disable-sync --no-first-run --window-size=390,844 --virtual-time-budget=6500 --dump-dom 'http://127.0.0.1:8139/?lqReq134Smoke=1' >/tmp/lq-req134-under-136-dom.html 2>/tmp/lq-req134-under-136-chrome.log || true
          grep -q 'id="lqReq134BattleTouchSmokeMarker"[^>]*data-pass="true"' /tmp/lq-req134-under-136-dom.html
          echo 'REQ-134 regression under REQ-136 PASS'
      - name: Upload REQ-136 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: req136-diagnostics
          path: |
            /tmp/lq-req136-marker.txt
            /tmp/lq-req136-dom.html
            /tmp/lq-req136-chrome.log
            /tmp/lq-req136-http.log
            /tmp/lq-req135-under-136-dom.html
            /tmp/lq-req135-under-136-chrome.log
            /tmp/lq-req134-under-136-dom.html
            /tmp/lq-req134-under-136-chrome.log
          if-no-files-found: warn
          retention-days: 1
      - name: Enforce REQ-136 acceptance
        if: steps.acceptance.outcome != 'success' || steps.req135.outcome != 'success' || steps.req134.outcome != 'success'
        run: exit 1
