name: M08-P01 Player Visual Evidence

on:
  push:
    branches: ["prototype/modern-3d"]
    paths:
      - ".github/workflows/m08-p01-player-visual-evidence.yml"

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start runtime
        run: |
          python3 -m http.server 8140 --directory prototypes/modern-3d >/tmp/m08p01-http.log 2>&1 &
          sleep 2
      - name: Capture canonical close and alternate-pose player evidence
        run: |
          set -euo pipefail
          mkdir -p .m08p01-evidence
          cat > m08p01-proof.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            const t0=Date.now();
            await page.goto('http://127.0.0.1:8140/index.html?quality=high',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>document.documentElement.dataset.lqModern3d==='m05-ready',{timeout:120000});
            await page.waitForTimeout(1200);
            if(errors.length)throw new Error(errors.join(' | '));
            await page.screenshot({path:'.m08p01-evidence/player-canonical.png',fullPage:true,timeout:120000});
            await page.screenshot({path:'.m08p01-evidence/player-close.png',clip:{x:105,y:455,width:180,height:245},timeout:120000});
            await page.keyboard.down('ArrowUp');await page.waitForTimeout(700);
            await page.screenshot({path:'.m08p01-evidence/player-walk-pose.png',fullPage:true,timeout:120000});
            await page.keyboard.up('ArrowUp');await page.waitForTimeout(700);
            await page.screenshot({path:'.m08p01-evidence/player-release-pose.png',fullPage:true,timeout:120000});
            fs.writeFileSync('.m08p01-evidence/performance.txt',`ready_ms=${Date.now()-t0}\n`);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node m08p01-proof.cjs
          for f in player-canonical player-close player-walk-pose player-release-pose; do test -s ".m08p01-evidence/$f.png"; done
      - name: Record exact-head manifest
        if: ${{ always() }}
        run: |
          mkdir -p .m08p01-evidence
          cat > .m08p01-evidence/M08_P01_EVIDENCE.txt <<EOF
          HEAD=${GITHUB_SHA}
          PACKET=M08-P01
          CANONICAL=$(test -s .m08p01-evidence/player-canonical.png && echo PASS || echo MISSING)
          CLOSE=$(test -s .m08p01-evidence/player-close.png && echo PASS || echo MISSING)
          WALK_POSE=$(test -s .m08p01-evidence/player-walk-pose.png && echo PASS || echo MISSING)
          RELEASE_POSE=$(test -s .m08p01-evidence/player-release-pose.png && echo PASS || echo MISSING)
          PHYSICAL_IPHONE=PENDING
          EOF
      - name: Upload player evidence and references
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: m08-p01-player-visual-${{ github.sha }}
          path: |
            .m08p01-evidence/
            /tmp/m08p01-http.log
            assets/reference/owner_2026-09-11_ps1_visual_target/MINIMUM_QUALITY_LINE.png
            assets/reference/owner_2026-09-11_ps1_visual_target/TARGET_PS1_FINAL.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14