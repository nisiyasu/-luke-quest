name: Village G0 Visual Evidence

on:
  push:
    branches: ["environment/village"]
    paths:
      - ".github/workflows/environment-village-g0-visual-evidence.yml"
      - "prototypes/modern-3d/**"
      - "docs/environment-village/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: environment/village
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start exact-head runtime
        run: |
          python3 -m http.server 8140 --directory prototypes/modern-3d >/tmp/village-g0-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8140/index.html >/dev/null
      - name: Capture exact-head actual frame
        run: |
          mkdir -p .village-g0
          cat > capture-village-g0.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8140/index.html?quality=high',{waitUntil:'domcontentloaded',timeout:150000});
            await page.waitForTimeout(2500);
            await page.screenshot({path:'.village-g0/ACTUAL_EXACT_HEAD.png',fullPage:true,timeout:150000});
            const meta=await page.evaluate(()=>({scene:document.documentElement.dataset.lqModern3d||null,player:document.documentElement.dataset.m08Player||null,cameraProfile:document.documentElement.dataset.m03CameraProfile||null}));
            fs.writeFileSync('.village-g0/runtime-audit.json',JSON.stringify({head:process.env.GITHUB_SHA,viewport:[390,844],meta,pageErrors:errors},null,2));
            if(errors.length) throw new Error('runtime page errors: '+JSON.stringify(errors));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node capture-village-g0.cjs
      - name: Add Owner target from reference authority branch
        run: |
          curl -L --fail --retry 3 -o .village-g0/TARGET_VILLAGE_OWNER.png "https://raw.githubusercontent.com/nisiyasu/-luke-quest/prototype/modern-3d/references/target-quality/environments/VILLAGE_TARGET_OWNER_20260914.png"
          python3 - <<'PY'
          from pathlib import Path
          import struct, json
          p=Path('.village-g0/TARGET_VILLAGE_OWNER.png')
          b=p.read_bytes()
          if b[:8] != b'\x89PNG\r\n\x1a\n': raise SystemExit('target is not PNG')
          w,h=struct.unpack('>II',b[16:24])
          Path('.village-g0/target-audit.json').write_text(json.dumps({'source_branch':'prototype/modern-3d','source_path':'references/target-quality/environments/VILLAGE_TARGET_OWNER_20260914.png','width':w,'height':h,'bytes':len(b)},indent=2))
          PY
      - name: Add coordinate audit contract
        run: |
          cat > .village-g0/coordinate-audit.json <<'JSON'
          {
            "coordinate_system": "normalized_screen_space_top_left_origin",
            "target": "TARGET_VILLAGE_OWNER.png",
            "actual": "ACTUAL_EXACT_HEAD.png",
            "visual_pass_allowed_only_after_images_opened_and_compared": true,
            "anchors": [
              "PLAYER_CHARACTER",
              "PLAZA",
              "HOUSE_MASS_LEFT",
              "HOUSE_MASS_RIGHT",
              "FOUNTAIN",
              "CHURCH_OR_LARGE_BUILDING",
              "STAIR_PATH_AXIS"
            ],
            "measurement_status": "PENDING_VISUAL_MEASUREMENT"
          }
          JSON
      - uses: actions/upload-artifact@v4
        with:
          name: village-g0-visual-evidence
          path: .village-g0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
