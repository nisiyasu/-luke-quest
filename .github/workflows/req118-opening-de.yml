name: REQ-118 Opening D+E Gate

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "req118-opening-de"
  cancel-in-progress: true

jobs:
  checkpoint-de:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and addon contract
        run: |
          node --check addons/zzzzzzzzzzzzzz-req118-opening-de.js
          node --check addons/zzzzzzzzzzzzz-req118-opening-c.js
          node tools/lq-addon-contract.mjs
      - name: Assemble exact public script order
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');html=p.read_text();marker='<div id="app"></div><script>';guard='<div id="app"></div><script src="prelude/autosave-bootstrap-guard.js"></script><script>'
          if html.count(marker)!=1: raise SystemExit('base marker mismatch')
          p.write_text(html.replace(marker,guard,1))
          PY
          mapfile -t patches < <(printf '%s\n' ux-v*.js | sort -V)
          for f in "${patches[@]}"; do sed -i "s#</body>#<script src=\"$f\"></script></body>#" index.html; done
          for f in addons/*.js; do sed -i "s#</body>#<script src=\"$f\"></script></body>#" index.html; done
          cp index.html req118-de.html
      - name: Run 390x844 anxiety and ceremony acceptance
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"; test -n "$BROWSER"
          python3 -m http.server 8153 >/tmp/req118-de-http.log 2>&1 & pid=$!; trap 'kill "$pid" 2>/dev/null || true' EXIT; sleep 1
          set +e
          timeout 45 "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --disable-background-networking --disable-extensions --disable-sync --no-first-run --window-size=390,844 --virtual-time-budget=13000 --dump-dom 'http://127.0.0.1:8153/req118-de.html?lqReq118DESmoke=1' >/tmp/req118-de-dom.html 2>/tmp/req118-de-browser.log
          code=$?; set -e; test -s /tmp/req118-de-dom.html
          for needle in 'id="lqReq118DEMarker"' 'data-status="PASS"' 'data-leon-anxiety="true"' 'data-leon-absent="true"' 'data-eleanor-composed="true"' 'data-luke-called="true"' 'data-progression-isolated="true"'; do
            grep -q "$needle" /tmp/req118-de-dom.html || { echo "REQ-118 D+E missing: $needle"; grep -o 'lqReq118[^<]*\|data-[a-z-]*="[^"]*"' /tmp/req118-de-dom.html | tail -100 || true; cat /tmp/req118-de-browser.log || true; exit 1; }
          done
          if grep -E 'Uncaught (ReferenceError|TypeError|SyntaxError)|ReferenceError:|SyntaxError:' /tmp/req118-de-browser.log; then cat /tmp/req118-de-browser.log; exit 1; fi
          echo "REQ-118 Checkpoint D+E PASS (browser status $code)"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: req118-de-${{ github.sha }}
          path: |
            /tmp/req118-de-*.html
            /tmp/req118-de-*.log
          retention-days: 7
          if-no-files-found: warn
