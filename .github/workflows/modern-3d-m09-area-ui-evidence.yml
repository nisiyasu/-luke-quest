name: Modern 3D M09 Area UI Evidence

on:
  push:
    branches: ["prototype/modern-3d"]
    paths:
      - "prototypes/modern-3d/index.html"
      - "prototypes/modern-3d/ui-quality-v51b.js"
      - "prototypes/modern-3d/m04-water-target-v3.js"
      - ".github/workflows/modern-3d-m09-area-ui-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify map-first HUD source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F "import './ui-quality-v51b.js';" prototypes/modern-3d/m04-water-target-v3.js
          grep -F 'class="hud-name-row"' prototypes/modern-3d/ui-quality-v51b.js
          grep -F 'id="state" class="runtime-state"' prototypes/modern-3d/ui-quality-v51b.js
          grep -F "id='route-cue'" prototypes/modern-3d/ui-quality-v51b.js
          grep -F "id='location-ribbon'" prototypes/modern-3d/ui-quality-v51b.js
          grep -F 'class="action-orb"' prototypes/modern-3d/ui-quality-v51b.js
          grep -F "dataset.m09OwnerHud='pass'" prototypes/modern-3d/ui-quality-v51b.js
          grep -F "dataset.m09HudMode='map-first-v64'" prototypes/modern-3d/ui-quality-v51b.js
          grep -F "querySelector('#exploration-route')?.remove()" prototypes/modern-3d/ui-quality-v51b.js
          ! grep -F 'DISPLAY SAMPLE' prototypes/modern-3d/ui-quality-v51b.js
          ! grep -F '3D PROTOTYPE · DEMO HUD' prototypes/modern-3d/ui-quality-v51b.js
          grep -F 'env(safe-area-inset-left)' prototypes/modern-3d/index.html
          grep -F 'env(safe-area-inset-right)' prototypes/modern-3d/index.html
          grep -F 'env(safe-area-inset-bottom)' prototypes/modern-3d/index.html

  capture:
    needs: source-contract
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: portrait-near, width: 390, height: 844, steps: 8}
          - {name: portrait-far, width: 390, height: 844, steps: 48}
          - {name: landscape-near, width: 844, height: 390, steps: 8}
          - {name: landscape-far, width: 844, height: 390, steps: 48}
    steps:
      - uses: actions/checkout@v4
      - name: Build deterministic local browser fixture
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .modern3d-ci
          cp -a prototypes/modern-3d .modern3d-ci
          curl -fL --retry 4 --retry-all-errors --connect-timeout 10 \
            'https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js' \
            -o .modern3d-ci/three.module.js
          curl -fL --retry 4 --retry-all-errors --connect-timeout 10 \
            'https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.core.js' \
            -o .modern3d-ci/three.core.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.modern3d-ci/index.html')
          s=p.read_text()
          old='https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js'
          assert old in s
          p.write_text(s.replace(old,'./three.module.js',1))
          PY
      - name: Start prototype server
        shell: bash
        run: |
          python3 -m http.server 8140 --directory .modern3d-ci >/tmp/m09-http.log 2>&1 &
          sleep 1
          curl -fsS http://127.0.0.1:8140/index.html >/dev/null
          curl -fsS http://127.0.0.1:8140/three.module.js >/dev/null
      - name: Install CDP capture harness
        run: npm install --no-save --no-package-lock puppeteer-core
      - name: Capture ${{ matrix.name }} through live RAF runtime
        shell: bash
        env:
          CAPTURE_NAME: ${{ matrix.name }}
          VIEW_W: ${{ matrix.width }}
          VIEW_H: ${{ matrix.height }}
          WALK_STEPS: ${{ matrix.steps }}
        run: |
          set -euo pipefail
          export BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          mkdir -p .modern3d-m09
          node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const fs=require('fs');
          (async()=>{
            const name=process.env.CAPTURE_NAME;
            const width=Number(process.env.VIEW_W), height=Number(process.env.VIEW_H), steps=Number(process.env.WALK_STEPS);
            const browser=await puppeteer.launch({executablePath:process.env.BROWSER,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            try{
              const page=await browser.newPage();
              const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
              await page.setViewport({width,height,deviceScaleFactor:1});
              await page.goto(`http://127.0.0.1:8140/index.html?quality=practical&m08walk=1&m08steps=${steps}`,{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForFunction(()=>document.documentElement.dataset.lqModern3d==='m05-ready' && document.documentElement.dataset.m09OwnerHud==='pass',{timeout:45000});
              await new Promise(r=>setTimeout(r,2600));
              if(errors.length) throw new Error(`${name}: pageerror ${errors.join(' | ')}`);
              const runtime=await page.evaluate(()=>({mode:document.documentElement.dataset.m09HudMode,ready:document.documentElement.dataset.lqModern3d,walkDone:document.documentElement.dataset.m08WalkDone||null,player:document.documentElement.dataset.m08Player||null}));
              if(runtime.mode!=='map-first-v64') throw new Error(`${name}: HUD mode ${runtime.mode}`);
              await page.screenshot({path:`.modern3d-m09/${name}.png`,fullPage:false});
              fs.writeFileSync(`.modern3d-m09/${name}.runtime.json`,JSON.stringify(runtime,null,2)+'\n');
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          test -s ".modern3d-m09/${CAPTURE_NAME}.png"
      - uses: actions/upload-artifact@v4
        with:
          name: m09-capture-${{ matrix.name }}-${{ github.sha }}
          path: |
            .modern3d-m09/${{ matrix.name }}.png
            .modern3d-m09/${{ matrix.name }}.runtime.json
          retention-days: 14

  runtime-hud:
    needs: source-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Start prototype server
        run: |
          python3 -m http.server 8140 --directory prototypes/modern-3d >/tmp/m09-http.log 2>&1 &
          sleep 1
      - name: Verify runtime DOM
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          mkdir -p .modern3d-m09
          profile="$(mktemp -d)"
          timeout 80s "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage \
            --disable-background-networking --disable-component-update --disable-sync \
            --no-first-run --no-default-browser-check --metrics-recording-only \
            --user-data-dir="$profile" --enable-webgl --ignore-gpu-blocklist \
            --use-angle=swiftshader --enable-unsafe-swiftshader \
            --virtual-time-budget=3000 --dump-dom \
            'http://127.0.0.1:8140/index.html?ci=1' > .modern3d-m09/dom.html 2>.modern3d-m09/chrome-stderr.log
          rm -rf "$profile"
          grep -q 'data-lq-modern3d="m05-ready"' .modern3d-m09/dom.html
          grep -q 'data-m09-owner-hud="pass"' .modern3d-m09/dom.html
          grep -q 'data-m09-hud-mode="map-first-v64"' .modern3d-m09/dom.html
          grep -q 'class="hud-name-row"' .modern3d-m09/dom.html
          grep -q 'id="state" class="runtime-state"' .modern3d-m09/dom.html
          grep -q 'id="route-cue"' .modern3d-m09/dom.html
          grep -q 'id="location-ribbon"' .modern3d-m09/dom.html
          grep -q 'FOLLOW THE TRAIL' .modern3d-m09/dom.html
          grep -q 'class="action-orb"' .modern3d-m09/dom.html
          grep -q 'FOREST BRIDGE' .modern3d-m09/dom.html
          grep -q 'MONSTER FOREST' .modern3d-m09/dom.html
          ! grep -q 'id="exploration-route"' .modern3d-m09/dom.html
          ! grep -q '3D PROTOTYPE · DEMO HUD' .modern3d-m09/dom.html
          ! grep -q 'DISPLAY SAMPLE' .modern3d-m09/dom.html
          ! grep -q 'data-lq-modern3d="error"' .modern3d-m09/dom.html
      - uses: actions/upload-artifact@v4
        with:
          name: m09-runtime-hud-${{ github.sha }}
          path: .modern3d-m09/
          include-hidden-files: true
          retention-days: 14

  aggregate:
    needs: [capture, runtime-hud]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: m09-capture-*-${{ github.sha }}
          path: .modern3d-m09
          merge-multiple: true
      - name: Install image analysis dependency
        run: python3 -m pip install --disable-pip-version-check --quiet pillow
      - name: Validate captures and reject blank world renders
        shell: bash
        run: |
          set -euo pipefail
          for f in portrait-near portrait-far landscape-near landscape-far; do test -s ".modern3d-m09/$f.png"; test -s ".modern3d-m09/$f.runtime.json"; done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, statistics
          from PIL import Image

          root=Path('.modern3d-m09')
          names=['portrait-near.png','portrait-far.png','landscape-near.png','landscape-far.png']
          rows=[]
          for n in names:
              p=root/n
              b=p.read_bytes()
              assert len(b)>15000 and b[:8]==b'\x89PNG\r\n\x1a\n', f'{n}: invalid PNG transport'
              im=Image.open(p).convert('RGB')
              w,h=im.size
              crop=im.crop((int(w*.08), int(h*.15), int(w*.92), int(h*.82)))
              pixels=list(crop.getdata())
              gray=[(r+g+b)/(3*255.0) for r,g,b in pixels]
              std=statistics.pstdev(gray)
              unique=len(set(pixels))
              ordered=sorted(gray)
              lo=ordered[max(0,int(len(ordered)*.05)-1)]
              hi=ordered[min(len(ordered)-1,int(len(ordered)*.95))]
              dynamic=hi-lo
              assert std >= 0.025, f'{n}: WORLD_RENDER_BLANK std={std:.6f}'
              assert unique >= 128, f'{n}: WORLD_RENDER_BLANK unique_colors={unique}'
              assert dynamic >= 0.08, f'{n}: WORLD_RENDER_LOW_DYNAMIC_RANGE p95-p05={dynamic:.6f}'
              rows.append(f'{n} bytes={len(b)} sha256={hashlib.sha256(b).hexdigest()} world_std={std:.6f} world_unique={unique} world_dynamic={dynamic:.6f}')

          (root/'m09-evidence.txt').write_text(
              '\n'.join(rows)
              +'\nHUD_OWNER_REGATE=PASS\nHUD_MODE=MAP_FIRST_V64\n'
              +'STATIC_VIEWPORT_CAPTURE=PASS\nWORLD_RENDER_NONBLANK=PASS\n'
              +'POSITION_VARIATION=CAPTURED_BY_M08WALK_SEE_RUNTIME_JSON\nMULTI_VIEWPORT=PASS\n'
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: modern-3d-m09-area-ui-${{ github.sha }}
          path: .modern3d-m09/
          include-hidden-files: true
          retention-days: 14
