name: Modern 3D M09 Area UI Evidence

on:
  push:
    branches:
      - prototype/modern-3d
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m09-area-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Verify M09 HUD and safe-area source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'id="status"' prototypes/modern-3d/index.html
          grep -F 'class="objective panel"' prototypes/modern-3d/index.html
          grep -F 'env(safe-area-inset-left)' prototypes/modern-3d/index.html
          grep -F 'env(safe-area-inset-right)' prototypes/modern-3d/index.html
          grep -F 'env(safe-area-inset-bottom)' prototypes/modern-3d/index.html
          grep -F 'class="dpad"' prototypes/modern-3d/index.html
          grep -F 'id="hint"' prototypes/modern-3d/index.html
          grep -F '3D PROTOTYPE · DEMO HUD' prototypes/modern-3d/index.html
          grep -F 'DISPLAY SAMPLE' prototypes/modern-3d/index.html
          grep -F '@media (max-height:480px)' prototypes/modern-3d/index.html
          ! grep -F 'LUKE</b> · Lv 1' prototypes/modern-3d/index.html

      - name: Start isolated prototype server
        shell: bash
        run: |
          python3 -m http.server 8140 --directory prototypes/modern-3d >/tmp/m09-http.log 2>&1 &
          sleep 1
          curl -fsS http://127.0.0.1:8140/index.html >/dev/null

      - name: Capture multi-position multi-viewport evidence
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          mkdir -p .modern3d-m09

          capture() {
            name="$1"; size="$2"; steps="$3"
            timeout 55s "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage \
              --enable-webgl --ignore-gpu-blocklist --use-angle=swiftshader --enable-unsafe-swiftshader \
              --window-size="$size" --force-device-scale-factor=1 --virtual-time-budget=160 \
              --screenshot=".modern3d-m09/${name}.png" \
              "http://127.0.0.1:8140/index.html?m08walk=1&m08steps=${steps}"
          }

          capture portrait-near 390,844 8
          capture portrait-far 390,844 48
          capture landscape-near 844,390 8
          capture landscape-far 844,390 48
          capture tablet-mid 768,1024 28

          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib, math, hashlib

          expected={
            'portrait-near.png':(390,844),
            'portrait-far.png':(390,844),
            'landscape-near.png':(844,390),
            'landscape-far.png':(844,390),
            'tablet-mid.png':(768,1024),
          }

          def decode(path):
            data=path.read_bytes()
            assert len(data)>15000 and data[:8]==b'\x89PNG\r\n\x1a\n', path
            pos=8; ids=[]; w=h=ct=bd=None
            while pos<len(data):
              n=struct.unpack('>I',data[pos:pos+4])[0]
              typ=data[pos+4:pos+8]; chunk=data[pos+8:pos+8+n]; pos+=12+n
              if typ==b'IHDR': w,h,bd,ct,_,_,_=struct.unpack('>IIBBBBB',chunk)
              elif typ==b'IDAT': ids.append(chunk)
              elif typ==b'IEND': break
            assert (w,h)==expected[path.name], (path,w,h,expected[path.name])
            assert bd==8 and ct in (2,6)
            bpp=3 if ct==2 else 4
            raw=zlib.decompress(b''.join(ids)); stride=w*bpp; rows=[]; p=0; prev=bytearray(stride)
            def paeth(a,b,c):
              q=a+b-c; pa=abs(q-a); pb=abs(q-b); pc=abs(q-c)
              return a if pa<=pb and pa<=pc else b if pb<=pc else c
            for _ in range(h):
              f=raw[p]; p+=1; scan=bytearray(raw[p:p+stride]); p+=stride; out=bytearray(stride)
              for i,x in enumerate(scan):
                a=out[i-bpp] if i>=bpp else 0; b=prev[i]; c=prev[i-bpp] if i>=bpp else 0
                out[i]=x if f==0 else (x+a)&255 if f==1 else (x+b)&255 if f==2 else (x+((a+b)//2))&255 if f==3 else (x+paeth(a,b,c))&255
              rows.append(out); prev=out
            vals=[]; colors=set()
            for y in range(max(0,int(h*.12)),min(h,int(h*.82)),max(3,h//180)):
              row=rows[y]
              for x in range(max(0,int(w*.10)),min(w,int(w*.90)),max(3,w//140)):
                i=x*bpp; rgb=tuple(row[i:i+3]); colors.add(rgb); vals.append(.2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2])
            mean=sum(vals)/len(vals); std=math.sqrt(sum((v-mean)**2 for v in vals)/len(vals))
            assert len(colors)>80 and std>8,(path,len(colors),std)
            return data

          results=[]
          for name in expected:
            path=Path('.modern3d-m09')/name
            data=decode(path)
            results.append(f'{name} bytes={len(data)} sha256={hashlib.sha256(data).hexdigest()}')

          assert hashlib.sha256((Path('.modern3d-m09')/'portrait-near.png').read_bytes()).digest()!=hashlib.sha256((Path('.modern3d-m09')/'portrait-far.png').read_bytes()).digest()
          assert hashlib.sha256((Path('.modern3d-m09')/'landscape-near.png').read_bytes()).digest()!=hashlib.sha256((Path('.modern3d-m09')/'landscape-far.png').read_bytes()).digest()
          Path('.modern3d-m09/m09-evidence.txt').write_text('\n'.join(results)+'\nPASS\n')
          PY

      - name: Prove HUD remains in runtime DOM
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          timeout 35s "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-webgl --ignore-gpu-blocklist --use-angle=swiftshader --enable-unsafe-swiftshader \
            --virtual-time-budget=220 --dump-dom \
            'http://127.0.0.1:8140/index.html?m08walk=1&m08steps=28' > .modern3d-m09/dom.html 2>.modern3d-m09/chrome-stderr.log
          grep -q 'id="status"' .modern3d-m09/dom.html
          grep -q 'class="objective panel"' .modern3d-m09/dom.html
          grep -q 'class="dpad"' .modern3d-m09/dom.html
          grep -q 'id="hint"' .modern3d-m09/dom.html
          grep -q '3D PROTOTYPE · DEMO HUD' .modern3d-m09/dom.html
          grep -q 'DISPLAY SAMPLE' .modern3d-m09/dom.html
          grep -q 'data-m08-ci="pass"' .modern3d-m09/dom.html

      - name: Upload M09 evidence
        uses: actions/upload-artifact@v4
        with:
          name: modern-3d-m09-area-ui-${{ github.sha }}
          path: |
            .modern3d-m09/*.png
            .modern3d-m09/m09-evidence.txt
            .modern3d-m09/dom.html
            .modern3d-m09/chrome-stderr.log
            /tmp/m09-http.log
            prototypes/modern-3d/index.html
          retention-days: 14
