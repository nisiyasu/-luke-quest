name: M09-P01 Landscape World Fill Regate

on:
  push:
    branches: ["prototype/modern-3d"]
    paths:
      - ".github/workflows/m09-p01-landscape-worldfill-regate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 8140 --directory prototypes/modern-3d >/tmp/m09-worldfill.log 2>&1 &
          sleep 2
      - name: Capture portrait and multi-position landscape world coverage
        run: |
          mkdir -p .m09-worldfill
          cat > regate.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const p3=s=>String(s||'').split(',').map(Number);
          const delta=(a,b)=>Math.hypot(b[0]-a[0],b[2]-a[2]);
          async function open(browser,w,h){
            const p=await browser.newPage({viewport:{width:w,height:h},deviceScaleFactor:1,hasTouch:true,isMobile:true});
            const errs=[];p.on('pageerror',e=>errs.push(String(e)));
            await p.goto('http://127.0.0.1:8140/index.html?quality=high',{waitUntil:'domcontentloaded',timeout:150000});
            await p.waitForFunction(()=>document.documentElement.dataset.lqModern3d==='m05-ready'&&document.documentElement.dataset.m09OwnerHud==='pass',{timeout:150000});
            await p.waitForTimeout(900);
            if(errs.length)throw new Error(`page errors=${JSON.stringify(errs)}`);
            return p;
          }
          async function meta(p){return p.evaluate(()=>({player:document.documentElement.dataset.m08Player,camera:document.documentElement.dataset.m03CameraProfile||'UNKNOWN'}))}
          async function hold(p,key,ms){await p.keyboard.down(key);await p.waitForTimeout(ms);await p.keyboard.up(key);await p.waitForTimeout(550)}
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
            const rows=[];
            try{
              let page=await open(browser,390,844);const portrait=await meta(page);await page.screenshot({path:'.m09-worldfill/portrait-canonical.png',timeout:150000});rows.push(`portrait=${JSON.stringify(portrait)}`);await page.close();
              page=await open(browser,844,390);const lc=await meta(page);await page.screenshot({path:'.m09-worldfill/landscape-canonical.png',timeout:150000});
              await hold(page,'ArrowUp',7000);const ln=await meta(page);await page.screenshot({path:'.m09-worldfill/landscape-north.png',timeout:150000});
              const nd=delta(p3(lc.player),p3(ln.player));if(nd<.8)throw new Error(`landscape north not materially separated ${nd}`);
              await page.close();
              page=await open(browser,844,390);const ls=await meta(page);await hold(page,'ArrowDown',7200);const lso=await meta(page);await page.screenshot({path:'.m09-worldfill/landscape-south.png',timeout:150000});
              const sd=delta(p3(ls.player),p3(lso.player));if(sd<.4)throw new Error(`landscape south not materially separated ${sd}`);
              rows.push(`landscape_canonical=${JSON.stringify(lc)} landscape_north=${JSON.stringify(ln)} north_delta=${nd.toFixed(3)} landscape_south=${JSON.stringify(lso)} south_delta=${sd.toFixed(3)}`);
              if(lc.camera!=='landscape-tight'||ln.camera!=='landscape-tight'||lso.camera!=='landscape-tight')throw new Error('landscape camera profile missing');
              rows.push(`head=${process.env.GITHUB_SHA||'UNKNOWN'} page_errors=0 movement=PASS RESULT=EVIDENCE_READY`);fs.writeFileSync('.m09-worldfill/audit.txt',rows.join('\n')+'\n');await page.close();
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node regate.cjs
      - name: Add authorities
        if: always()
        run: |
          curl -L --fail --retry 3 -o .m09-worldfill/MINIMUM_QUALITY_LINE.png https://raw.githubusercontent.com/nisiyasu/-luke-quest/eb6ec9fafc053b6dbabb6ee473932b7c7851ebc6/assets/reference/owner_2026-09-11_ps1_visual_target/MINIMUM_QUALITY_LINE.png
          curl -L --fail --retry 3 -o .m09-worldfill/TARGET_PS1_FINAL.png https://raw.githubusercontent.com/nisiyasu/-luke-quest/eb6ec9fafc053b6dbabb6ee473932b7c7851ebc6/assets/reference/owner_2026-09-11_ps1_visual_target/TARGET_PS1_FINAL.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m09-p01-landscape-worldfill-regate
          path: .m09-worldfill
          include-hidden-files: true
          retention-days: 14