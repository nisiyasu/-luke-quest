name: Modern 3D M04 v45 Bank Fern Repair
on:
  push:
    branches: ["prototype/modern-3d"]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 0
      - name: Replace bank blade ferns with compound leaflets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('prototypes/modern-3d/m04-bank-target-v4.js')
          s=p.read_text()
          a=s.index('function makeFernPatch')
          b=s.index('function makeOrganicTop',a)
          new=base64.b64decode('').decode()
          p.write_text(s[:a]+new+s[b:])
          q=Path('prototypes/modern-3d/index.html')
          t=q.read_text()
          if 'Composition Rebuild v44' in t:t=t.replace('Composition Rebuild v44','Composition Rebuild v45',1)
          q.write_text(t)
          PY
          node --check prototypes/modern-3d/m04-bank-target-v4.js
          grep -q 'Float32BufferAttribute' prototypes/modern-3d/m04-bank-target-v4.js
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name nisiyasu
          git config user.email yasunori.hashigami@gmail.com
          git rm .github/workflows/modern-3d-m04-v45-bank-fern.yml
          git add prototypes/modern-3d/m04-bank-target-v4.js prototypes/modern-3d/index.html
          git commit -m 'fix(modern-3d): replace bank blade ferns with compound v45 foliage'
          git push origin HEAD:prototype/modern-3d
