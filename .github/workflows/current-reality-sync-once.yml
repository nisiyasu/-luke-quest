name: CURRENT reality sync once

on:
  push:
    paths:
      - '.github/workflows/current-reality-sync-once.yml'

permissions:
  contents: write

jobs:
  sync-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync CURRENT to fresh HEAD reality
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('CURRENT.md')
          t=p.read_text()
          t=re.sub(r'- UPDATED_AT: .*', '- UPDATED_AT: 2026-09-07 23:31 JST', t, count=1)
          t=re.sub(r'- LATEST_IMPLEMENTATION_COMMIT_SHA: `[^`]+`', '- LATEST_IMPLEMENTATION_COMMIT_SHA: `e8cbe227390a3b59673d6ed2a92fd08e8eeae53d`', t, count=1)
          t=re.sub(r'- CURRENT_BUILD_STATUS: `[^`]+`', '- CURRENT_BUILD_STATUS: `P0 INPUT / FULLSCREEN / EVAC GUIDANCE MACHINE RE-AUDIT GREEN / PAGES + RENDER LIVENESS GREEN / IOS_PHYSICAL_VERIFICATION=PENDING`', t, count=1)
          t=re.sub(r'- ACTIVE_REQUIREMENT_ID: `[^`]+`', '- ACTIVE_REQUIREMENT_ID: `NONE`', t, count=1)
          t=re.sub(r'- ACTIVE_REQUIREMENT_PATH: `[^`]+`', '- ACTIVE_REQUIREMENT_PATH: `NONE`', t, count=1)
          t=re.sub(r'- QUEUE_PROJECTION_STATUS: `[^`]+`', '- QUEUE_PROJECTION_STATUS: `No ordinary IN_PROGRESS or READY row. REQ-021/022/001/023 remain VERIFY with machine gates green; remaining non-VERIFY work is BLOCKED or Owner-art BACKLOG.`', t, count=1)
          t=re.sub(r'- RECENT_CHECKPOINTS: `[^`]+`', '- RECENT_CHECKPOINTS: `e8cbe227... REQ-023 smoke isolated from shared touch suite; 414431a7... isolated REQ-023 mode wiring; 72b49b32... dedicated REQ-023 browser gate; c0cae32a... P0 re-audit checkpoint.`', t, count=1)
          t=re.sub(r'- TESTS_AND_VERIFICATION: `[^`]+`', '- TESTS_AND_VERIFICATION: `HEAD e8cbe227...: REQ-023 gate run 34133245532 SUCCESS; standard Pages run 34133245493 SUCCESS; Render Liveness run 34133245531 SUCCESS; REQ-121 run 34133245454 SUCCESS; REQ-128 run 34133245510 SUCCESS. Prior false-red shared-smoke race eliminated by dedicated REQ-023 mode.`', t, count=1)
          t=re.sub(r'- KNOWN_ISSUES: `[^`]+`', '- KNOWN_ISSUES: `No machine regression currently observed in P0 touch/fullscreen/evacuation guidance paths. iPhone physical behavior for VERIFY items remains Owner-confirmation pending.`', t, count=1)
          t=re.sub(r'- BLOCKERS: `[^`]+`', '- BLOCKERS: `No machine-side blocker for current VERIFY set. REQ-059 and Chapter 2 Story Canon work remain separately BLOCKED per WORK_QUEUE.`', t, count=1)
          t=re.sub(r'- NEXT_ACTION: `[^`]+`', '- NEXT_ACTION: `With no ordinary IN_PROGRESS/READY work, continue highest-value safe player-visible gap audit without inventing Chapter 2 or formal Owner-art decisions; preserve P0 input authorities.`', t, count=1)
          t=re.sub(r'- NEXT_ACTION_COMPLETION_CONDITION: `[^`]+`', '- NEXT_ACTION_COMPLETION_CONDITION: `Any newly discovered defect is registered and repaired with focused browser regression + Pages/public inclusion evidence; otherwise preserve VERIFY and continue safe audit.`', t, count=1)
          # Repair explicitly stale historical status blocks that can mislead a fresh boot.
          t=t.replace('## REQ-127 — IPHONE PWA PERSISTENT BLACK SCREEN RECOVERY\n\n- STATUS: `IN_PROGRESS / ABSOLUTE P0`.', '## REQ-127 — IPHONE PWA PERSISTENT BLACK SCREEN RECOVERY\n\n- STATUS: `VERIFY / MACHINE RECOVERY COMPLETE / IOS_PHYSICAL_VERIFICATION=PENDING`.')
          t=t.replace('## REQ-117 — WORLD / CHARACTER VISUAL RICHNESS UPGRADE\n\n- STATUS: `READY`.', '## REQ-117 — WORLD / CHARACTER VISUAL RICHNESS UPGRADE\n\n- STATUS: `VERIFY`.')
          t=t.replace('## REQ-118 — HIGH-QUALITY HERO SELECTION OPENING\n\n- STATUS: `READY`.', '## REQ-118 — HIGH-QUALITY HERO SELECTION OPENING\n\n- STATUS: `VERIFY`.')
          p.write_text(t)
          PY
          rm .github/workflows/current-reality-sync-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT.md .github/workflows/current-reality-sync-once.yml
          git commit -m 'ops: sync CURRENT to e8cbe227 reality'
          git push origin HEAD:main
