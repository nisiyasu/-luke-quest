name: Modern 3D M04 v44 Compound Fern Repair
on:
  push:
    branches: ["prototype/modern-3d"]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 0
      - name: Apply compound fern asset repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('prototypes/modern-3d/m04-target-assets.js')
          s=p.read_text()
          a=s.index('export function createTargetFernPatch')
          b=s.index('export function createTargetBank',a)
          new=base64.b64decode('').decode()
          p.write_text(s[:a]+new+s[b:])
          q=Path('prototypes/modern-3d/index.html')
          t=q.read_text()
          if 'Composition Rebuild v43' in t:
              t=t.replace('Composition Rebuild v43','Composition Rebuild v44',1)
          q.write_text(t)
          PY
          node --check prototypes/modern-3d/m04-target-assets.js
          grep -q 'fern_patch_target_v3' prototypes/modern-3d/m04-target-assets.js
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name nisiyasu
          git config user.email yasunori.hashigami@gmail.com
          git rm .github/workflows/modern-3d-m04-v44-fern.yml
          git add prototypes/modern-3d/m04-target-assets.js prototypes/modern-3d/index.html
          git commit -m 'fix(modern-3d): replace blade ferns with compound v44 asset'
          git push origin HEAD:prototype/modern-3d
