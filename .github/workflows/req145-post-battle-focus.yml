name: REQ-145 Post-Battle Objective Focus

on:
  push:
    branches: ["experiment/gold-vertical-slice"]
    paths:
      - 'addons/zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz-req145-post-battle-focus.js'
      - '.github/workflows/req145-post-battle-focus.yml'
      - 'tools/lq-req145-assemble-local.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-battle-focus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate presentation source
        run: node --check addons/zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz-req145-post-battle-focus.js
      - name: Assemble challenger
        run: python3 tools/lq-req145-assemble-local.py --out req145-assembled.html
      - name: Exercise battle-to-world focus transition
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$BROWSER"
          python3 -m http.server 8128 >/tmp/req145-post-battle-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          timeout 30 "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,844 --virtual-time-budget=1800 --dump-dom 'http://127.0.0.1:8128/req145-assembled.html?lqReq145PostBattleSmoke=1' > /tmp/req145-post-battle-dom.html 2>/tmp/req145-post-battle-chrome.log || true
          test -s /tmp/req145-post-battle-dom.html
          grep -q 'id="lqReq145PostBattleFocusSmokeMarker"' /tmp/req145-post-battle-dom.html
          grep -q 'data-focus-presented="true"' /tmp/req145-post-battle-dom.html
          grep -q 'data-focus-count="1"' /tmp/req145-post-battle-dom.html
          grep -q 'data-focus-class="true"' /tmp/req145-post-battle-dom.html
          grep -q 'data-input-authority="false"' /tmp/req145-post-battle-dom.html
          grep -q 'data-save-authority="false"' /tmp/req145-post-battle-dom.html
          grep -q 'data-story-authority="false"' /tmp/req145-post-battle-dom.html
          grep -q 'data-battle-authority="false"' /tmp/req145-post-battle-dom.html
          if grep -q 'lqReq145PostBattleFocusSmokeFailure' /tmp/req145-post-battle-dom.html || grep -E 'Uncaught (ReferenceError|TypeError|SyntaxError)|ReferenceError:|SyntaxError:' /tmp/req145-post-battle-chrome.log; then
            cat /tmp/req145-post-battle-chrome.log
            exit 1
          fi
          echo 'REQ-145 battle-to-world objective focus PASS'
