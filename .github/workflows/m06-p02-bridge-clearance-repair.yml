name: M06-P02 Bridge Terrain Clearance Repair

on:
  push:
    branches:
      - prototype/modern-3d
    paths:
      - '.github/workflows/m06-p02-bridge-clearance-repair.yml'
      - 'prototypes/modern-3d/index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 0
      - name: Apply fail-closed M06-P02 bridge clearance repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prototypes/modern-3d/index.html')
          s=p.read_text(encoding='utf-8')
          marker='M06-P02 bridge-clearance-v1'
          if marker in s:
              print('repair already present')
              raise SystemExit(0)
          old='\n'.join([
              '// v55 quality-regate: terrain shoulders receive both bridge landings.',
              'bank(771,5.3,4.8,-4.55,1.05,-4.65,1,.10);',
              'bank(779,4.8,4.5,1.88,1.00,-4.55,1,-.10);',
              'bank(787,5.5,4.6,-4.65,-.22,6.70,-1,.08);',
              'bank(797,5.0,4.3,1.95,-.24,6.62,-1,-.09);'
          ])
          new='\n'.join([
              '// M06-P02 bridge-clearance-v1: keep receiving terrain outside the engineered deck envelope.',
              '// The landings still meet the banks, but grass/terrain may not visually bury the structural span.',
              'bank(771,4.35,4.8,-5.20,1.05,-4.65,1,.10);',
              'bank(779,3.95,4.5,2.55,1.00,-4.55,1,-.10);',
              'bank(787,4.45,4.6,-5.22,-.22,6.70,-1,.08);',
              'bank(797,3.95,4.3,2.58,-.24,6.62,-1,-.09);',
              'const bridgeThresholdMat=new THREE.MeshStandardMaterial({color:0x704c31,roughness:.88,metalness:0});',
              'const bridgeThresholdIron=new THREE.MeshStandardMaterial({color:0x343b3d,roughness:.50,metalness:.62});',
              'function bridgeThreshold(z,y,dir){',
              '  for(let i=-2;i<=2;i++){',
              '    const plank=new THREE.Mesh(new THREE.BoxGeometry(3.76,.12,.27),bridgeThresholdMat);',
              '    plank.position.set(-1.35,y,z+i*.285*dir);plank.receiveShadow=true;plank.castShadow=true;scene.add(plank);',
              '  }',
              '  for(const x of[-3.18,.48]){',
              '    const curb=new THREE.Mesh(new THREE.BoxGeometry(.14,.30,1.55),bridgeThresholdIron);',
              '    curb.position.set(x,y+.08,z);curb.receiveShadow=true;curb.castShadow=true;scene.add(curb);',
              '  }',
              '}',
              'bridgeThreshold(-3.62,1.085,-1);bridgeThreshold(5.72,-.195,1);'
          ])
          count=s.count(old)
          if count!=1:
              raise SystemExit(f'FAIL_CLOSED expected exactly one terrain-shoulder block, found {count}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          print('M06-P02 bridge clearance repair applied')
          PY
      - name: Verify causal invariants
        run: |
          grep -q 'M06-P02 bridge-clearance-v1' prototypes/modern-3d/index.html
          grep -q 'bridgeThreshold(-3.62,1.085,-1)' prototypes/modern-3d/index.html
          grep -q 'bridgeThreshold(5.72,-.195,1)' prototypes/modern-3d/index.html
          grep -q 'bank(771,4.35,4.8,-5.20' prototypes/modern-3d/index.html
          grep -q 'bank(797,3.95,4.3,2.58' prototypes/modern-3d/index.html
      - name: Commit repair if changed
        run: |
          if git diff --quiet -- prototypes/modern-3d/index.html; then
            echo 'No repair commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototypes/modern-3d/index.html
          git commit -m 'fix(m06-p02): clear terrain from bridge structure'
          git push origin HEAD:prototype/modern-3d
