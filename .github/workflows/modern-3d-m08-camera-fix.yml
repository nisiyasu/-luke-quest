name: Modern 3D M08 Camera Follow Fix

on:
  push:
    branches: [prototype/modern-3d]
    paths:
      - '.github/workflows/modern-3d-m08-camera-fix.yml'

permissions:
  contents: write

jobs:
  patch-m08-camera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 1
      - name: Patch frame-rate-independent camera damping
        shell: python
        run: |
          from pathlib import Path
          p=Path('prototypes/modern-3d/index.html')
          s=p.read_text()
          old="camera.position.lerp(target.clone().add(offset),.06);camera.lookAt(target.x,target.y+.45,target.z)"
          new="const cameraBlend=1-Math.exp(-4.2*dt);camera.position.lerp(target.clone().add(offset),cameraBlend);camera.lookAt(target.x,target.y+.45,target.z)"
          count=s.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one camera lerp call, found {count}')
          p.write_text(s.replace(old,new))
      - name: Verify exact scope
        run: |
          git diff --check
          grep -F 'const cameraBlend=1-Math.exp(-4.2*dt)' prototypes/modern-3d/index.html
          if grep -F 'camera.position.lerp(target.clone().add(offset),.06)' prototypes/modern-3d/index.html; then exit 1; fi
          git diff -- prototypes/modern-3d/index.html
      - name: Commit M08 camera fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototypes/modern-3d/index.html
          git diff --cached --quiet && exit 1
          git commit -m 'fix(modern-3d): make M08 camera follow frame-rate independent'
          git push origin HEAD:prototype/modern-3d
