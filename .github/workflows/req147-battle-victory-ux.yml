name: REQ-147 Battle Victory UX

on:
  push:
    paths:
      - 'requirements/REQ-147_BATTLE_UX_RESTORE_IN_BATTLE_VICTORY.md'
      - 'addons/req134-iphone-battle-touch-ui.js'
      - 'addons/req137-battle-victory-reward-summary.js'
      - 'addons/zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz-req147-battle-victory-smoke.js'
      - '.github/workflows/req147-battle-victory-ux.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  battle-victory-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check addons/req134-iphone-battle-touch-ui.js
          node --check addons/req137-battle-victory-reward-summary.js
          node --check addons/zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz-req147-battle-victory-smoke.js
      - name: Assemble Pages-equivalent runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          html=p.read_text()
          marker='<div id="app"></div><script>'
          guard='<div id="app"></div><script src="prelude/autosave-bootstrap-guard.js"></script><script>'
          if html.count(marker)!=1: raise SystemExit('base marker mismatch')
          p.write_text(html.replace(marker,guard,1))
          PY
          mapfile -t patches < <(printf '%s\n' ux-v*.js | sort -V)
          for f in "${patches[@]}"; do sed -i "s#</body>#<script src=\"$f\"></script></body>#" index.html; done
          if compgen -G 'addons/*.js' > /dev/null; then
            for f in addons/*.js; do sed -i "s#</body>#<script src=\"$f\"></script></body>#" index.html; done
          fi
      - name: 390x844 battle victory acceptance
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$BROWSER"
          python3 -m http.server 8147 >/tmp/lq-req147-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          timeout 35 "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --disable-extensions --disable-sync --no-first-run --window-size=390,844 --virtual-time-budget=8000 --dump-dom 'http://127.0.0.1:8147/?lqReq147Smoke=1' >/tmp/lq-req147-dom.html 2>/tmp/lq-req147-chrome.log || true
          grep -o '<i id="lqReq147SmokeMarker"[^>]*>' /tmp/lq-req147-dom.html | tee /tmp/lq-req147-marker.txt || true
          grep -q 'id="lqReq147SmokeMarker"[^>]*data-pass="true"' /tmp/lq-req147-dom.html
          echo 'REQ-147 battle victory UX acceptance PASS'
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: req147-diagnostics
          path: |
            /tmp/lq-req147-marker.txt
            /tmp/lq-req147-dom.html
            /tmp/lq-req147-chrome.log
            /tmp/lq-req147-http.log
          if-no-files-found: warn
          retention-days: 1
