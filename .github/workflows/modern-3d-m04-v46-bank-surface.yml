name: Modern 3D M04 v46 Bank Surface Fidelity
on:
  push:
    branches:
      - prototype/modern-3d
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          python3 tools/m04_v46_bank_surface_patch.py
          node --check prototypes/modern-3d/m04-bank-target-v4.js
          grep -q 'makeBankGrassMap' prototypes/modern-3d/m04-bank-target-v4.js
          grep -q "setAttribute('uv'" prototypes/modern-3d/m04-bank-target-v4.js
      - name: Commit
        shell: bash
        run: |
          git config user.name nisiyasu
          git config user.email yasunori.hashigami@gmail.com
          git rm .github/workflows/modern-3d-m04-v46-bank-surface.yml tools/m04_v46_bank_surface_patch.py
          git add prototypes/modern-3d/m04-bank-target-v4.js prototypes/modern-3d/index.html
          git commit -m 'fix(modern-3d): add textured organic bank tops v46'
          git push origin HEAD:prototype/modern-3d
