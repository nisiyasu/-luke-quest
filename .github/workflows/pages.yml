name: Deploy LUKE QUEST to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Validate presentation patches
        run: |
          node --check ux-v08.js
          node --check ux-v09.js
          node --check ux-v10.js
          node --check ux-v11.js
          node --check ux-v12.js
          node --check ux-v13.js
          node --check ux-v14.js
          node --check ux-v15.js
          node --check ux-v16.js
          node --check ux-v17.js
          node --check ux-v18.js
          node --check ux-v19.js
          node --check ux-v20.js
          node --check ux-v21.js
          node --check ux-v22.js
          node --check ux-v23.js
          node --check ux-v24.js
          node --check ux-v25.js

      - name: Validate base64 raster transport probe
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('assets/characters/transport-test.png.b64','utf8').trim();const b=Buffer.from(s,'base64');if(b.length<8||b[0]!==0x89||b.slice(1,4).toString()!=='PNG')throw new Error('transport probe is not a PNG payload');console.log('base64 raster transport probe decoded:',b.length,'bytes')"

      - name: Validate approved Luke dialogue asset
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('assets/characters/luke/dialogue-neutral.webp.b64','utf8').trim();const b=Buffer.from(s,'base64');if(b.length<16||b.slice(0,4).toString()!=='RIFF'||b.slice(8,12).toString()!=='WEBP')throw new Error('Luke dialogue asset is not a WebP payload');console.log('Luke dialogue WebP decoded:',b.length,'bytes')"

      - name: Inject v0.8 UX/world patch
        run: sed -i 's#</body>#<script src="ux-v08.js"></script></body>#' index.html

      - name: Inject v0.9 portrait dialogue patch
        run: sed -i 's#</body>#<script src="ux-v09.js"></script></body>#' index.html

      - name: Inject v0.10 battle presentation patch
        run: sed -i 's#</body>#<script src="ux-v10.js"></script></body>#' index.html

      - name: Inject v0.11 direction and victory-variety patch
        run: sed -i 's#</body>#<script src="ux-v11.js"></script></body>#' index.html

      - name: Inject v0.12 character asset transport patch
        run: sed -i 's#</body>#<script src="ux-v12.js"></script></body>#' index.html

      - name: Inject v0.13 map readability patch
        run: sed -i 's#</body>#<script src="ux-v13.js"></script></body>#' index.html

      - name: Inject v0.14 town services patch
        run: sed -i 's#</body>#<script src="ux-v14.js"></script></body>#' index.html

      - name: Inject v0.15 treasure chest patch
        run: sed -i 's#</body>#<script src="ux-v15.js"></script></body>#' index.html

      - name: Inject v0.16 inn interior patch
        run: sed -i 's#</body>#<script src="ux-v16.js"></script></body>#' index.html

      - name: Inject v0.17 item shop interior patch
        run: sed -i 's#</body>#<script src="ux-v17.js"></script></body>#' index.html

      - name: Inject v0.18 Royal Capital visual density patch
        run: sed -i 's#</body>#<script src="ux-v18.js"></script></body>#' index.html

      - name: Inject v0.19 field visual density patch
        run: sed -i 's#</body>#<script src="ux-v19.js"></script></body>#' index.html

      - name: Inject v0.20 forest atmosphere patch
        run: sed -i 's#</body>#<script src="ux-v20.js"></script></body>#' index.html

      - name: Inject v0.21 battle depth and impact patch
        run: sed -i 's#</body>#<script src="ux-v21.js"></script></body>#' index.html

      - name: Inject v0.22 treasure visual patch
        run: sed -i 's#</body>#<script src="ux-v22.js"></script></body>#' index.html

      - name: Inject v0.23 temple lobby patch
        run: sed -i 's#</body>#<script src="ux-v23.js"></script></body>#' index.html

      - name: Inject v0.24 contextual guidance patch
        run: sed -i 's#</body>#<script src="ux-v24.js"></script></body>#' index.html

      - name: Inject v0.25 original early-enemy vector art
        run: sed -i 's#</body>#<script src="ux-v25.js"></script></body>#' index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
