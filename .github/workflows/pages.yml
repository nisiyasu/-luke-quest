name: Deploy LUKE QUEST to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate sequential patches v08-v80
        shell: bash
        run: |
          for f in ux-v*.js; do
            v=$(echo "$f" | sed -E 's/ux-v([0-9]+)\.js/\1/')
            if ((10#$v >= 8 && 10#$v <= 80)); then node --check "$f"; fi
          done
      - name: Validate sequential patches v81-v120
        shell: bash
        run: |
          for f in ux-v*.js; do
            v=$(echo "$f" | sed -E 's/ux-v([0-9]+)\.js/\1/')
            if ((10#$v >= 81 && 10#$v <= 120)); then node --check "$f"; fi
          done
      - name: Validate sequential patches v121-plus
        shell: bash
        run: |
          mapfile -t patches < <(printf '%s\n' ux-v*.js | sort -V)
          test "${#patches[@]}" -gt 0
          test "${patches[0]}" = "ux-v08.js"
          for f in "${patches[@]}"; do
            v=$(echo "$f" | sed -E 's/ux-v([0-9]+)\.js/\1/')
            if ((10#$v >= 121)); then node --check "$f"; fi
          done
          node --check sw.js
      - name: Validate collision-safe add-ons
        shell: bash
        run: |
          if compgen -G 'addons/*.js' > /dev/null; then
            count=0
            for f in addons/*.js; do count=$((count+1)); node --check "$f"; done
            echo "Validated $count add-ons"
          fi
      - name: Run static regression guard
        run: node tools/lq-static-regression.mjs
      - name: Run add-on contract guard
        run: node tools/lq-addon-contract.mjs
      - name: Validate PWA files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'));console.log('manifest valid')"
          test -f assets/app-icon.svg
      - name: Validate base64 raster transport probe
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('assets/characters/transport-test.png.b64','utf8').trim();const b=Buffer.from(s,'base64');if(b.length<8||b[0]!==0x89||b.slice(1,4).toString()!=='PNG')throw new Error('transport probe is not a PNG payload')"
      - name: Validate approved Luke dialogue asset
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('assets/characters/luke/dialogue-neutral.webp.b64','utf8').trim();const b=Buffer.from(s,'base64');if(b.length<16||b.slice(0,4).toString()!=='RIFF'||b.slice(8,12).toString()!=='WEBP')throw new Error('Luke dialogue asset is not a WebP payload')"
      - name: Inject presentation patches in version order
        shell: bash
        run: |
          mapfile -t patches < <(printf '%s\n' ux-v*.js | sort -V)
          for f in "${patches[@]}"; do sed -i "s#</body>#<script src=\"$f\"></script></body>#" index.html; done
          if compgen -G 'addons/*.js' > /dev/null; then
            for f in addons/*.js; do sed -i "s#</body>#<script src=\"$f\"></script></body>#" index.html; done
          fi
      - name: Browser smoke test assembled game
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$BROWSER"
          python3 -m http.server 8123 >/tmp/lq-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1

          assert_dom() {
            local needle="$1" file="$2" label="$3"
            if ! grep -q "$needle" "$file"; then
              echo "Missing smoke assertion: $label ($needle)"
              grep -o 'lqRuntimeSmoke[^< ]*\|data-screen="[^"]*"\|data-map="[^"]*"\|data-shell="[^"]*"\|data-player="[^"]*"\|data-moved="[^"]*"\|data-interacted="[^"]*"\|data-dialog="[^"]*"\|data-x="[^"]*"\|data-y="[^"]*"' "$file" | tail -30 || true
              exit 1
            fi
          }

          set +e
          timeout 18 "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --disable-extensions --disable-sync --no-first-run --virtual-time-budget=3500 --dump-dom http://127.0.0.1:8123/ >/tmp/lq-title-dom.html 2>/tmp/lq-title-chrome.log
          title_status=$?
          set -e
          if [ ! -s /tmp/lq-title-dom.html ]; then
            echo "Chrome produced no title DOM (status $title_status)"
            cat /tmp/lq-title-chrome.log
            exit 1
          fi
          assert_dom 'LUKE QUEST' /tmp/lq-title-dom.html title
          assert_dom 'lqTitleStage' /tmp/lq-title-dom.html title-stage
          if grep -E 'Uncaught (ReferenceError|TypeError|SyntaxError)|ReferenceError:|SyntaxError:' /tmp/lq-title-chrome.log; then
            echo 'Browser title runtime error detected'
            cat /tmp/lq-title-chrome.log
            exit 1
          fi
          echo "LUKE QUEST headless title smoke PASS (chrome status $title_status)"

          set +e
          timeout 18 "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --disable-extensions --disable-sync --no-first-run --virtual-time-budget=4200 --dump-dom 'http://127.0.0.1:8123/?lqSmoke=1' >/tmp/lq-world-dom.html 2>/tmp/lq-world-chrome.log
          world_status=$?
          set -e
          if [ ! -s /tmp/lq-world-dom.html ]; then
            echo "Chrome produced no world DOM (status $world_status)"
            cat /tmp/lq-world-chrome.log
            exit 1
          fi
          assert_dom 'lqRuntimeSmokeMarker' /tmp/lq-world-dom.html smoke-marker
          assert_dom 'data-screen="world"' /tmp/lq-world-dom.html world-state
          assert_dom 'data-shell="true"' /tmp/lq-world-dom.html world-shell
          assert_dom 'data-player="true"' /tmp/lq-world-dom.html world-player
          assert_dom 'data-moved="true"' /tmp/lq-world-dom.html player-movement
          assert_dom 'data-interacted="true"' /tmp/lq-world-dom.html npc-interaction
          assert_dom 'data-dialog="旅好きの老人"' /tmp/lq-world-dom.html npc-dialogue
          if grep -q 'lqRuntimeSmokeFailure' /tmp/lq-world-dom.html || grep -E 'Uncaught (ReferenceError|TypeError|SyntaxError)|ReferenceError:|SyntaxError:' /tmp/lq-world-chrome.log; then
            echo 'Browser world runtime error detected'
            cat /tmp/lq-world-chrome.log
            exit 1
          fi
          echo "LUKE QUEST headless world + movement + interaction smoke PASS (chrome status $world_status)"
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
