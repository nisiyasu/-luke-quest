name: Deploy LUKE QUEST to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Validate presentation patches
        run: |
          node --check ux-v08.js
          node --check ux-v09.js
          node --check ux-v10.js
          node --check ux-v11.js
          node --check ux-v12.js

      - name: Validate base64 raster transport probe
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('assets/characters/transport-test.png.b64','utf8').trim();const b=Buffer.from(s,'base64');if(b.length<8||b[0]!==0x89||b.slice(1,4).toString()!=='PNG')throw new Error('transport probe is not a PNG payload');console.log('base64 raster transport probe decoded:',b.length,'bytes')"

      - name: Inject v0.8 UX/world patch
        run: sed -i 's#</body>#<script src="ux-v08.js"></script></body>#' index.html

      - name: Inject v0.9 portrait dialogue patch
        run: sed -i 's#</body>#<script src="ux-v09.js"></script></body>#' index.html

      - name: Inject v0.10 battle presentation patch
        run: sed -i 's#</body>#<script src="ux-v10.js"></script></body>#' index.html

      - name: Inject v0.11 direction and victory-variety patch
        run: sed -i 's#</body>#<script src="ux-v11.js"></script></body>#' index.html

      - name: Inject v0.12 character asset transport patch
        run: sed -i 's#</body>#<script src="ux-v12.js"></script></body>#' index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
