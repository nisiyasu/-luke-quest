name: Deploy LUKE QUEST to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate presentation patches
        run: |
          for f in ux-v08.js ux-v09.js ux-v10.js ux-v11.js ux-v12.js ux-v13.js ux-v14.js ux-v15.js ux-v16.js ux-v17.js ux-v18.js ux-v19.js ux-v20.js ux-v21.js ux-v22.js ux-v23.js ux-v24.js ux-v25.js ux-v26.js ux-v27.js ux-v28.js ux-v29.js ux-v30.js ux-v31.js ux-v32.js ux-v33.js ux-v34.js ux-v35.js ux-v36.js ux-v37.js ux-v38.js; do node --check "$f"; done
          node --check sw.js
      - name: Validate PWA files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'));console.log('manifest valid')"
          test -f assets/app-icon.svg
      - name: Validate base64 raster transport probe
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('assets/characters/transport-test.png.b64','utf8').trim();const b=Buffer.from(s,'base64');if(b.length<8||b[0]!==0x89||b.slice(1,4).toString()!=='PNG')throw new Error('transport probe is not a PNG payload')"
      - name: Validate approved Luke dialogue asset
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('assets/characters/luke/dialogue-neutral.webp.b64','utf8').trim();const b=Buffer.from(s,'base64');if(b.length<16||b.slice(0,4).toString()!=='RIFF'||b.slice(8,12).toString()!=='WEBP')throw new Error('Luke dialogue asset is not a WebP payload')"
      - name: Inject presentation patches
        run: |
          for f in ux-v08.js ux-v09.js ux-v10.js ux-v11.js ux-v12.js ux-v13.js ux-v14.js ux-v15.js ux-v16.js ux-v17.js ux-v18.js ux-v19.js ux-v20.js ux-v21.js ux-v22.js ux-v23.js ux-v24.js ux-v25.js ux-v26.js ux-v27.js ux-v28.js ux-v29.js ux-v30.js ux-v31.js ux-v32.js ux-v33.js ux-v34.js ux-v35.js ux-v36.js ux-v37.js ux-v38.js; do sed -i "s#</body>#<script src=\"$f\"></script></body>#" index.html; done
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
