name: M03 v60 Runtime Audit Retry2

on:
  push:
    branches:
      - prototype/modern-3d
    paths:
      - .github/workflows/m03-v60-runtime-audit-retry2.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/modern-3d
          fetch-depth: 0
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Capture actual v60 runtime
        run: |
          python3 -m http.server 8140 --directory prototypes/modern-3d >/tmp/lq-http.log 2>&1 &
          sleep 2
          node scripts/m03_v60_capture.js
      - name: Assemble comparison bundle
        run: |
          mkdir -p audit-bundle
          cp prototypes/modern-3d/evidence/m03-v60-390x844.png audit-bundle/CURRENT_M03_V60.png
          cp prototypes/modern-3d/evidence/m03-v60-runtime.json audit-bundle/runtime.json
          curl -L --fail --retry 3 -o audit-bundle/MINIMUM_QUALITY_LINE.png https://raw.githubusercontent.com/nisiyasu/-luke-quest/eb6ec9fafc053b6dbabb6ee473932b7c7851ebc6/assets/reference/owner_2026-09-11_ps1_visual_target/MINIMUM_QUALITY_LINE.png
          curl -L --fail --retry 3 -o audit-bundle/TARGET_PS1_FINAL.png https://raw.githubusercontent.com/nisiyasu/-luke-quest/eb6ec9fafc053b6dbabb6ee473932b7c7851ebc6/assets/reference/owner_2026-09-11_ps1_visual_target/TARGET_PS1_FINAL.png
      - uses: actions/upload-artifact@v4
        with:
          name: m03-v60-runtime-audit-bundle-retry2
          path: audit-bundle
          if-no-files-found: error
      - name: Commit runtime evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototypes/modern-3d/evidence/m03-v60-390x844.png prototypes/modern-3d/evidence/m03-v60-runtime.json
          git commit -m "test(m03): capture v60 runtime evidence"
          git push origin HEAD:prototype/modern-3d
