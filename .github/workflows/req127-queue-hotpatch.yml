name: REQ-121 queue transition

on:
  push:
    paths:
      - '.github/workflows/req127-queue-hotpatch.yml'

permissions:
  contents: write

jobs:
  patch-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote REQ-121 to IN_PROGRESS
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('WORK_QUEUE.md')
          text=p.read_text()
          old='| -1 | REQ-121 | P0 | READY | Cloudbreak → Wind Stair Transition Deadlock Fix | `requirements/REQ-121_CLOUDBREAK_WIND_STAIR_TRANSITION_DEADLOCK_FIX.md` | Owner iPhone実機で再現したハード進行不能。雲上の鞍部の「次の高所へ続く石段跡」が会話を再表示するだけで既存`windStairRidge`へ遷移しない。最新Owner直接指示により全READY案件より最優先。新しい北追跡マップは作らず既存遷移だけ復旧する。 |'
          new='| -1 | REQ-121 | P0 | IN_PROGRESS | Cloudbreak → Wind Stair Transition Deadlock Fix | `requirements/REQ-121_CLOUDBREAK_WIND_STAIR_TRANSITION_DEADLOCK_FIX.md` | Active WIP. Restore the missing canonical Cloudbreak north-boundary transition into existing `windStairRidge`; preserve tap/drag/fullscreen/input authorities, south return, save/story state, and add regression coverage. IOS_PHYSICAL_VERIFICATION=PENDING. |'
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('REQ-121 READY row not found exactly; fail closed')
          if '| IN_PROGRESS |' in text:
              raise SystemExit('another IN_PROGRESS row exists; fail closed')
          p.write_text(text.replace(old,new,1))
          PY
      - name: Verify WIP and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('WORK_QUEUE.md').read_text()
          assert t.count('| IN_PROGRESS |') == 1
          assert '| -1 | REQ-121 | P0 | IN_PROGRESS |' in t
          PY
          if git diff --quiet -- WORK_QUEUE.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WORK_QUEUE.md
          git commit -m 'queue: promote REQ-121 progression blocker to IN_PROGRESS'
          git push origin HEAD:main
