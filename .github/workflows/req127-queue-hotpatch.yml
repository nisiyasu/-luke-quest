name: REQ-121 queue transition

on:
  push:
    paths:
      - '.github/workflows/req127-queue-hotpatch.yml'

permissions:
  contents: write

jobs:
  patch-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Transition REQ-121 to VERIFY
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('WORK_QUEUE.md')
          text=p.read_text()
          old='| -1 | REQ-121 | P0 | IN_PROGRESS | Cloudbreak → Wind Stair Transition Deadlock Fix | `requirements/REQ-121_CLOUDBREAK_WIND_STAIR_TRANSITION_DEADLOCK_FIX.md` | Active WIP. Restore the missing canonical Cloudbreak north-boundary transition into existing `windStairRidge`; preserve tap/drag/fullscreen/input authorities, south return, save/story state, and add regression coverage. IOS_PHYSICAL_VERIFICATION=PENDING. |'
          new='| -1 | REQ-121 | P0 | VERIFY | Cloudbreak → Wind Stair Transition Deadlock Fix | `requirements/REQ-121_CLOUDBREAK_WIND_STAIR_TRANSITION_DEADLOCK_FIX.md` | Machine implementation complete. One canonical Action now enters existing `windStairRidge`; safe walkable entry + south return + flag preservation acceptance PASS. Historical REQ-108 boundary smoke made forward-compatible; standard Pages run 34073496787 SUCCESS including REQ-081/082 and 390x844 gates. IOS_PHYSICAL_VERIFICATION=PENDING. |'
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('REQ-121 IN_PROGRESS row not found exactly; fail closed')
          p.write_text(text.replace(old,new,1))
          PY
      - name: Verify queue transition and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('WORK_QUEUE.md').read_text()
          assert '| -1 | REQ-121 | P0 | VERIFY |' in t
          assert '| -1 | REQ-121 | P0 | IN_PROGRESS |' not in t
          assert t.count('| IN_PROGRESS |') == 0
          PY
          if git diff --quiet -- WORK_QUEUE.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WORK_QUEUE.md
          git commit -m 'queue: transition REQ-121 progression fix to VERIFY'
          git push origin HEAD:main
