name: REQ-117 queue transition

on:
  push:
    paths:
      - '.github/workflows/req127-queue-hotpatch.yml'

permissions:
  contents: write

jobs:
  patch-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote REQ-117 to IN_PROGRESS
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('WORK_QUEUE.md')
          text=p.read_text()
          old='| 108 | REQ-117 | P1 | READY | World / Character Visual Richness Upgrade | `requirements/REQ-117_WORLD_CHARACTER_VISUAL_RICHNESS_UPGRADE.md` | Owner-directed presentation upgrade: character foot shadows, restrained idle motion, interaction popup easing, map edge blending/depth shadows/ambient air, and field-sprite outline/3-tone/detail/eye richness. Preserve input/collision/save/story authorities. |'
          new='| 108 | REQ-117 | P1 | IN_PROGRESS | World / Character Visual Richness Upgrade | `requirements/REQ-117_WORLD_CHARACTER_VISUAL_RICHNESS_UPGRADE.md` | Active WIP. Execute staged presentation-only Checkpoints A-D; begin with universal foot shadows, restrained idle motion and interaction affordance easing. Preserve canonical input/collision/save/story and approved art authority. IOS_PHYSICAL_VERIFICATION=PENDING. |'
          if new in text: raise SystemExit(0)
          if old not in text: raise SystemExit('REQ-117 READY row not found exactly; fail closed')
          if '| IN_PROGRESS |' in text: raise SystemExit('another IN_PROGRESS row exists; fail closed')
          p.write_text(text.replace(old,new,1))
          PY
      - name: Verify WIP and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('WORK_QUEUE.md').read_text()
          assert t.count('| IN_PROGRESS |') == 1
          assert '| 108 | REQ-117 | P1 | IN_PROGRESS |' in t
          PY
          if git diff --quiet -- WORK_QUEUE.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WORK_QUEUE.md
          git commit -m 'queue: promote REQ-117 visual richness to IN_PROGRESS'
          git push origin HEAD:main
