name: Reconcile REQ-143 Queue and Current

on:
  push:
    paths:
      - '.github/workflows/queue-current-reconcile-req143.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile WORK_QUEUE and CURRENT
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          q=Path('WORK_QUEUE.md')
          s=q.read_text()
          row='| 125 | REQ-143 | P0 | IN_PROGRESS | Game Quality System / Leon Gold Standard Scene Rebuild | `requirements/REQ-143_GAME_QUALITY_SYSTEM_AND_LEON_GOLD_STANDARD.md` | Quality System v1 active; Leon climax Q5 candidate published. Developer-facing quality labels removed; P0 Touch, REQ-143 quality gate, Pages and Render Liveness GREEN on `01ac0463...`. OWNER_EXPERIENCE_PASS=PENDING. |\n'
          if 'REQ-143 |' not in s:
              marker='\n## STATUS DEFINITIONS\n'
              if marker not in s: raise SystemExit('WORK_QUEUE status marker missing')
              s=s.replace(marker,'\n'+row+marker,1)
              q.write_text(s)

          p=Path('CURRENT.md')
          c=p.read_text()
          replacements={
            r'- UPDATED_AT: `[^`]+`':'- UPDATED_AT: `2026-09-08 22:28 JST`',
            r'- LATEST_IMPLEMENTATION_COMMIT_SHA: `[^`]+`':'- LATEST_IMPLEMENTATION_COMMIT_SHA: `01ac0463ab0f4b27053066f5e3b5abcebc286981`',
            r'- LATEST_VERIFIED_RUNTIME_HEAD_SHA: `[^`]+`':'- LATEST_VERIFIED_RUNTIME_HEAD_SHA: `01ac0463ab0f4b27053066f5e3b5abcebc286981`',
            r'- CURRENT_BUILD_STATUS: `[^`]+`':'- CURRENT_BUILD_STATUS: `REQ-143 IN_PROGRESS. Leon climax Q5 candidate is public; production cleanup removed internal quality labels. Exact-head P0 Touch 34231724124 SUCCESS, REQ-143 Quality 34231724111 SUCCESS, Pages 34231724251 SUCCESS, Render Liveness 34231724366 SUCCESS. OWNER_EXPERIENCE_PASS=PENDING.`',
            r'- ACTIVE_REQUIREMENT_ID: `[^`]+`':'- ACTIVE_REQUIREMENT_ID: `REQ-143`',
            r'- ACTIVE_REQUIREMENT_PATH: `[^`]+`':'- ACTIVE_REQUIREMENT_PATH: `requirements/REQ-143_GAME_QUALITY_SYSTEM_AND_LEON_GOLD_STANDARD.md`',
            r'- BLOCKERS: `[^`]+`':'- BLOCKERS: `No machine/public hard blocker. REQ-143 final subjective Gold Standard acceptance remains Owner experience PENDING.`',
            r'- NEXT_ACTION: `[^`]+`':'- NEXT_ACTION: `Continue REQ-143 Gold Standard player-visible refinement from fresh HEAD without changing canon/input/save authority; preserve exact-head P0/public gates and remove any remaining prototype/debug presentation.`',
            r'- NEXT_ACTION_COMPLETION_CONDITION: `[^`]+`':'- NEXT_ACTION_COMPLETION_CONDITION: `REQ-143 remains machine/public green after further material polish and reaches a credible owner-review candidate; do not claim OWNER_EXPERIENCE_PASS until Owner confirms.`',
          }
          for pattern,value in replacements.items():
              c,n=re.subn(pattern,value,c,count=1)
              if n!=1: raise SystemExit(f'CURRENT field mismatch: {pattern}')
          # append factual checkpoints without rewriting historical body
          c=c.replace('- RECENT_CHECKPOINTS: `','- RECENT_CHECKPOINTS: `ede53279 REQ-143 P0 watch expansion; 01ac0463 production cleanup; ',1)
          c=c.replace('- TESTS_AND_VERIFICATION: `','- TESTS_AND_VERIFICATION: `REQ-143 exact-head P0 Touch 34231724124 SUCCESS; Quality 34231724111 SUCCESS; Pages 34231724251 SUCCESS; Render Liveness 34231724366 SUCCESS. ',1)
          c=c.replace('- SELF_REPAIR_ACTIONS: `','- SELF_REPAIR_ACTIONS: `Detected REQ-143 missing from WORK_QUEUE; added P0 touch watch coverage; removed player-visible developer quality labels; ',1)
          p.write_text(c)
          PY
      - name: Commit reconciliation and self-delete
        shell: bash
        run: |
          git config user.name 'LUKE QUEST autonomous reconciler'
          git config user.email 'actions@users.noreply.github.com'
          git add WORK_QUEUE.md CURRENT.md
          git rm .github/workflows/queue-current-reconcile-req143.yml
          git commit -m 'REQ-143: reconcile queue and autosave'
          git push
